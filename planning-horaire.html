<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planning Horaire</title>
<link rel="manifest" href="planning-horaire-manifest.json">
<meta name="theme-color" content="#6fae52">
<style>
/* Layout: single-page app, top tab bar (Semaine / Jour / Report), card-based day rows, pistachio accent on warm neutral ground */
:root{
  --bg:#f7f7f2;
  --surface:#ffffff;
  --surface-2:#eef3e6;
  --fg:#2b2f28;
  --fg-muted:#6b7266;
  --border:#dde3d3;
  --accent:#6fae52;
  --accent-strong:#4f8a38;
  --accent-soft:#dcedd0;
  --good:#3f8f4f;
  --warn:#c9822a;
  --bad:#c15b4a;
  --font-display:'Fredoka',system-ui,sans-serif;
  --font-body:'Nunito Sans',system-ui,-apple-system,sans-serif;
  --font-mono:'Space Mono',monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c2018;
    --surface:#262b22;
    --surface-2:#2f3528;
    --fg:#eef1e9;
    --fg-muted:#a3ab98;
    --border:#3b4232;
    --accent:#8fcb6f;
    --accent-strong:#a6db88;
    --accent-soft:#36492c;
    --good:#8fcb6f;
    --warn:#e0a855;
    --bad:#e08271;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1c2018;
  --surface:#262b22;
  --surface-2:#2f3528;
  --fg:#eef1e9;
  --fg-muted:#a3ab98;
  --border:#3b4232;
  --accent:#8fcb6f;
  --accent-strong:#a6db88;
  --accent-soft:#36492c;
  --good:#8fcb6f;
  --warn:#e0a855;
  --bad:#e08271;
  color-scheme:dark;
}
*{box-sizing:border-box;}
body{
  background:var(--bg);
  color:var(--fg);
  font-family:var(--font-body);
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:16px 32px;
  min-height:100%;
}
h1,h2,h3{font-family:var(--font-display); text-wrap:balance; margin:0;}
.app{max-width:480px; margin:0 auto; display:flex; flex-direction:column; gap:14px;}

header.top{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding-top:env(safe-area-inset-top,0px);
}
header.top .title{display:flex; align-items:center; gap:8px;}
header.top .title .leaf{font-size:22px;}
header.top h1{font-size:20px; font-weight:600; letter-spacing:-0.01em;}
.weeklabel{font-size:12px; color:var(--fg-muted); font-weight:600;}

nav.tabs{
  display:flex; gap:6px; background:var(--surface-2); border-radius:14px; padding:4px;
}
nav.tabs button{
  flex:1; border:none; background:transparent; color:var(--fg-muted); font-family:var(--font-body);
  font-weight:700; font-size:13px; padding:10px 6px; border-radius:11px; cursor:pointer;
  transition:background .15s ease, color .15s ease;
}
nav.tabs button.active{background:var(--surface); color:var(--accent-strong); box-shadow:0 1px 2px rgba(0,0,0,.08);}

.card{
  background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px 16px;
}
.card + .card{margin-top:0;}

.balance-card{
  background:var(--accent-soft); border:1px solid var(--border); border-radius:16px; padding:16px;
  display:flex; flex-direction:column; gap:4px;
}
.balance-card .label{font-size:12px; font-weight:700; color:var(--accent-strong); text-transform:uppercase; letter-spacing:.04em;}
.balance-card .value{font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:22px; font-weight:700;}
.balance-card .sub{font-size:12px; color:var(--fg-muted);}

.stat-row{display:flex; gap:10px;}
.stat-row .card{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;}
.stat-row .stat-label{font-size:11px; color:var(--fg-muted); font-weight:700; text-transform:uppercase; letter-spacing:.03em;}
.stat-row .stat-value{font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:18px; font-weight:700;}

.day-row{
  display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border);
}
.day-row:last-child{border-bottom:none;}
.day-row .d-name{width:60px; font-weight:800; font-size:17px; flex-shrink:0;}
.day-row .d-reset{
  background:none; border:none; color:var(--fg-muted); font-size:14px; padding:4px 6px; cursor:pointer; flex-shrink:0;
}
.day-row .d-info{flex:1; min-width:0; font-size:12px; color:var(--fg-muted);}
.day-row .d-info .times{font-family:var(--font-mono); font-variant-numeric:tabular-nums; color:var(--fg);}
.day-row .d-ecart{font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-weight:700; font-size:13px; flex-shrink:0; text-align:right; min-width:58px;}
.d-ecart.pos{color:var(--good);}
.d-ecart.neg{color:var(--bad);}
.d-ecart.zero{color:var(--fg-muted);}
.d-status{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
.d-status.done{background:var(--accent);}
.d-status.pending{background:var(--border);}

.tip{
  background:var(--surface-2); border-radius:14px; padding:12px 14px; font-size:13px; line-height:1.4;
  display:flex; gap:8px; align-items:flex-start;
}
.tip .ic{flex-shrink:0;}

/* Day entry screen */
.day-tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px;}
.day-tabs button{
  flex-shrink:0; border:1px solid var(--border); background:var(--surface); color:var(--fg-muted);
  font-family:var(--font-body); font-weight:700; font-size:12px; padding:8px 12px; border-radius:10px; cursor:pointer;
}
.day-tabs button.active{background:var(--accent); color:#fff; border-color:var(--accent);}
.day-tabs button.has-data::after{content:" ●"; font-size:8px; vertical-align:middle;}

.field-group{display:flex; flex-direction:column; gap:10px;}
.field{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--border);}
.field:last-child{border-bottom:none;}
.field label{font-size:14px; font-weight:600; display:flex; align-items:center; gap:8px;}
.field input[type="time"]{
  font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:17px; font-weight:700;
  background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:8px 10px; color:var(--fg);
  width:112px; text-align:center;
}
.field input[type="time"]::-webkit-calendar-picker-indicator{filter:var(--icon-filter, none); opacity:.6;}

.daysummary{
  margin-top:4px; display:flex; align-items:center; justify-content:space-between;
  background:var(--accent-soft); border-radius:12px; padding:12px 14px;
}
.daysummary .ds-label{font-size:12px; color:var(--accent-strong); font-weight:700;}
.daysummary .ds-value{font-family:var(--font-mono); font-size:20px; font-weight:700;}

button.primary{
  background:var(--accent); color:#fff; border:none; border-radius:12px; padding:13px; font-size:14px;
  font-weight:700; font-family:var(--font-body); cursor:pointer; width:100%;
}
button.primary:active{background:var(--accent-strong);}
button.ghost{
  background:var(--surface-2); color:var(--fg); border:1px solid var(--border); border-radius:12px; padding:13px;
  font-size:14px; font-weight:700; font-family:var(--font-body); cursor:pointer; width:100%;
}
.btn-row{display:flex; gap:8px;}
.btn-row > *{flex:1;}

/* Report screen */
.week-item{
  display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border);
}
.week-item:last-child{border-bottom:none;}
.week-item input[type="checkbox"]{
  width:20px; height:20px; accent-color:var(--accent); flex-shrink:0; cursor:pointer;
}
.week-item .wi-label{flex:1; font-size:14px; font-weight:600;}
.week-item .wi-value{font-family:var(--font-mono); font-weight:700; font-size:14px;}
.week-item .wi-value.pos{color:var(--good);}
.week-item .wi-value.neg{color:var(--bad);}

.mode-option{
  display:flex; align-items:flex-start; gap:10px; padding:12px; border:1px solid var(--border); border-radius:12px; cursor:pointer;
}
.mode-option.selected{border-color:var(--accent); background:var(--accent-soft);}
.mode-option input{margin-top:3px; accent-color:var(--accent); width:18px; height:18px; flex-shrink:0;}
.mode-option .mo-title{font-weight:700; font-size:14px;}
.mode-option .mo-desc{font-size:12px; color:var(--fg-muted); margin-top:2px;}

.section-title{font-size:13px; font-weight:800; color:var(--fg-muted); text-transform:uppercase; letter-spacing:.04em; margin:2px 0 0;}

footer.note{text-align:center; font-size:11px; color:var(--fg-muted); padding-top:6px;}

.day-row.clickable{cursor:pointer;}
.day-row.clickable:active{background:var(--surface-2); border-radius:10px;}

.modal-backdrop{
  position:fixed; inset:0; background:rgba(20,22,16,.45); display:flex; align-items:flex-end; justify-content:center;
  padding:0; z-index:50;
}
.modal-sheet{
  width:100%; max-width:480px; background:var(--surface); border-radius:20px 20px 0 0;
  padding:18px max(18px, env(safe-area-inset-left,0px)) max(18px, calc(env(safe-area-inset-bottom,0px) + 18px)) max(18px, env(safe-area-inset-right,0px));
  display:flex; flex-direction:column; gap:12px; max-height:85vh; overflow-y:auto;
}
.modal-header{display:flex; align-items:center; justify-content:space-between;}
.modal-close{
  background:var(--surface-2); border:none; color:var(--fg-muted); width:30px; height:30px; border-radius:50%;
  font-size:16px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center;
}

.mode-toggle{display:flex; gap:6px;}
.mode-toggle button{
  flex:1; border:1px solid var(--border); background:var(--surface); color:var(--fg-muted);
  font-family:var(--font-body); font-weight:700; font-size:12px; padding:10px 8px; border-radius:12px; cursor:pointer;
  text-align:center; line-height:1.3;
}
.mode-toggle button.active{background:var(--accent); color:#fff; border-color:var(--accent);}

.pointage-card{display:flex; flex-direction:column; gap:8px;}
.pointage-time{font-size:28px; font-weight:700; font-family:var(--font-mono); text-align:center; margin-top:4px;}
.field .punched-tag{font-size:10px; font-weight:700; color:var(--accent-strong); background:var(--accent-soft); border-radius:6px; padding:2px 6px; margin-left:6px;}

.slide-confirm{
  position:relative; height:56px; border-radius:28px; background:var(--surface-2); border:1px solid var(--border);
  display:flex; align-items:center; padding:4px; overflow:hidden; touch-action:none;
}
.slide-confirm .sc-label{
  position:absolute; left:0; right:0; text-align:center; font-weight:700; font-size:13px; color:var(--fg-muted);
  pointer-events:none;
}
.slide-confirm .sc-thumb{
  width:48px; height:48px; border-radius:50%; background:var(--accent); color:#fff; font-size:20px;
  display:flex; align-items:center; justify-content:center; position:relative; z-index:2; cursor:grab; touch-action:none;
  box-shadow:0 2px 6px rgba(0,0,0,.2);
}
</style>

<body>
<div class="app" id="app"></div>

<script>
(function(){
"use strict";

// ---------- Schedule reference (minutes) ----------
var DEFAULT_SETTINGS = {
  // Mon-Thu
  weekday: { arrival:"07:00", lunchStart:"12:00", lunchEnd:"12:45", departure:"16:45", defaultDeparture:"16:15", refMin: 8*60+30 },
  // Friday
  friday:  { arrival:"07:00", lunchStart:"12:00", lunchEnd:"12:45", departure:"14:35", defaultDeparture:"14:35", refMin: 6*60+50 }
};
var WEEK_TARGET_MIN = 40*60+50;
var DAYS = ["lundi","mardi","mercredi","jeudi","vendredi"];
var DAY_LABELS = {lundi:"Lundi", mardi:"Mardi", mercredi:"Mercredi", jeudi:"Jeudi", vendredi:"Vendredi"};
var DAY_SHORT = {lundi:"Lun", mardi:"Mar", mercredi:"Mer", jeudi:"Jeu", vendredi:"Ven"};

// ---------- Storage ----------
var STORE_KEY = "planning-horaire-v3";
function loadStore(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {
    settings: DEFAULT_SETTINGS,
    currentWeek: {}, // { lundi: {arrival,lunchStart,lunchEnd,departure}, ... }
    pot: { totalMin: 60, spreadWeeks: 0 }, // pot d'heures sup/insup ; spreadWeeks=0 = pas étalé, reste en réserve
    reportMode: "vendredi" // "vendredi" | "repartir"
  };
}
function saveStore(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}

var state = loadStore();
var currentTab = "semaine";
var modalDay = null;

// ---------- Time helpers ----------
function toMin(hhmm){
  if(!hhmm) return null;
  var p = hhmm.split(":"); return (+p[0])*60 + (+p[1]);
}
function toHHMM(min){
  min = Math.round(min);
  var neg = min<0; min = Math.abs(min);
  var h = Math.floor(min/60), m = min%60;
  return (neg?"-":"")+h+"h"+(m<10?"0":"")+m;
}
function toClock(min){
  min = Math.round(min);
  min = ((min%1440)+1440)%1440;
  var h = Math.floor(min/60), m = min%60;
  return (h<10?"0":"")+h+":"+(m<10?"0":"")+m;
}

function dayRef(day){ return day==="vendredi" ? state.settings.friday : state.settings.weekday; }

function ensureDayDefaults(day){
  var ref = dayRef(day);
  if(!state.currentWeek[day]) state.currentWeek[day] = {};
  var d = state.currentWeek[day];
  var changed = false;
  if(!d.arrival){ d.arrival = ref.arrival; changed = true; }
  if(!d.lunchStart){ d.lunchStart = ref.lunchStart; changed = true; }
  if(!d.lunchEnd){ d.lunchEnd = ref.lunchEnd; changed = true; }
  if(!d.departure){ d.departure = ref.defaultDeparture || ref.departure || ""; changed = true; }
  if(d.skipMorningBreak===undefined){ d.skipMorningBreak = false; changed = true; }
  if(d.skipAfternoonBreak===undefined){ d.skipAfternoonBreak = false; changed = true; }
  if(!d.punched){ d.punched = {}; changed = true; }
  if(changed) saveStore();
}
DAYS.forEach(ensureDayDefaults);

// ---------- Pointage (horodatage en un clic) ----------
var FIELD_ORDER = ["arrival","lunchStart","lunchEnd","departure"];
var FIELD_LABELS = {arrival:"Arrivée", lunchStart:"Pause midi", lunchEnd:"Reprise", departure:"Départ"};
var FIELD_EMOJI = {arrival:"🕒", lunchStart:"🍽️", lunchEnd:"☕", departure:"🚪"};
var pointageOpen = false;
var pointagePending = null; // { day, field, time }

function todayKey(){
  var jsDay = new Date().getDay(); // 0=Dim ... 6=Sam
  var map = {1:"lundi",2:"mardi",3:"mercredi",4:"jeudi",5:"vendredi"};
  return map[jsDay] || null;
}
function nowHHMM(){
  var now = new Date();
  var hh = (now.getHours()<10?"0":"")+now.getHours();
  var mm = (now.getMinutes()<10?"0":"")+now.getMinutes();
  return hh+":"+mm;
}
function nextPunchField(day){
  var d = state.currentWeek[day] || {};
  var p = d.punched || {};
  for(var i=0;i<FIELD_ORDER.length;i++){
    if(!p[FIELD_ORDER[i]]) return FIELD_ORDER[i];
  }
  return null;
}
function openPointage(){
  var day = todayKey();
  if(!day) return;
  var field = nextPunchField(day);
  if(!field) return;
  pointagePending = { day: day, field: field, time: nowHHMM() };
  pointageOpen = true;
  render();
}
function confirmPointage(){
  var p = pointagePending;
  if(!p || !p.field){ pointageOpen = false; pointagePending = null; render(); return; }
  if(!state.currentWeek[p.day]) state.currentWeek[p.day] = {};
  var d = state.currentWeek[p.day];
  d[p.field] = p.time;
  if(!d.punched) d.punched = {};
  d.punched[p.field] = true;
  if(p.field === "departure") d.touched = true;
  saveStore();
  pointageOpen = false;
  pointagePending = null;
  render();
}
function closePointage(){
  pointageOpen = false;
  pointagePending = null;
  render();
}
function attachSlide(thumb, track, onConfirm){
  var dragging = false, maxX = 0, startClientX = 0;
  function getClientX(e){ return (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX; }
  function down(e){
    dragging = true;
    try{ thumb.setPointerCapture(e.pointerId); }catch(err){}
    maxX = Math.max(0, track.clientWidth - thumb.offsetWidth - 8);
    startClientX = getClientX(e);
    thumb.style.transition = "";
  }
  function move(e){
    if(!dragging) return;
    var dx = getClientX(e) - startClientX;
    var x = Math.max(0, Math.min(maxX, dx));
    thumb.style.transform = "translateX("+x+"px)";
    if(maxX>0 && x >= maxX - 4){
      dragging = false;
      try{ thumb.releasePointerCapture(e.pointerId); }catch(err){}
      onConfirm();
    }
  }
  function up(){
    if(!dragging) return;
    dragging = false;
    thumb.style.transition = "transform .2s ease";
    thumb.style.transform = "translateX(0px)";
  }
  thumb.addEventListener("pointerdown", down);
  thumb.addEventListener("pointermove", move);
  thumb.addEventListener("pointerup", up);
  thumb.addEventListener("pointercancel", up);
}

function resetDay(day){
  state.currentWeek[day] = {};
  ensureDayDefaults(day);
  saveStore();
  render();
}

function dayWorkedMin(day){
  var d = state.currentWeek[day];
  if(!d || !d.arrival || !d.lunchStart || !d.lunchEnd || !d.departure) return null;
  var a=toMin(d.arrival), ls=toMin(d.lunchStart), le=toMin(d.lunchEnd), dep=toMin(d.departure);
  var worked = (ls-a) + (dep-le);
  if(d.skipMorningBreak) worked += 15;
  if(day!=="vendredi" && d.skipAfternoonBreak) worked += 15;
  return worked;
}
function dayEcartMin(day){
  var w = dayWorkedMin(day);
  if(w===null) return null;
  return w - dayRef(day).refMin;
}
function isDayFilled(day){
  var d = state.currentWeek[day];
  return !!(d && d.arrival && d.lunchStart && d.lunchEnd && d.departure);
}
function isDayTouched(day){
  var d = state.currentWeek[day];
  return !!(d && d.touched);
}
function remainingUntouchedDays(){
  return DAYS.filter(function(d){ return !isDayTouched(d); });
}

function carriedBalance(){
  // part du pot appliquée à la semaine en cours
  if(state.pot.spreadWeeks > 0) return state.pot.totalMin / state.pot.spreadWeeks;
  return 0;
}
function closeWeekAndStart(){
  var appliedThisWeek = carriedBalance(); // part du pot consommée cette semaine
  var weekEcart = touchedEcartSum(); // ce que tu as réellement fait, en plus ou en moins
  state.pot.totalMin = Math.round((state.pot.totalMin||0) - appliedThisWeek + weekEcart);
  if(state.pot.spreadWeeks > 0) state.pot.spreadWeeks = Math.max(0, state.pot.spreadWeeks - 1);
  state.currentWeek = {};
  DAYS.forEach(ensureDayDefaults);
  saveStore();
  render();
}
function touchedEcartSum(){
  var sum = 0;
  DAYS.forEach(function(day){ if(isDayTouched(day)){ var e = dayEcartMin(day); if(e!==null) sum += e; } });
  return sum;
}
function cumulativeBalance(){
  return carriedBalance() + touchedEcartSum();
}

// Estimated departure for a day not yet touched, given the current report mode
function dayProjection(day){
  var ref = dayRef(day);
  var base = carriedBalance() + touchedEcartSum();
  var remaining = remainingUntouchedDays();
  if(remaining.length===0) remaining = [day];
  var target;
  if(state.reportMode === "vendredi"){
    if(day === "vendredi") target = ref.refMin - base;
    else target = ref.refMin;
  } else {
    var perDay = base / remaining.length;
    target = ref.refMin - perDay;
  }
  var arrivalMin = toMin(ref.arrival);
  var lunchEnd = toMin(ref.lunchEnd);
  var morningWorked = toMin(ref.lunchStart) - arrivalMin;
  var departureMin;
  if(target <= morningWorked){
    // Pas besoin d'aller jusqu'à midi : on saute la pause déjeuner, on part direct dans la matinée.
    departureMin = arrivalMin + Math.max(target, 0);
  } else {
    departureMin = lunchEnd + (target - morningWorked);
  }
  return { departure: toClock(departureMin), targetMin: target, skipsLunch: target <= morningWorked };
}

// ---------- Rendering ----------
function el(tag, cls, html){
  var e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html!==undefined) e.innerHTML = html;
  return e;
}

function render(){
  var app = document.getElementById("app");
  app.innerHTML = "";

  var header = el("header","top");
  var titleWrap = el("div","title");
  titleWrap.innerHTML = '<span class="leaf">🌱</span><h1>Planning Horaire</h1>';
  header.appendChild(titleWrap);
  header.appendChild(el("div","weeklabel","Semaine 42"));
  app.appendChild(header);

  renderPointageCard(app);
  renderTopRow(app);
  renderSemaine(app);
  app.appendChild(el("div","section-title","Report des heures"));
  renderReport(app);

  var foot = el("footer","note","Toutes les données restent sur ton téléphone.");
  app.appendChild(foot);

  if(modalDay) renderDayModal();
  if(pointageOpen) renderPointageConfirm();
}

function renderPointageCard(app){
  var day = todayKey();
  var card = el("div","card pointage-card");
  if(!day){
    card.innerHTML = '<div class="section-title" style="margin:0;">Pointage</div><div style="font-size:13px;color:var(--fg-muted);">Pas de pointage le week-end 😴</div>';
    app.appendChild(card);
    return;
  }
  var field = nextPunchField(day);
  if(!field){
    card.innerHTML = '<div class="section-title" style="margin:0;">Pointage</div><div style="font-size:13px;color:var(--good);font-weight:700;">✅ '+DAY_LABELS[day]+' complet</div>';
    app.appendChild(card);
    return;
  }
  card.appendChild(el("div","section-title","Pointage · "+DAY_LABELS[day]));
  var btn = el("button","primary", FIELD_EMOJI[field]+" Pointer "+FIELD_LABELS[field].toLowerCase()+" ("+nowHHMM()+")");
  btn.onclick = openPointage;
  card.appendChild(btn);
  app.appendChild(card);
}

function renderPointageConfirm(){
  var p = pointagePending;
  var backdrop = el("div","modal-backdrop");
  backdrop.onclick = function(e){ if(e.target===backdrop) closePointage(); };

  var sheet = el("div","modal-sheet");
  var head = el("div","modal-header");
  head.appendChild(el("h3", null, "Pointage"));
  var closeBtn = el("button","modal-close","✕");
  closeBtn.onclick = closePointage;
  head.appendChild(closeBtn);
  sheet.appendChild(head);

  var big = el("div", null,
    '<div style="text-align:center; font-size:38px;">'+FIELD_EMOJI[p.field]+'</div>'+
    '<div style="text-align:center; font-size:15px; font-weight:700; margin-top:4px;">'+FIELD_LABELS[p.field]+' — '+DAY_LABELS[p.day]+'</div>'+
    '<div class="pointage-time">'+p.time+'</div>'
  );
  sheet.appendChild(big);

  var track = el("div","slide-confirm");
  track.innerHTML = '<div class="sc-label">Glisse pour confirmer →</div>';
  var thumb = el("div","sc-thumb","➜");
  track.appendChild(thumb);
  sheet.appendChild(track);
  attachSlide(thumb, track, confirmPointage);

  var cancelBtn = el("button","ghost","Annuler");
  cancelBtn.style.marginTop = "4px";
  cancelBtn.onclick = closePointage;
  sheet.appendChild(cancelBtn);

  backdrop.appendChild(sheet);
  document.getElementById("app").appendChild(backdrop);
}

function renderTopRow(app){
  var row = el("div","stat-row");

  var appliedFromPot = carriedBalance();
  var weekOwn = touchedEcartSum();
  var bal = cumulativeBalance();
  var balCard = el("div","balance-card");
  balCard.style.flex = "1";
  balCard.innerHTML =
    '<div class="label">Solde cumulé</div>'+
    '<div class="value" style="color:'+(bal>0?"var(--good)":bal<0?"var(--bad)":"var(--fg)")+'">'+(bal>=0?"+":"")+toHHMM(bal)+'</div>'+
    '<div class="sub">Pot appliqué: '+(appliedFromPot>=0?"+":"")+toHHMM(appliedFromPot)+'<br>Cette semaine: '+(weekOwn>=0?"+":"")+toHHMM(weekOwn)+'</div>';
  row.appendChild(balCard);

  var pot = state.pot;
  var potLive = pot.totalMin - appliedFromPot;
  var potCard = el("div","balance-card");
  potCard.style.flex = "1";
  potCard.innerHTML = '<div class="label">🫙 Pot</div>'+
    '<div class="value" style="color:'+(potLive>0?"var(--good)":potLive<0?"var(--bad)":"var(--fg)")+'">'+(potLive>=0?"+":"")+toHHMM(potLive)+'</div>'+
    '<div class="sub">Réserve totale: '+(pot.totalMin>=0?"+":"")+toHHMM(pot.totalMin)+'<br>déjà '+(appliedFromPot>=0?"-":"+")+toHHMM(Math.abs(appliedFromPot))+' en cours</div>';
  row.appendChild(potCard);

  app.appendChild(row);
}

function renderSemaine(app){
  var modeToggle = el("div","mode-toggle");
  [["vendredi","Tout sur vendredi"],["repartir","Répartir sur les jours restants"]].forEach(function(m){
    var b = el("button", state.reportMode===m[0]?"active":"", m[1]);
    b.onclick = function(){ state.reportMode = m[0]; saveStore(); render(); };
    modeToggle.appendChild(b);
  });
  app.appendChild(modeToggle);

  var statRow = el("div","stat-row");
  var c1 = el("div","card"); c1.innerHTML = '<div class="stat-label">Référence</div><div class="stat-value">'+toHHMM(WEEK_TARGET_MIN)+'</div>';
  var doneMin = DAYS.reduce(function(s,d){ var w=dayWorkedMin(d); return s+(w||0); },0);
  var c2 = el("div","card"); c2.innerHTML = '<div class="stat-label">Déjà fait</div><div class="stat-value">'+toHHMM(doneMin)+'</div>';
  var resteMin = WEEK_TARGET_MIN - doneMin;
  var c3 = el("div","card"); c3.innerHTML = '<div class="stat-label">Reste</div><div class="stat-value">'+toHHMM(Math.max(resteMin,0))+'</div>';
  statRow.appendChild(c1); statRow.appendChild(c2); statRow.appendChild(c3);
  app.appendChild(statRow);

  var daysCard = el("div","card");
  DAYS.forEach(function(day){
    var row = el("div","day-row clickable");
    row.onclick = function(){ modalDay = day; render(); };
    var touched = isDayTouched(day);
    var status = el("div","d-status "+(touched?"done":"pending"));
    row.appendChild(status);
    var name = el("div","d-name", DAY_SHORT[day]);
    row.appendChild(name);
    var info = el("div","d-info");
    if(touched){
      var d = state.currentWeek[day];
      info.innerHTML = '<span class="times">'+d.arrival+'–'+d.lunchStart+' / '+d.lunchEnd+'–'+d.departure+'</span>';
    } else if(state.reportMode==="repartir" || day==="vendredi"){
      var proj = dayProjection(day);
      info.innerHTML = '<span class="times">Estimé '+proj.departure+'</span> ✨';
    } else {
      info.textContent = "Pas encore confirmé";
    }
    row.appendChild(info);
    if(touched){
      var e = dayEcartMin(day);
      var ec = el("div","d-ecart "+(e>0?"pos":e<0?"neg":"zero"), (e>=0?"+":"")+toHHMM(e));
      row.appendChild(ec);
    } else {
      row.appendChild(el("div","d-ecart zero","—"));
    }
    var resetDayBtn = el("button","d-reset","↺");
    resetDayBtn.onclick = function(ev){ ev.stopPropagation(); resetDay(day); };
    row.appendChild(resetDayBtn);
    daysCard.appendChild(row);
  });
  app.appendChild(daysCard);

  var tip = el("div","tip");
  if(state.reportMode==="vendredi"){
    var fp = dayProjection("vendredi");
    tip.innerHTML = '<span class="ic">💡</span><span>Vendredi, pars à <strong>'+fp.departure+'</strong> pour être à l’équilibre (le solde est absorbé uniquement le vendredi)'+(fp.skipsLunch?" — pas besoin de prendre la pause déjeuner, tu pars avant midi":"")+'.</span>';
  } else {
    tip.innerHTML = '<span class="ic">💡</span><span>Le solde est réparti sur les '+remainingUntouchedDays().length+' jour(s) pas encore confirmé(s) — les heures estimées se mettent à jour à chaque jour que tu valides.</span>';
  }
  app.appendChild(tip);
}

function closeModal(){
  if(modalDay && state.currentWeek[modalDay]){
    state.currentWeek[modalDay].touched = true;
    saveStore();
  }
  modalDay = null;
  render();
}

function renderDayModal(){
  var day = modalDay;
  var backdrop = el("div","modal-backdrop");
  backdrop.onclick = function(e){ if(e.target===backdrop){ closeModal(); } };

  var sheet = el("div","modal-sheet");
  var head = el("div","modal-header");
  head.appendChild(el("h3", null, DAY_LABELS[day]+(day==="vendredi"?" 🌞":"")));
  var closeBtn = el("button","modal-close","✕");
  closeBtn.onclick = closeModal;
  head.appendChild(closeBtn);
  sheet.appendChild(head);

  var d = state.currentWeek[day] || {};
  var ref = dayRef(day);

  var group = el("div","field-group");

  function makeField(labelText, emoji, key, placeholder){
    var f = el("div","field");
    var lab = el("label", null, '<span>'+emoji+'</span><span>'+labelText+'</span>');
    f.appendChild(lab);
    var input = document.createElement("input");
    input.type = "time";
    input.value = d[key] || "";
    input.placeholder = placeholder;
    input.id = "field-"+day+"-"+key;
    input.onchange = function(){
      if(!state.currentWeek[day]) state.currentWeek[day] = {};
      state.currentWeek[day][key] = input.value;
      if(!state.currentWeek[day].punched) state.currentWeek[day].punched = {};
      state.currentWeek[day].punched[key] = true;
      saveStore();
      render(); // recalcule en direct sur les autres jours / le solde / vendredi
    };
    f.appendChild(input);
    group.appendChild(f);
  }

  makeField("Arrivée","🕒","arrival", ref.arrival);
  makeField("Début pause midi","🍽️","lunchStart", ref.lunchStart);
  makeField("Reprise","☕","lunchEnd", ref.lunchEnd);
  makeField("Départ","🚪","departure", ref.departure);

  sheet.appendChild(group);

  function makeSkipCheckbox(labelText, key){
    var f = el("div","field");
    var lab = el("label", null, '<span>☕❌</span><span>'+labelText+' sautée (+15min)</span>');
    f.appendChild(lab);
    var cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = !!d[key];
    cb.style.cssText = "width:22px;height:22px;accent-color:var(--accent);";
    cb.onchange = function(){
      if(!state.currentWeek[day]) state.currentWeek[day] = {};
      state.currentWeek[day][key] = cb.checked;
      saveStore();
      render();
    };
    f.appendChild(cb);
    return f;
  }
  var breaksGroup = el("div","field-group");
  breaksGroup.appendChild(makeSkipCheckbox("Pause du matin", "skipMorningBreak"));
  if(day !== "vendredi"){
    breaksGroup.appendChild(makeSkipCheckbox("Pause de l'après-midi", "skipAfternoonBreak"));
  }
  sheet.appendChild(breaksGroup);

  if(day === "vendredi"){
    var fp = dayProjection("vendredi");
    var applyBtn = el("button","ghost","⚡ Partir à l'heure calculée ("+fp.departure+")");
    applyBtn.onclick = function(){
      if(!state.currentWeek[day]) state.currentWeek[day] = {};
      state.currentWeek[day].departure = fp.departure;
      if(!state.currentWeek[day].punched) state.currentWeek[day].punched = {};
      state.currentWeek[day].punched.departure = true;
      saveStore();
      render();
    };
    sheet.appendChild(applyBtn);
  }

  var worked = dayWorkedMin(day);
  var summary = el("div","daysummary");
  if(worked!==null){
    var ec = worked - ref.refMin;
    summary.innerHTML =
      '<div><div class="ds-label">Heures du jour</div><div class="ds-value">'+toHHMM(worked)+'</div></div>'+
      '<div style="text-align:right;"><div class="ds-label">Écart</div><div class="ds-value" style="color:'+(ec>0?"var(--good)":ec<0?"var(--bad)":"var(--fg)")+'">'+(ec>=0?"+":"")+toHHMM(ec)+'</div></div>';
  } else {
    summary.innerHTML = '<div class="ds-label">Remplis les 4 heures pour voir le calcul</div>';
  }
  sheet.appendChild(summary);

  var hint = el("div","tip");
  hint.innerHTML = '<span class="ic">ℹ️</span><span>Référence '+DAY_LABELS[day]+' : '+toHHMM(ref.refMin)+'. Les pauses de 15’ sont offertes, seule la pause de midi est déduite.</span>';
  sheet.appendChild(hint);

  var doneBtn = el("button","primary","Fermer et recalculer");
  doneBtn.onclick = closeModal;
  sheet.appendChild(doneBtn);

  backdrop.appendChild(sheet);
  document.getElementById("app").appendChild(backdrop);
}

function renderReport(app){
  var pot = state.pot;

  var spreadCard = el("div","card");
  spreadCard.appendChild(el("div","section-title","Étaler sur combien de semaines ?"));
  var spreadRow = el("div", null);
  spreadRow.style.cssText = "display:flex; align-items:center; gap:10px; margin-top:10px;";
  var minusBtn = el("button","ghost","−"); minusBtn.style.width="48px";
  var plusBtn = el("button","ghost","+"); plusBtn.style.width="48px";
  var countDisplay = el("div", null, pot.spreadWeeks===0 ? "En réserve" : (pot.spreadWeeks+" semaine"+(pot.spreadWeeks>1?"s":"")));
  countDisplay.style.cssText = "flex:1; text-align:center; font-weight:700; font-family:var(--font-mono);";
  minusBtn.onclick = function(){ pot.spreadWeeks = Math.max(0, pot.spreadWeeks-1); saveStore(); render(); };
  plusBtn.onclick = function(){ pot.spreadWeeks = Math.min(12, pot.spreadWeeks+1); saveStore(); render(); };
  spreadRow.appendChild(minusBtn); spreadRow.appendChild(countDisplay); spreadRow.appendChild(plusBtn);
  spreadCard.appendChild(spreadRow);

  var appliedThisWeek = carriedBalance();
  var hint = el("div","tip");
  hint.style.marginTop = "10px";
  if(pot.spreadWeeks>0){
    hint.innerHTML = '<span class="ic">💡</span><span>Cette semaine, <strong>'+(appliedThisWeek>=0?"+":"")+toHHMM(appliedThisWeek)+'</strong> du pot est appliqué automatiquement (réparti sur '+pot.spreadWeeks+' semaine'+(pot.spreadWeeks>1?"s":"")+').</span>';
  } else {
    hint.innerHTML = '<span class="ic">💤</span><span>Le pot dort, rien n’est appliqué cette semaine. Augmente le nombre de semaines pour commencer à le reprendre, ou laisse-le grossir pour une demi-journée ou une journée de récup plus tard.</span>';
  }
  spreadCard.appendChild(hint);
  app.appendChild(spreadCard);

  var closeCard = el("div","card");
  closeCard.appendChild(el("div","section-title","Fin de semaine"));
  var closeDesc = el("div", null, "Clôture la semaine en cours : son écart réel part dans le pot, et une nouvelle semaine vierge démarre.");
  closeDesc.style.cssText = "font-size:13px; color:var(--fg-muted); margin:8px 0 12px;";
  closeCard.appendChild(closeDesc);
  var closeBtn = el("button","primary","✅ Clôturer la semaine");
  closeBtn.onclick = closeWeekAndStart;
  closeCard.appendChild(closeBtn);
  app.appendChild(closeCard);
}

render();
})();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('planning-horaire-sw.js');
  });
}
</script>
