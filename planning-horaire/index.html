<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=2">
<script>/* Zoom a deux doigts limite a 2x (Android : maximum-scale ; iPhone : ce garde-fou) */(function(){var M=2,v=window.visualViewport,d0=0,g0=1;function sc(){return v?v.scale:1}function di(t){return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)}document.addEventListener("touchstart",function(e){if(e.touches.length===2)d0=di(e.touches)},{passive:true});document.addEventListener("touchmove",function(e){if(e.touches.length!==2)return;var d=di(e.touches);if(e.cancelable&&d>d0&&sc()>=M-0.05)e.preventDefault();d0=d},{passive:false});document.addEventListener("gesturestart",function(){g0=sc()});document.addEventListener("gesturechange",function(e){if(g0*e.scale>M&&e.scale>1)e.preventDefault()})})();</script>
<title>Planning Horaire</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#9ab583">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<script>try{var D=document.documentElement.dataset,G=function(k,d){return localStorage.getItem(k)||d};D.phTheme=G("ph-theme","auto");D.rail=G("ph-rail","g");D.ricons=G("ph-ricons","b");}catch(e){}</script>
<style>
/* Planning Horaire v2.0 — thème pistache mat V18 : barre d'icônes, tuiles arrondies, clair ou foncé */
:root{
  --bg:#e6e9df; --page:#eef0e8; --surf:#fafbf7; --surf2:#f2f4ec; --line:#e2e6da;
  --rail:#262b22; --rail-fg:#cfd6c5;
  --fg:#262b22; --mut:#7b8371;
  --acc:#9ab583; --accS:#5d7849; --on-acc:#1e2a17; --soft:#dfe7d3;
  --lunch:#c39a52; --good:#4f8a38; --bad:#b56f5e; --abs:#9aa08f;
  --shadow:0 1px 3px rgba(0,0,0,.07);
  --f:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
:root[data-ph-theme="fonce"]{
  --bg:#14170f; --page:#181c13; --surf:#20261b; --surf2:#262d20; --line:#323a2a;
  --rail:#0d0f0a; --rail-fg:#a9b39c;
  --fg:#e6eadf; --mut:#9aa38f;
  --acc:#9ab583; --accS:#b6d39b; --on-acc:#15200f; --soft:#2c3724;
  --lunch:#d2aa63; --good:#9bcb7c; --bad:#e08a77; --abs:#6f7766;
  --shadow:0 1px 3px rgba(0,0,0,.4);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root[data-ph-theme="auto"]{
    --bg:#14170f; --page:#181c13; --surf:#20261b; --surf2:#262d20; --line:#323a2a;
    --rail:#0d0f0a; --rail-fg:#a9b39c;
    --fg:#e6eadf; --mut:#9aa38f;
    --acc:#9ab583; --accS:#b6d39b; --on-acc:#15200f; --soft:#2c3724;
    --lunch:#d2aa63; --good:#9bcb7c; --bad:#e08a77; --abs:#6f7766;
    --shadow:0 1px 3px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--page);color:var(--fg);font-family:var(--f);-webkit-tap-highlight-color:transparent}
body{min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit}
.ico{display:inline-flex;flex:none;width:1.25em;height:1.25em;vertical-align:-.28em;color:var(--ic)}.ico svg{width:100%;height:100%}

/* ----- barre d'icônes ----- */
#rail{position:fixed;z-index:30;background:var(--rail);display:flex;align-items:center;gap:10px}
#rail button{width:44px;height:44px;border-radius:14px;border:0;background:none;color:var(--rail-fg);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
#rail button .ico{width:24px;height:24px}
#rail button[aria-current="page"]{background:var(--acc);color:var(--on-acc)}
#rail .set{width:36px;height:36px;border-radius:11px}
#rail .set .ico{width:19px;height:19px}
#rail .sp{flex:1}
:root[data-rail="g"] #rail,:root[data-rail="d"] #rail{top:0;bottom:0;width:60px;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 0 calc(14px + env(safe-area-inset-bottom,0px))}
:root[data-rail="g"] #rail{left:0}
:root[data-rail="d"] #rail{right:0}
:root[data-ricons="h"] #rail .sp{order:5}
:root[data-rail="b"] #rail{left:0;right:0;bottom:0;height:calc(64px + env(safe-area-inset-bottom,0px));flex-direction:row;justify-content:space-around;padding:0 12px env(safe-area-inset-bottom,0px)}
:root[data-rail="b"] #rail .sp{display:none}
:root[data-rail="b"] #rail .set{order:9}

.app{padding:calc(14px + env(safe-area-inset-top,0px)) 14px 110px;max-width:640px;margin:0 auto}
:root[data-rail="g"] .app{padding-left:74px}
:root[data-rail="d"] .app{padding-right:74px}
:root[data-rail="b"] .app{padding-bottom:150px}
header.top{display:flex;align-items:baseline;gap:8px;margin:2px 2px 12px;flex-wrap:wrap}
header.top h1{font-size:20px;font-weight:800;margin:0;letter-spacing:-.01em}
header.top small{font-size:13px;color:var(--mut);font-weight:500}

/* ----- éléments communs ----- */
.card{background:var(--surf);border-radius:18px;padding:14px;margin-top:12px;box-shadow:var(--shadow)}
.k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.big{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.muted{color:var(--mut)}
.small{font-size:12px;color:var(--mut);line-height:1.45}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pos{color:var(--good)} .neg{color:var(--bad)}
.lnk{background:none;border:0;padding:6px 2px;color:var(--accS);font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{flex:1 1 0;min-width:60px;min-height:40px;border-radius:12px;border:1.5px solid var(--acc);background:none;color:var(--accS);font-weight:700;font-size:13px;cursor:pointer;padding:6px 8px;user-select:none;-webkit-user-select:none}
.chip.on{background:var(--soft);border-color:var(--accS)}
.chips.two .chip{flex:1 1 45%}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:22px}
.set:last-child{border-bottom:0}
.set b{color:var(--accS);font-weight:700;text-align:right}
button.set{width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;padding-left:0;padding-right:0}
.sec{font-size:14px;font-weight:800;margin:16px 2px 4px}
.sw{position:relative;width:46px;height:26px;border-radius:13px;background:var(--line);border:0;flex:none;cursor:pointer;transition:background .15s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.sw.on{background:var(--acc)} .sw.on::after{left:23px}
.btn{min-height:48px;border-radius:14px;border:0;background:var(--acc);color:var(--on-acc);font-weight:800;font-size:15px;padding:10px 16px;cursor:pointer}
.btn.ghost{background:var(--surf2);color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--bad);border:1.5px solid var(--bad)}

/* ----- Aujourd'hui ----- */
.times{display:flex;gap:6px;margin-top:10px}
.times button{flex:1;min-width:0;border:1px solid var(--line);background:var(--surf2);border-radius:12px;padding:7px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.times button span{font-size:10px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.times button b{font-size:15px;font-variant-numeric:tabular-nums}
.times button i{font-style:normal;font-size:10px;color:var(--mut)}
.times button.proj b{color:var(--mut)}
.dep .detail{font-size:12px;color:var(--mut);text-align:right;line-height:1.4}

/* ----- frise de la journée ----- */
.frise{position:relative;height:96px;margin-top:6px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.frise .lab{position:absolute;top:0;transform:translateX(-50%);font-size:11px;color:var(--mut);white-space:nowrap;text-align:center;line-height:1.25}
.frise .lab b{display:block;font-size:13px;color:var(--fg);font-variant-numeric:tabular-nums}
.frise .lab.lm{top:14px;background:var(--surf);border-radius:6px;padding:0 4px;z-index:2}
.frise .lab.l0{transform:none}.frise .lab.l1{transform:translateX(-100%)}
.frise .bar{position:absolute;top:40px;left:0;right:0;height:14px;border-radius:7px;background:var(--line)}
.frise .seg{position:absolute;top:40px;height:14px;background:var(--accS)}
.frise .seg.proj{opacity:.38}
.frise .abs{position:absolute;top:40px;height:14px;background:repeating-linear-gradient(45deg,var(--abs) 0 4px,transparent 4px 8px)}
.frise .lunch{position:absolute;top:33px;height:28px;border-radius:7px;background:var(--lunch);border:2px solid var(--surf);touch-action:none;cursor:grab;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.frise .lunch .hd{position:absolute;top:3px;width:14px;height:18px;touch-action:none}
.frise .lunch .hd::after{content:"";position:absolute;left:5px;top:2px;width:4px;height:14px;border-radius:2px;background:var(--surf)}
.frise .lunch .hd.l{left:-8px}.frise .lunch .hd.r{right:-8px}
.frise .now{position:absolute;top:34px;width:2px;height:26px;background:var(--bad);border-radius:1px}
.frise .pz{position:absolute;top:62px;transform:translateX(-50%);border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10px;white-space:nowrap}
.frise .pz i{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;color:#fff;font-size:12px;border:2px dashed rgba(255,255,255,.75);background:var(--good)}
.frise .pz.off i{background:var(--bad)}
.frise .pz span{color:var(--mut)}
.frise .pz.off span{color:var(--bad)}
.frise .tick{position:absolute;top:43px;width:3px;height:8px;border-radius:2px;background:var(--surf);transform:translateX(-50%)}
.frise-help{font-size:11px;color:var(--mut);margin-top:2px}
.absrow{margin-top:8px}
.absrow .chips{margin-top:6px}
.absrow .chip{min-height:36px;border-width:1px;font-size:12px}

/* ----- Semaine ----- */
.dr{display:flex;align-items:center;gap:10px;padding:12px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:10px}
.dr:last-child{border-bottom:0}
.dr.cur{background:var(--soft)}
.dr .n{width:46px;flex:none;font-weight:800;font-size:14px;line-height:1.15}
.dr .n small{display:block;font-weight:500;font-size:11px;color:var(--mut)}
.dr .t{flex:1;font-size:14px;font-variant-numeric:tabular-nums}
.dr .t.proj{color:var(--mut);font-style:italic}
.dr .e{font-weight:800;font-size:14px;text-align:right;font-variant-numeric:tabular-nums;min-width:52px}
.dr .ok{width:18px;flex:none;color:var(--good);font-weight:800;text-align:center}
.seg2{display:inline-flex;border:1.5px solid var(--acc);border-radius:11px;overflow:hidden}
.seg2 button{border:0;background:none;padding:6px 11px;font-size:12px;font-weight:800;color:var(--accS);cursor:pointer}
.seg2 button.on{background:var(--acc);color:var(--on-acc)}
.bars{display:flex;justify-content:space-around;align-items:flex-end;gap:6px;height:270px;margin-top:6px;touch-action:none;user-select:none;-webkit-user-select:none}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;border-radius:12px;padding:4px 0}
.bcol.drop{background:var(--soft)}
.bb{width:100%;max-width:46px;border-radius:10px 10px 4px 4px;background:var(--soft);border:1.5px solid var(--acc);display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;position:relative}
.bcol.done .bb{border-style:dashed;opacity:.8}
.blk{width:70%;height:12px;border-radius:3px;cursor:grab;touch-action:none}
.blk.p{background:var(--good)}.blk.m{background:var(--bad)}
.blk.sel{outline:3px solid var(--fg);outline-offset:1px}
.bcol .bl{font-size:12px;font-weight:800;margin-top:5px}
.bcol .bv{font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
.ghostblk{position:fixed;z-index:80;width:30px;height:14px;border-radius:3px;pointer-events:none;opacity:.85}

/* ----- Pot ----- */
.wk{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.wk:last-child{border-bottom:0}
.wk small{display:block;color:var(--mut);font-size:12px}
.wk .v{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.stepper{display:flex;align-items:center;gap:10px;margin-top:8px}
.stepper button{width:48px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surf2);font-size:20px;font-weight:800;cursor:pointer}
.stepper div{flex:1;text-align:center;font-weight:800}

/* ----- bouton ⏱ dans l'en-tête (ne recouvre plus rien) ----- */
header.top{align-items:center}
#fab{margin-left:auto;align-self:center;width:42px;height:42px;border-radius:14px;border:0;background:var(--soft);color:var(--accS);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
#fab .ico{width:24px;height:24px}

/* ----- panneau du bas ----- */
#sheetBack{position:fixed;inset:0;z-index:60;background:rgba(15,18,12,.45);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .18s}
#sheetBack.on{opacity:1;pointer-events:auto}
#sheet{width:100%;max-width:640px;max-height:88vh;overflow-y:auto;background:var(--surf);border-radius:24px 24px 0 0;padding:10px 16px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(30px);transition:transform .2s;overscroll-behavior:contain}
#sheetBack.on #sheet{transform:none}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 8px}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.sh-h h2{font-size:18px;margin:0;font-weight:800}
.xbtn{width:36px;height:36px;border-radius:12px;border:0;background:var(--surf2);cursor:pointer;display:flex;align-items:center;justify-content:center}

/* ----- roulette ----- */
.wheels{position:relative;display:flex;justify-content:center;align-items:center;gap:6px;margin:12px 0 4px}
.wheels::before{content:"";position:absolute;left:0;right:0;top:50%;height:48px;margin-top:-24px;border-radius:14px;background:var(--soft);pointer-events:none}
.whl{position:relative;width:96px;height:240px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);overscroll-behavior:contain}
.whl::-webkit-scrollbar{display:none}
.whl .pad{height:96px}
.whl .it{height:48px;line-height:48px;text-align:center;font-size:22px;font-weight:600;color:var(--mut);scroll-snap-align:center;font-variant-numeric:tabular-nums;cursor:pointer}
.whl .it.on{font-size:34px;font-weight:800;color:var(--fg)}
.wheels .colon{position:relative;font-size:30px;font-weight:800}
.wval{text-align:center;font-size:13px;color:var(--mut);margin-top:6px}
.wval b{color:var(--fg);font-size:15px}

/* ----- grille Perso ----- */
.grid{display:grid;grid-template-columns:44px repeat(4,1fr);gap:5px;align-items:center;text-align:center;font-size:12px;margin-top:8px}
.grid .h{color:var(--mut);font-weight:700}
.grid .c{height:34px;border-radius:9px;border:1.5px solid var(--line);background:none;cursor:pointer;font-weight:800;color:var(--on-acc)}
.grid .c.on{background:var(--acc);border-color:var(--accS)}
.grid .x{color:var(--line)}

/* ----- rappel de sauvegarde (sous le pouce) ----- */
#remind{position:fixed;z-index:40;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:600px;margin:0 auto;background:var(--rail);color:#eef0e8;border-radius:18px;padding:12px 12px 12px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#remind .tx{flex:1;font-size:13px;line-height:1.35}
#remind .tx small{display:block;color:#b3c99f}
#remind .later{background:none;border:0;color:#b3c99f;font-weight:700;font-size:13px;padding:10px 6px;cursor:pointer}
#remind .go{background:var(--acc);color:#1e2a17;border:0;border-radius:13px;font-weight:800;font-size:15px;padding:13px 16px;cursor:pointer}
:root[data-rail="g"] #remind{left:72px}
:root[data-rail="d"] #remind{right:72px}
:root[data-rail="b"] #remind{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body.remind .app{padding-bottom:210px}

.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--rail);color:#eef0e8;padding:11px 16px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.notes h3{font-size:14px;margin:14px 0 4px}
.notes ul{margin:4px 0;padding-left:18px;font-size:13px;line-height:1.5;color:var(--mut)}
.notes p{font-size:13px;line-height:1.5;color:var(--mut);margin:6px 0}
.notes b{color:var(--fg)}
.foot{text-align:center;font-size:11px;color:var(--mut);margin-top:16px}

/* ----- Paramètres façon Véhicules ----- */
.card.stack{display:flex;flex-direction:column;gap:12px}
.swr{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;font-weight:600;color:var(--fg)}
.swr>span{min-width:0}
.swr small{display:block;font-size:11px;font-weight:500;color:var(--mut);margin-top:1px}
button.swr{width:100%;background:none;border:0;padding:0;text-align:left;cursor:pointer;font:inherit;font-size:14px;font-weight:600}
.swr .seg2{flex:none}
.pill{background:var(--soft);border-radius:10px;padding:5px 10px;font-variant-numeric:tabular-nums}
.lbl{font-size:12px;font-weight:700;color:var(--mut);margin-bottom:6px}
.rord{display:flex;flex-direction:column;gap:6px}
.rord .it{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:12px;background:var(--surf2)}
.rord .it .ico{width:22px;height:22px;color:var(--accS)}
.rord .it span:not(.ico){flex:1;font-weight:600;font-size:22px}
.rord .it button{width:38px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surf);color:var(--fg);cursor:pointer;font-size:12px}
.rord .it button:disabled{opacity:.3;cursor:default}
.rord .btn{min-height:40px;font-size:13px;background:var(--surf2);color:var(--fg);border:1px solid var(--line);margin-top:4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv span{color:var(--mut)}
.kv b{text-align:right;font-variant-numeric:tabular-nums}
.card .btn{width:100%}

/* ----- ⏱ Mes heures en petit (indicatif) ----- */
.mini{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.mini button{flex:1 1 30%;min-width:0;border:1px solid var(--line);background:var(--surf2);border-radius:10px;padding:5px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left}
.mini button span{font-size:10px;color:var(--mut);font-weight:600}
.mini button b{font-size:12px;font-variant-numeric:tabular-nums;color:var(--fg)}

/* ----- frise : poignées arrivée / départ, zoom ----- */
.frise .knob{position:absolute;top:36px;width:24px;height:24px;margin-left:-12px;border-radius:50%;background:var(--surf);border:3px solid var(--accS);box-shadow:0 1px 4px rgba(0,0,0,.25);touch-action:none;cursor:ew-resize;z-index:3}
.frise .knob::before{content:"";position:absolute;inset:-12px}
.frise .knob.proj{border-style:dashed}
.frise.drag .lab b{color:var(--accS)}
.frise.big{height:150px}
#sheet .frise.big{animation:zoomIn .22s ease-out}
.frise.big .bar,.frise.big .seg,.frise.big .abs{top:52px;height:22px}
.frise.big .bar{border-radius:11px}
.frise.big .lunch{top:44px;height:38px;border-radius:9px}
.frise.big .lunch .hd{top:6px;width:20px;height:26px}
.frise.big .lunch .hd::after{left:8px;top:3px;height:20px}
.frise.big .lunch .hd.l{left:-11px}.frise.big .lunch .hd.r{right:-11px}
.frise.big .knob{top:47px;width:32px;height:32px;margin-left:-16px}
.frise.big .tick{top:59px}
.frise.big .now{top:46px;height:34px}
.frise.big .pz{top:88px}
.frise.big .lab b{font-size:16px}
.frise.big .lab.lm{top:20px}
.frise .hr{position:absolute;top:132px;transform:translateX(-50%);font-size:10px;color:var(--mut);font-variant-numeric:tabular-nums}
.frise .hr::before{content:"";position:absolute;left:50%;top:-6px;width:1px;height:4px;background:var(--line)}
@keyframes zoomIn{from{transform:scale(.9);opacity:.4}to{transform:none;opacity:1}}
.swr{flex-wrap:wrap}
.times button.todo{border:2px solid var(--accS);background:var(--soft)}
.times button.todo b{color:var(--accS)}

/* ----- frise : réglage par −5 / +5 (rien ne bouge au doigt) ----- */
.frise .knob,.frise .lunch{cursor:pointer}
.frise .knob.on{background:var(--accS);border-color:var(--accS);box-shadow:0 0 0 5px color-mix(in srgb,var(--accS) 30%,transparent)}
.frise .lunch.on{box-shadow:0 0 0 4px var(--accS)}
.fctl{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:6px;padding:10px;border-radius:14px;background:var(--soft)}
.frow{display:flex;align-items:center;gap:10px;width:100%}
.fbtn{flex:none;width:72px;height:56px;border-radius:16px;border:0;background:var(--acc);color:var(--on-acc);font-size:22px;font-weight:800;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;font-variant-numeric:tabular-nums}
.fbtn:active{transform:scale(.95)}
.fv{flex:1;text-align:center;line-height:1.2}
.fv span{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.fv b{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.fctl .lnk{align-self:flex-end}
.fv b{white-space:nowrap;font-size:clamp(17px,5.4vw,24px)}

/* ----- bande des 5 jours (Aujourd'hui) ----- */
.wstrip{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.wd{min-width:0;border:1.5px solid var(--line);background:var(--surf);border-radius:14px;padding:8px 2px 7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--fg);box-shadow:var(--shadow);font:inherit}
.wd b{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--mut);display:flex;align-items:center;gap:4px}
.wd b i{width:7px;height:7px;border-radius:50%;background:var(--accS)}
.wd small{font-size:10px;color:var(--mut);margin-top:-2px}
.wd .t{font-size:12px;line-height:1.3;text-align:center;font-variant-numeric:tabular-nums;margin-top:3px}
.wd .e{font-size:12px;font-weight:800;min-height:16px;color:var(--good)}
.wd .e .cur{color:var(--accS);font-weight:700;font-size:11px}
.wd.off{opacity:.55}
.wd:not(.done):not(.today) .t{color:var(--mut)}
.wsolde{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;padding:12px 16px;border-radius:16px;background:var(--rail);color:#eef0e8;cursor:pointer}
.wsolde .k{color:#b3c99f}
.wsolde small{display:block;font-size:11px;color:#b3c99f;margin-top:1px}
.wsolde>b{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em;color:#eef0e8}
.wsolde>b.pos{color:#a9dc8a}.wsolde>b.neg{color:#f0a493}
.hint{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--soft);font-size:13px;line-height:1.5}
.hint .ico{width:20px;height:20px;flex:none;color:var(--accS);margin-top:1px}
.ring{position:relative;width:64px;height:64px;flex:none}
.ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .rb{stroke:var(--line)}
.ring .rf{stroke:var(--good);stroke-linecap:round}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.bcol .bl{cursor:pointer;text-align:center;line-height:1.1}
.bcol .bl small{display:block;font-size:10px;font-weight:500;color:var(--mut)}
.wbars{margin-top:0}

/* ----- 27.10 : solde en haut, jour en cours plus grand, ronds début / fin du midi ----- */
.wtop .wsolde{margin:0 0 10px}
.wd.today b{font-size:22px}
.frise .lunch .hd{top:50%;width:22px;height:22px;margin-top:-11px;border-radius:50%;background:var(--surf);border:3px solid var(--lunch);box-shadow:0 1px 3px rgba(0,0,0,.25);z-index:2}
.frise .lunch .hd::after{display:none}
.frise .lunch .hd::before{content:"";position:absolute;inset:-10px}
.frise .lunch .hd.l{left:-11px}.frise .lunch .hd.r{right:-11px;left:auto}
.frise.big .lunch .hd{width:30px;height:30px;margin-top:-15px}
.frise.big .lunch .hd.l{left:-15px}.frise.big .lunch .hd.r{right:-15px}
.frise .lunch .hd.on{background:var(--lunch)}
.frise .lunch{touch-action:none}
.frise .knob{touch-action:none}
/* ronds du midi : début en haut à gauche, fin en bas à droite, pour ne jamais se chevaucher */
.frise .lunch .hd,.frise.big .lunch .hd{width:24px;height:24px;margin:0}
.frise .lunch .hd.l,.frise.big .lunch .hd.l{left:-12px;right:auto;top:-14px;bottom:auto}
.frise .lunch .hd.r,.frise.big .lunch .hd.r{right:-12px;left:auto;top:auto;bottom:-14px}
.wd.sel{border:2.5px solid var(--accS);background:var(--soft)}
.wd.sel b{color:var(--accS)}
.wd.sel .t{font-size:15px;font-weight:700;color:var(--fg)}
.lnk.back{margin-top:10px}

/* ----- Bêtises (v2.1) ----- */
.bet-bub{position:fixed;z-index:120;max-width:240px;padding:8px 12px;border-radius:14px;background:var(--fg);color:var(--page);font-size:15px;font-weight:800;line-height:1.3;pointer-events:none;box-shadow:0 8px 22px rgba(0,0,0,.25);animation:betPop .45s cubic-bezier(.3,1.5,.5,1)}
.bet-bub::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:var(--fg)}
.bet-bub.dn::after{bottom:auto;top:-6px;border-top:0;border-bottom:6px solid var(--fg)}
.bet-bub.out{opacity:0;transform:translateY(-6px) scale(.9);transition:all .3s ease-in}
@keyframes betPop{from{opacity:0;transform:scale(.5) translateY(8px)}to{opacity:1;transform:none}}
.bet-fly{position:fixed;z-index:94;font-size:32px;pointer-events:none}
.bet-fly.cross{animation:betCross 3.4s ease-in-out forwards;font-size:46px}
@keyframes betCross{0%{transform:translate(0,0)}25%{transform:translate(25vw,-10px)}50%{transform:translate(50vw,8px) rotate(10deg)}75%{transform:translate(75vw,-8px)}100%{transform:translate(110vw,0)}}
.bet-fly.spark{animation:betSpark 1.4s ease-out forwards;font-size:22px}
@keyframes betSpark{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(.3) translateY(14px)}}
.bet-fly.steam{animation:betSteam 2.6s ease-out forwards}
@keyframes betSteam{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-34px) scale(1.2)}}
.bet-fly.fall{animation:betFall 2.6s ease-in forwards}
@keyframes betFall{to{transform:translateY(105vh) rotate(260deg)}}
.bet-fly.moon{animation:betMoon 2.6s ease-in-out forwards;font-size:46px}
@keyframes betMoon{0%{opacity:0;transform:translateY(16px)}30%,75%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-10px)}}
.bet-fib{color:var(--lunch)!important;animation:betShake .5s 3}
.bet-dodge{animation:betDodge 2s ease-in-out}
@keyframes betDodge{0%,100%{transform:none}20%{transform:translateX(120px) rotate(-12deg) scale(1.1)}45%{transform:translateX(-80px) rotate(10deg) scale(1.1)}70%{transform:translateX(30px)}}
.bet-no{animation:betShake .5s 3}
@keyframes betShake{0%,100%{transform:translateX(-50%)}25%{transform:translateX(calc(-50% - 12px)) rotate(-4deg)}75%{transform:translateX(calc(-50% + 12px)) rotate(4deg)}}
.times b.bet-fib,.wsolde b.bet-fib,.ring b.bet-fib{animation:betShake2 .5s 3}
@keyframes betShake2{0%,100%{transform:none}25%{transform:translateX(-10px) scale(1.15)}75%{transform:translateX(10px) scale(1.15)}}
.bet-wiggle{animation:betWiggle .7s 3}
@keyframes betWiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg) translateY(-8px) scale(1.08)}75%{transform:rotate(12deg) translateY(-8px) scale(1.08)}}
.bet-yawn{animation:betYawn 2.4s ease-in-out}
@keyframes betYawn{0%,100%{transform:none}40%{transform:scaleX(1.18) scaleY(.7)}60%{transform:scaleX(1.18) scaleY(.7)}}
.bet-eat{animation:betEat 2s ease-in-out}
@keyframes betEat{0%,100%{transform:none}30%,60%{transform:scaleX(1.9) scaleY(1.35)}}
.bet-tilt{animation:betTilt 3s ease-in-out}
@keyframes betTilt{0%,100%{transform:none}15%,85%{transform:rotate(-16deg) translateY(10px);filter:saturate(.3)}}
.bet-hop{animation:betHop .65s ease-in-out 2}
@keyframes betHop{0%,100%{transform:translateY(0)}50%{transform:translateY(-24px) scale(1.08)}}
.knob.bet-hop{animation-name:betHopK}
@keyframes betHopK{0%,100%{margin-top:0}50%{margin-top:-24px}}
.bet-spin{animation:betSpin 2s cubic-bezier(.3,.6,.3,1)}
@keyframes betSpin{50%{transform:rotate(360deg) scale(1.6)}to{transform:rotate(720deg)}}
.bet-pushR{animation:betPushR 1.8s ease-in-out}.bet-pushL{animation:betPushL 1.8s ease-in-out}
@keyframes betPushR{0%,100%{transform:none}30%{transform:translateX(20px) rotate(7deg)}55%{transform:translateX(-10px)}}
@keyframes betPushL{0%,100%{transform:none}30%{transform:translateX(-20px) rotate(-7deg)}55%{transform:translateX(10px)}}
.bet-hide{animation:betHide 2.2s ease-in-out}
@keyframes betHide{0%,100%{opacity:1;transform:none}25%,70%{opacity:.05;transform:translateY(20px) scale(.3)}}
.bet-fall{animation:betBarFall 2s cubic-bezier(.5,0,.5,1)}
@keyframes betBarFall{0%,100%{transform:none}30%{transform:rotate(38deg) translateX(24px)}55%{transform:rotate(-12deg)}75%{transform:rotate(6deg)}}
.bet-proud{animation:betProud 2s ease-in-out}
@keyframes betProud{0%,100%{transform:none;text-shadow:none}40%,60%{transform:scale(1.5);text-shadow:0 0 26px currentColor}}
.bet-wink{animation:betProud 1.8s ease-in-out}
.bet-ch{display:inline-block;animation:betCh .9s ease-in-out 2}
@keyframes betCh{0%,100%{transform:none}50%{transform:translateY(-16px) rotate(-16deg) scale(1.2)}}
.bet-sleep{animation:betSleep 2.4s ease-in-out}
@keyframes betSleep{0%,100%{opacity:1;transform:none}30%,70%{opacity:.35;transform:rotate(12deg) translateY(10px) scale(.9)}}
.bet-flip{animation:betFlip 2s ease-in-out}
@keyframes betFlip{0%,100%{transform:none}35%,65%{transform:scaleX(-1.2) scaleY(1.2)}}
.bet-juggle{animation:betJuggle 1.8s ease-in-out}
@keyframes betJuggle{0%{transform:rotate(-90deg)}40%{transform:rotate(-90deg) translateY(-40px) rotate(360deg)}100%{transform:rotate(270deg)}}
@media (prefers-reduced-motion:reduce){.bet-bub{animation:none}}
/* page vivante */
.bet-breathe{animation:betBreathe 2.4s ease-in-out}
@keyframes betBreathe{0%,100%{transform:none}50%{transform:scaleY(1.18) scaleX(1.04)}}
.bet-flipY{animation:betFlipY 2s ease-in-out}
@keyframes betFlipY{0%,100%{transform:none}50%{transform:rotateY(180deg) scale(1.15)}}
.bet-sniff{animation:betSniff .45s 4}
@keyframes betSniff{0%,100%{transform:none}50%{transform:translateY(-6px) scale(1.25,.9)}}
.bet-bob{animation:betBob 1.1s ease-in-out}
@keyframes betBob{0%,100%{margin-top:0}50%{margin-top:-20px}}
.bet-shine{animation:betShine 1.3s ease-in-out}
@keyframes betShine{0%,100%{filter:none}50%{filter:brightness(1.4) drop-shadow(0 0 14px var(--acc));transform:scale(1.12)}}
.bet-fly.zzz{animation:betZzz 4s ease-out forwards;font-size:24px}
@keyframes betZzz{0%{opacity:0;transform:none}20%{opacity:1}100%{opacity:0;transform:translate(30px,-40px) scale(1.4)}}
body.bet-asleep .app{filter:brightness(.82) saturate(.7);transition:filter 1.5s}
body:not(.bet-asleep) .app{transition:filter .4s}
/* La page fait sa vie */
.bet-veil{position:fixed;inset:0;z-index:200;background:transparent;touch-action:none}
body.bet-fete{overflow:hidden}
.bet-actor{will-change:transform}
.bet-fly.guest{font-size:36px;z-index:99}
@media (prefers-reduced-motion:reduce){.bet-actor{transition:none!important}}
.bet-fly.prop{font-size:30px;z-index:96;line-height:1;animation:betPropIn .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes betPropIn{from{opacity:0;transform:scale(.3)}}
.bet-fly.num{z-index:110;width:120px;text-align:center;font:800 30px/1 system-ui,sans-serif;color:var(--lunch);text-shadow:0 2px 0 var(--page),0 4px 14px rgba(0,0,0,.25);white-space:nowrap;animation:betNum 2.6s ease-out forwards}
@keyframes betNum{0%{opacity:0;transform:scale(.3)}22%{opacity:1;transform:scale(1.35)}70%{opacity:1;transform:scale(1) translateY(-10px)}100%{opacity:0;transform:translateY(-40px)}}
.bet-fly.story{left:50%!important;z-index:110;padding:8px 16px;border-radius:20px;background:var(--fg);color:var(--page);font:800 15px/1.2 system-ui,sans-serif;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:betStory 3.2s ease-in-out forwards}
@keyframes betStory{0%{opacity:0;transform:translateX(-50%) scale(.6)}15%,80%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) translateY(-12px)}}
.bet-fly.prop.front{z-index:98}
.bet-fly.badge{z-index:99;line-height:1;transition:opacity .2s}
.bet-fly.case{display:grid;place-items:center;width:58px;height:40px;border:3px solid var(--fg);border-radius:8px;background:var(--page);color:var(--fg);font:800 18px/1 system-ui,sans-serif;z-index:95}
.bet-fly.board{padding:6px 14px;border-radius:14px;background:var(--fg);color:var(--page);font:800 18px/1.2 system-ui,sans-serif;white-space:nowrap;transform:translateX(-35%);z-index:99}
.bet-fly.num.big{width:240px;font-size:26px;white-space:normal;line-height:1.15;animation-duration:3.2s}

/* v2.2 : horaire continu (sans midi) et apéro */
.frise .lunch.none{opacity:0;pointer-events:none}
.frise .apero{position:absolute;top:40px;height:14px;background:repeating-linear-gradient(45deg,#d4a017 0 4px,transparent 4px 8px)}
.times button.nol b{color:var(--mut)}
</style>

/* === SAUVEGARDE ATELIER v2 — début (copie identique dans chaque app, source : /mnt/project-files/sauvegarde-drive) === */
/* Sauvegarde Drive commune aux apps d'atelier.
   - 💾 Sauvegarder : fichier .txt daté (App_AAAA-MM-JJ_HHhMM.txt) → menu Partager d'Android (Drive), sinon téléchargement.
     v2 (choix d'Adi 6b) : chaque fichier contient TOUT l'historique des sauvegardes de l'app (le dernier fichier suffit).
     Historique gardé dans le téléphone (<cle>-historique), une entrée par sauvegarde dont les données ont changé.
   - 📂 Importer : lit le .txt (v1 ou v2), aperçu, choix de la version à remettre (la plus récente par défaut), confirmation ;
     les données actuelles partent d'abord dans « Copies avant import » ; l'historique du fichier rejoint celui du téléphone.
   - Copies avant import : jamais effacées, on peut revenir à n'importe laquelle (ce retour fait lui-même une copie).
   - Rappel : bandeau si aucune sauvegarde depuis 7 jours et que les données ont changé depuis.
   Usage :
     Sauvegarde.init({ app:"PorteOutils", nom:"Porte-outils", cle:"porteoutils-cnc-v1", version:"1.1",
       lire:() => donnees, ecrire:d => {...}, resume:d => "12 porte-outils…", valider:d => null|"erreur", vide:d => true|false });
     Sauvegarde.panneau(element)   // carte avec boutons, aperçu d'import, copies
     Sauvegarde.bandeau()          // HTML du rappel ("" si pas besoin)
     Sauvegarde.copieAvant(raison) // à appeler avant tout autre remplacement des données (ex. import Excel) ; false = échec
*/

  const MARQUE = "---- DONNÉES (ne pas modifier sous cette ligne) ----";

  const dateFr = d => `${p2(d.getDate())}.${p2(d.getMonth()+1)}.${d.getFullYear()} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
  const empreinte = s => { let h = 2166136261; for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); };
  const kEtat = () => C.cle + "-sauvegarde", kCopies = () => C.cle + "-copies", kHist = () => C.cle + "-historique";
  const lireLS = (k, def) => { try{ const v = JSON.parse(localStorage.getItem(k)); return v ?? def; }catch(e){ return def; } };
  const ecrireLS = (k, v) => { try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } };
  const etat = () => lireLS(kEtat(), {derniere:null, empreinte:null});
  const copies = () => lireLS(kCopies(), []);
  const historique = () => lireLS(kHist(), []);
  // réunit deux historiques (clé = date), trié du plus ancien au plus récent
  function fusion(a, b){ const m = new Map(); [...a, ...b].forEach(h => h && h.date && h.donnees && m.set(h.date, h)); return [...m.values()].sort((x, y) => x.date.localeCompare(y.date)); }
  const actuel = () => JSON.stringify(C.lire());
  let msgT;
  function message(t, erreur){
    let m = document.getElementById("sv-msg");
    if(!m){ m = document.createElement("div"); m.id = "sv-msg"; m.className = "sv-msg"; m.setAttribute("role","status"); document.body.appendChild(m); }
    m.textContent = t; m.classList.toggle("sv-err", !!erreur); m.classList.add("on"); clearTimeout(msgT); msgT = setTimeout(() => m.classList.remove("on"), 3200);
  }

  function init(cfg){ C = Object.assign({version:"", resume:() => "", valider:() => null, vide:() => false}, cfg); style(); }

  function nomFichier(d){ return `${C.app}_${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}_${p2(d.getHours())}h${p2(d.getMinutes())}.txt`; }
  function contenu(d, donnees, hist){
    const env = {format:"sauvegarde-atelier", formatVersion:2, app:C.app, nom:C.nom, appVersion:C.version, date:d.toISOString(), donnees, historique:hist};
    return ["SAUVEGARDE ATELIER", `App : ${C.nom}${C.version ? " v" + C.version : ""}`, `Date : ${dateFr(d)}`,
      `Contenu : ${C.resume(donnees)}`, `Historique : ${hist.length} sauvegarde(s), toutes dans ce fichier (le plus récent fichier suffit) :`,
      ...hist.slice().reverse().map(h => `  ${dateFr(new Date(h.date))}  ${h.resume}`),
      "Pour remettre ces données : dans l'app, bouton 📂 Importer.", "", MARQUE, JSON.stringify(env)].join("\n");
  }

  async function sauvegarder(){
    const d = new Date(), donnees = C.lire(), nom = nomFichier(d);
    let hist = historique();
    const der = hist[hist.length - 1];
    if(!der || empreinte(JSON.stringify(der.donnees)) !== empreinte(JSON.stringify(donnees))) hist = fusion(hist, [{date:d.toISOString(), resume:C.resume(donnees), donnees}]);
    const txt = contenu(d, donnees, hist);
    const fichier = new File([txt], nom, {type:"text/plain"});
    let fait = false;
    if(navigator.canShare && navigator.share){
      let ok = false; try{ ok = navigator.canShare({files:[fichier]}); }catch(e){}
      if(ok){
        try{ await navigator.share({files:[fichier], title:nom}); fait = true; message("Sauvegarde envoyée : " + nom); }
        catch(e){ if(e && e.name === "AbortError"){ message("Sauvegarde annulée"); return false; } }
      }
    }
    if(!fait){
      const a = document.createElement("a"); a.href = URL.createObjectURL(fichier); a.download = nom;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      fait = true; message("Fichier enregistré dans Téléchargements : " + nom);
    }
    ecrireLS(kEtat(), {derniere:d.toISOString(), empreinte:empreinte(JSON.stringify(donnees))});
    if(!ecrireLS(kHist(), hist)) message("Fichier envoyé, mais mémoire du téléphone pleine : l'historique n'a pas pu y être gardé.", true);
    return true;
  }

  async function lireFichier(f){
    const t = await f.text();
    const i = t.indexOf(MARQUE);
    let env;
    try{ env = JSON.parse(i >= 0 ? t.slice(i + MARQUE.length) : t); }catch(e){ throw new Error("ce n'est pas une sauvegarde lisible"); }
    if(!env || env.format !== "sauvegarde-atelier" || !env.donnees) throw new Error("ce n'est pas une sauvegarde d'atelier");
    if(env.app !== C.app) throw new Error(`c'est une sauvegarde de « ${env.nom || env.app} », pas de « ${C.nom} »`);
    const err = C.valider(env.donnees); if(err) throw new Error(err);
    const r = C.resume;
    env.versions = fusion(Array.isArray(env.historique) ? env.historique : [], [{date:env.date, resume:r(env.donnees), donnees:env.donnees}])
      .filter(h => !C.valider(h.donnees)).reverse(); // plus récente d'abord
    return env;
  }

  function copieAvant(raison){
    const l = copies();
    l.unshift({date:new Date().toISOString(), raison, resume:C.resume(C.lire()), donnees:C.lire()});
    return ecrireLS(kCopies(), l);
  }
  function remplacer(donnees, raison){
    if(!copieAvant(raison)){ message("Mémoire du téléphone pleine : copie impossible, rien n'a été remplacé. Sauvegarde d'abord sur Drive.", true); return false; }
    C.ecrire(donnees); return true;
  }

  function bandeau(){
    if(!C) return "";
    const e = etat(), donnees = actuel();
    if(C.vide(C.lire())) return "";
    const jours = e.derniere ? Math.floor((Date.now() - new Date(e.derniere).getTime()) / 864e5) : null;
    if(jours !== null && (jours < 7 || e.empreinte === empreinte(donnees))) return "";
    return `<div class="sv-bandeau"><span>${ic("cloud-arrow-up")} ${jours === null ? "Jamais sauvegardé sur Drive." : `Pas de sauvegarde depuis ${jours} jours.`} Tes données ne sont que dans ce téléphone.</span><button type="button" class="sv-btn sv-save" onclick="Sauvegarde.sauvegarder().then(ok=>ok&&this.closest('.sv-bandeau').remove())">${ic("cloud-arrow-up")} Sauvegarder</button></div>`;
  }

  function panneau(el){
    const e = etat(), l = copies(), d = e.derniere ? new Date(e.derniere) : null;
    const change = d && e.empreinte !== empreinte(actuel());
    el.innerHTML = `<div class="sv-carte">
      <div class="sv-titre">${ic("cloud-arrow-up")} Sauvegarde Drive</div>
      <div class="sv-info">Dernière sauvegarde : <b>${d ? dateFr(d) : "jamais"}</b>${change ? " · modifié depuis" : ""}</div>
      <div class="sv-btns"><button type="button" class="sv-btn sv-save" data-sv="save">${ic("cloud-arrow-up")} Sauvegarder</button>
        <label class="sv-btn sv-imp">${ic("folder-open")} Importer<input type="file" accept=".txt,.json,text/plain,application/json" hidden></label></div>
      <div class="sv-aide">Choisis Drive dans le menu Partager, dossier <b>Sauvegardes atelier</b>. Chaque fichier contient tout l'historique (${historique().length} sauvegarde(s)) : le plus récent suffit.</div>
      <div class="sv-apercu" hidden></div>
      <details class="sv-copies"><summary>Copies avant import (${l.length})</summary>
        ${l.length ? l.map((c, i) => `<div class="sv-copie"><div><b>${dateFr(new Date(c.date))}</b> · ${ech(c.raison)}<br><small>${ech(c.resume)}</small></div><button type="button" class="sv-btn" data-sv="rev" data-i="${i}">Revenir</button></div>`).join("")
          : `<div class="sv-aide">Aucune pour l'instant. Avant chaque import, tes données actuelles sont gardées ici, jamais effacées.</div>`}
      </details></div>`;
    const ap = el.querySelector(".sv-apercu"), inp = el.querySelector("input[type=file]");
    el.querySelector('[data-sv="save"]').onclick = () => sauvegarder().then(() => panneau(el));
    inp.onchange = async () => {
      const f = inp.files[0]; if(!f) return;
      let env;
      try{ env = await lireFichier(f); }catch(err){ inp.value = ""; message("Import impossible : " + err.message, true); return; }
      ap.hidden = false;
      const v = env.versions;
      ap.innerHTML = `<div><b>${ech(f.name)}</b></div>
        <div>Sauvegarde du <b>${dateFr(new Date(env.date))}</b>${env.appVersion ? ` (v${ech(env.appVersion)})` : ""} · ${v.length} version(s) dans le fichier</div>
        <label class="sv-aide">Version à remettre
          <select class="sv-choix">${v.map((h, i) => `<option value="${i}">${dateFr(new Date(h.date))} · ${ech(h.resume)}${i ? "" : " (la plus récente)"}</option>`).join("")}</select></label>
        <div>Actuellement : ${ech(C.resume(C.lire()))}</div>
        <div class="sv-aide">Tes données actuelles seront d'abord gardées dans « Copies avant import ».</div>
        <div class="sv-btns"><button type="button" class="sv-btn sv-ok" data-sv="ok">Remplacer mes données</button><button type="button" class="sv-btn" data-sv="no">Annuler</button></div>`;
      ap.querySelector('[data-sv="no"]').onclick = () => { inp.value = ""; ap.hidden = true; };
      ap.querySelector('[data-sv="ok"]').onclick = () => {
        const h = v[+ap.querySelector(".sv-choix").value] || v[0];
        if(remplacer(h.donnees, `import ${f.name} (version du ${dateFr(new Date(h.date))})`)){
          ecrireLS(kHist(), fusion(historique(), v));
          message("Données importées"); panneau(el);
        }
      };
    };
    el.querySelectorAll('[data-sv="rev"]').forEach(b => b.onclick = () => {
      const c = copies()[+b.dataset.i];
      if(!c || !confirm(`Revenir aux données du ${dateFr(new Date(c.date))} ?\n(${c.resume})\nTes données actuelles seront gardées comme nouvelle copie.`)) return;
      if(remplacer(c.donnees, "retour à la copie du " + dateFr(new Date(c.date)))){ message("Données remises"); panneau(el); }
    });
  }

  function style(){
    if(document.getElementById("sv-style")) return;
    const s = document.createElement("style"); s.id = "sv-style";
    s.textContent = `
.sv-carte{border:2px solid #1f8a5b;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--surface,transparent)}
.sv-titre{font-weight:700;font-size:18px}
.sv-info,.sv-aide{font-size:14px;opacity:.85}
.sv-btns{display:flex;gap:12px;flex-wrap:wrap}
.sv-btn{flex:1 1 140px;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 16px;border-radius:10px;
  border:1px solid #1f8a5b;background:transparent;color:inherit;font:inherit;font-weight:700;cursor:pointer}
.sv-btn.sv-save{background:linear-gradient(135deg,#1f8a5b,#2a9d8f);border-color:transparent;color:#fff}
.sv-btn.sv-imp{color:#1f8a5b}
.sv-btn.sv-ok{background:#c0392b;border-color:#c0392b;color:#fff}
.sv-apercu{border:2px solid #c0392b;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.sv-choix{display:block;width:100%;margin-top:4px;min-height:48px;font:inherit}
.sv-copies summary{cursor:pointer;font-weight:600;padding:6px 0}
.sv-copie{display:flex;gap:12px;align-items:center;justify-content:space-between;border-top:1px solid rgba(127,127,127,.3);padding:8px 0}
.sv-copie .sv-btn{flex:0 0 auto;min-height:44px}
.sv-bandeau{border:2px solid #1f8a5b;border-radius:10px;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.sv-bandeau span{flex:1 1 200px}
.sv-bandeau .sv-btn{flex:0 0 auto}
.sv-msg{position:fixed;left:16px;right:16px;bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:50;background:#1f8a5b;color:#fff;border-radius:10px;
  padding:14px 16px;font-weight:600;text-align:center;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
.sv-msg.on{opacity:1;transform:none}
.sv-msg.sv-err{background:#c0392b}
@media (prefers-color-scheme:dark){.sv-btn.sv-imp{color:#5cd69a}}`;
    document.head.appendChild(s);
  }

  return {init, historique, sauvegarder, panneau, bandeau, copieAvant, remplacer, lireFichier, nomFichier};
})();
/* === SAUVEGARDE ATELIER v2 — fin === */
</script>

<script>
(function(){
"use strict";
/* Planning Horaire v2.0
   - Aujourd'hui : un toucher pointe l'arrivée, le départ du soir se calcule tout seul.
   - Frise de la journée : toucher arrivée / midi / départ puis −5 / +5, toucher une pause pour la sauter (+15), double toucher = roulette.
   - Rien à valider : à minuit, le départ prévu est retenu tout seul ; la semaine se clôture le dimanche à minuit.
   - Report des heures (⏱) : tout vendredi, jour suivant, étalé, ou Perso (cases). Semaine = graphe en barres pour les exceptions.

var APP_VERSION = "2.2", APP_DATE = "29.10.2026";
var KEY = "planning-horaire-v3";
var DAYS = ["lundi","mardi","mercredi","jeudi","vendredi"];
var SH = {lundi:"Lun",mardi:"Mar",mercredi:"Mer",jeudi:"Jeu",vendredi:"Ven"};
var LB = {lundi:"Lundi",mardi:"Mardi",mercredi:"Mercredi",jeudi:"Jeudi",vendredi:"Vendredi"};
var TABS = {today:{t:"Aujourd'hui",i:"sun-horizon"}, week:{t:"Semaine",i:"calendar-dots"}, pot:{t:"Pot",i:"piggy-bank"}};
var MODES = [["vendredi","Tout vendredi"],["suivant","Jour suivant"],["etale","Étalé"],["perso","Perso"]];
var FREQS = [["1j","Chaque jour"],["2j","Tous les 2 j"],["lunjeu","Lun + jeu"],["hebdo","Hebdo (lundi)"]];

// ---------- outils ----------
function $(s,r){ return (r||document).querySelector(s); }
function el(tag,cls,html){ var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
function p2(n){ return (n<10?"0":"")+n; }
function toMin(s){ if(!s) return null; var p=String(s).split(":"); return (+p[0])*60+(+p[1]); }
function toClock(m){ m=Math.round(m); m=((m%1440)+1440)%1440; return p2(Math.floor(m/60))+":"+p2(m%60); }
function fh(m){ if(m==null) return "—"; m=Math.round(m); m=((m%1440)+1440)%1440; return Math.floor(m/60)+"h"+p2(m%60); }   // 6h52
function fdur(m){ m=Math.round(Math.abs(m)); return m<60 ? m+"’" : Math.floor(m/60)+"h"+p2(m%60); }                          // 50’ / 1h05
function fsign(m){ m=Math.round(m); return m===0 ? "±0" : (m>0?"+":"−")+fdur(m); }
function fhm(m){ m=Math.round(m); var s=m<0?"−":"+"; m=Math.abs(m); return s+Math.floor(m/60)+"h"+p2(m%60); }               // +0h50

function addDays(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; }
function iso(d){ return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate()); }
function fromIso(s){ var p=s.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
function mondayOf(d){ var x=dayStart(d); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }

function dmy(d){ return p2(d.getDate())+"."+p2(d.getMonth()+1); }

function clone(o){ return JSON.parse(JSON.stringify(o)); }
function ls(k,def){ try{ var v=localStorage.getItem(k); return v==null?def:v; }catch(e){ return def; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
var toastT;
function toast(t){ var m=$(".toast"); if(!m){ m=el("div","toast"); document.body.appendChild(m); } m.textContent=t; m.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(function(){ m.classList.remove("on"); },2600); }

// ---------- données ----------
function defState(){
  return {
    v:2,
    settings:{
      weekday:{refMin:510, arrival:"07:00", lunchStart:"12:00", lunchEnd:"12:45"},
      friday:{refMin:410, arrival:"07:00", lunchStart:"12:00", lunchEnd:"12:45"},
      breaks:{morning:"09:30", afternoon:"15:30"}
    },
    report:{mode:"vendredi", perso:{lundi:["mardi"],mardi:["mercredi"],mercredi:["vendredi"],jeudi:["vendredi"]}, allFriday:false, bars:false},
    currentWeek:{start:mondayISO(new Date()), days:{}, adj:{}},

    history:[],
    remind:{on:true, freq:"hebdo", hour:"07:30", snooze:null}

}
function normDay(o){
  return {arrival:o.arrival||null, lunchStart:o.lunchStart||null, lunchEnd:o.lunchEnd||null, departure:o.departure||null,
    skipM:!!(o.skipM||o.skipMorningBreak), skipA:!!(o.skipA||o.skipAfternoonBreak), absMin:+o.absMin||0, noLunch:!!o.noLunch, apero:+o.apero||0, touched:!!o.touched, auto:!!o.auto};
}
// Données v1.x (ou fichier de sauvegarde ancien) → v2. Ne perd rien : jours validés, pot, historique.
function migrate(d){
  var n = defState();
  if(!d || typeof d!=="object") return n;
  if(d.settings){
    ["weekday","friday"].forEach(function(k){
      var o=d.settings[k]||{}, t=n.settings[k];
      if(o.refMin) t.refMin=+o.refMin;
      ["arrival","lunchStart","lunchEnd"].forEach(function(f){ if(o[f]) t[f]=o[f]; });
    });
    if(d.settings.breaks) n.settings.breaks = Object.assign(n.settings.breaks, d.settings.breaks);
  }
  if(d.pot) n.pot = {totalMin:+d.pot.totalMin||0, spreadWeeks:+d.pot.spreadWeeks||0, manualMin:+d.pot.manualMin||0};
  if(d.remind) n.remind = Object.assign(n.remind, d.remind);
  if(d.report) n.report = Object.assign(n.report, d.report);
  else if(d.reportMode==="repartir") n.report.mode = "etale";
  n.history = (Array.isArray(d.history)?d.history:[]).map(function(h){
    var days={};
    Object.keys(h.days||{}).forEach(function(k){ var x=normDay(h.days[k]); x.touched=true; x.ecartMin=h.days[k].ecartMin; days[k]=x; });
    var start = h.start || mondayISO(new Date(new Date(h.closedAt||Date.now()).getTime()-2*864e5));
    return {start:start, week:h.week||weekNum(fromIso(start)), closedAt:h.closedAt||null, days:days,
      weekEcartMin:+h.weekEcartMin||0, potAppliedMin:+h.potAppliedMin||0, potBeforeMin:+h.potBeforeMin||0, potAfterMin:+h.potAfterMin||0, spreadWeeks:+h.spreadWeeks||0};
  });

    n.currentWeek = {start:cw.start||mondayISO(new Date()), days:{}, adj:cw.adj||{}};
    Object.keys(cw.days||{}).forEach(function(k){ n.currentWeek.days[k]=normDay(cw.days[k]); });
  } else {
    // v1 : les heures par défaut étaient pré-remplies ; on ne garde que ce qui a vraiment été pointé ou validé
    DAYS.forEach(function(day){
      var o=cw[day]; if(!o) return; var p=o.punched||{};
      if(o.touched){ var x=normDay(o); x.touched=true; n.currentWeek.days[day]=x; }
      else if(p.arrival){ n.currentWeek.days[day]={arrival:o.arrival, lunchStart:p.lunchStart?o.lunchStart:null, lunchEnd:p.lunchEnd?o.lunchEnd:null,
        departure:null, skipM:!!o.skipMorningBreak, skipA:!!o.skipAfternoonBreak, absMin:0, touched:false, auto:false}; }
    });

}
function load(){ try{ var r=localStorage.getItem(KEY); if(r) return migrate(JSON.parse(r)); }catch(e){} return defState(); }
var S = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast("Mémoire du téléphone pleine : pas enregistré"); } }

// ---------- calculs d'une journée ----------
function ref(day){ return day==="vendredi" ? S.settings.friday : S.settings.weekday; }
function L1(day,d){ return toMin((d&&d.lunchStart)||ref(day).lunchStart); }
function L2(day,d){ return d&&d.noLunch ? L1(day,d) : toMin((d&&d.lunchEnd)||ref(day).lunchEnd); } // horaire continu : midi de 0 min
function away(d){ return (d&&d.absMin||0)+(d&&d.apero||0); } // absence + apéro : du temps pas travaillé
function breakBonus(day,d){ var b=0; if(d&&d.skipM) b+=15; if(day!=="vendredi" && d&&d.skipA) b+=15; return b; }
function presence(a,dep,l1,l2){ // temps de présence moins la pause de midi (seulement la partie qui tombe dans la journée)
  if(dep<=a) return 0;
  var lunch = Math.max(0, Math.min(dep,l2)-Math.max(a,l1));
  return dep-a-lunch;

function worked(day,d){ var a=toMin(d.arrival), dep=toMin(d.departure); if(a==null||dep==null) return null;
  return presence(a,dep,L1(day,d),L2(day,d)) + breakBonus(day,d) - away(d); }
// heure de départ pour faire `target` minutes en arrivant à `a`
function departFor(day,d,a,target){
  var need = Math.max(0, target + away(d) - breakBonus(day,d)), l1=L1(day,d), l2=L2(day,d);
  if(a>=l2 || a+need<=l1) return {dep:a+need, skipsLunch:a<l1};
  return {dep:l2+need-(l1-a), skipsLunch:false};

// ---------- calcul de la semaine (report des heures) ----------
function weekDates(start){ var m=fromIso(start); return DAYS.map(function(_,i){ return addDays(m,i); }); }
function todayIdx(){ var t=dayStart(new Date()), m=fromIso(S.currentWeek.start); return Math.round((t-m)/864e5); }
function curMode(){ return S.report.allFriday ? "vendredi" : S.report.mode; }
function potShare(){ return S.pot.spreadWeeks>0 ? S.pot.totalMin/S.pot.spreadWeeks : 0; }
function destinations(day,mode,days){
  var i=DAYS.indexOf(day), later=DAYS.slice(i+1);
  if(!later.length) return [];

// Pour chaque jour : cible du jour (référence − report reçu + exception), ce qui est fait, départ prévu.
function computeWeek(week){
  week = week||S.currentWeek;
  var days = week.days||{}, adj = week.adj||{}, mode = curMode(), inc = {}, from = {}, out = {};
  DAYS.forEach(function(x){ inc[x]=0; from[x]=[]; });
  var P = potShare();
  if(Math.abs(P)>0.5){
    var tg = mode==="etale" ? DAYS.filter(function(x){ return !(days[x]&&days[x].touched); }) : ["vendredi"];
    if(!tg.length) tg=["vendredi"];
    tg.forEach(function(x){ inc[x]+=P/tg.length; from[x].push({src:"pot",min:P/tg.length}); });
  }
  var ti = todayIdx(), toPot = 0;
  DAYS.forEach(function(day,i){
    var d = days[day]||{}, r = ref(day).refMin;
    var target = r - inc[day] + (adj[day]||0);
    var info = {day:day, ref:r, target:target, inc:inc[day], adj:adj[day]||0, from:from[day], d:d, today:i===ti, past:i<ti};
    var res = 0;
    if(d.touched && d.arrival && d.departure){
      info.done = true; info.worked = worked(day,d); info.ecart = info.worked - r; info.dep = toMin(d.departure);
      res = info.worked - target;
    } else {
      var t = target; if(t<0){ res = -t; t = 0; }
      var a = d.arrival ? toMin(d.arrival) : toMin(ref(day).arrival);
      var f = departFor(day,d,a,t);
      info.dep = f.dep; info.skipsLunch = f.skipsLunch; info.planTarget = t; info.arr = a;
    }
    info.res = res;
    if(Math.abs(res)>0.5){
      var dest = destinations(day,mode,days);
      if(dest.length) dest.forEach(function(x){ inc[x]+=res/dest.length; from[x].push({src:day,min:res/dest.length}); });
      else toPot += res;
    }
    out[day] = info;
  });
  out.toPot = toPot;
  out.solde = P + DAYS.reduce(function(s,x){ return s + (out[x].done ? out[x].ecart : 0); },0);
  out.P = P;

}
function weekEcart(week){ return DAYS.reduce(function(s,x){ var d=(week.days||{})[x]; if(!d||!d.touched||!d.arrival||!d.departure) return s; return s+worked(x,d)-ref(x).refMin; },0); }

// ---------- automatique : départ retenu à minuit, clôture le dimanche à minuit ----------
function keepPastDays(limit){
  var changed=false;
  for(var i=0;i<DAYS.length && i<limit;i++){
    var day=DAYS[i], d=S.currentWeek.days[day];
    if(d && d.arrival && !d.touched){
      var c = computeWeek()[day];
      d.departure = toClock(c.dep); d.touched = true; d.auto = true; changed = true;
    }
  }
  return changed;
}
function closeWeek(){
  keepPastDays(5);
  var w = S.currentWeek, ecart = weekEcart(w), applied = potShare();
  var before = S.pot.totalMin, after = Math.round(before - applied + ecart);
  var days = {};
  DAYS.forEach(function(x){ var d=w.days[x]; if(d && d.touched && d.arrival && d.departure){ var c=clone(d); c.ecartMin=Math.round(worked(x,d)-ref(x).refMin); days[x]=c; } });
  if(Object.keys(days).length || Math.abs(applied)>0.5){
    S.history.push({start:w.start, week:weekNum(fromIso(w.start)), closedAt:new Date().toISOString(), days:days,
      weekEcartMin:Math.round(ecart), potAppliedMin:Math.round(applied), potBeforeMin:before, potAfterMin:after, spreadWeeks:S.pot.spreadWeeks});
    S.pot.totalMin = after; S.pot.manualMin = 0;
    if(S.pot.spreadWeeks>0) S.pot.spreadWeeks = Math.max(0, S.pot.spreadWeeks-1);
  }

}
function tick(){
  var changed=false;
  if(S.currentWeek.start < mondayISO(new Date())){ closeWeek(); changed=true; }
  if(keepPastDays(todayIdx())) changed=true;
  if(changed) save();

// une correction dans l'historique recalcule les semaines suivantes et le pot
function recalcHistory(from){
  var H=S.history;
  for(var i=from;i<H.length;i++){
    var h=H[i];
    if(i>from || i===from){ h.weekEcartMin = Math.round(weekEcart(h)); DAYS.forEach(function(x){ var d=h.days[x]; if(d) d.ecartMin=Math.round(worked(x,d)-ref(x).refMin); }); }
    if(i>from) h.potBeforeMin = H[i-1].potAfterMin;
    if(i>from) h.potAppliedMin = h.spreadWeeks>0 ? Math.round(h.potBeforeMin/h.spreadWeeks) : 0;
    h.potAfterMin = Math.round(h.potBeforeMin - h.potAppliedMin + h.weekEcartMin);
  }
  if(H.length) S.pot.totalMin = H[H.length-1].potAfterMin + (S.pot.manualMin||0);
}

// ----- roulette -----
var IT=48;
function wheelCol(values,label,init,onPick){
  var w=el("div","whl"), user=false, tm=null, cur=init;
  w.innerHTML='<div class="pad"></div>'+values.map(function(v,i){ return '<div class="it" data-i="'+i+'">'+label(v)+'</div>'; }).join("")+'<div class="pad"></div>';
  function idx(){ return Math.max(0,Math.min(values.length-1,Math.round(w.scrollTop/IT))); }
  function mark(i){ w.querySelectorAll(".it").forEach(function(n,k){ n.classList.toggle("on",k===i); }); }
  ["pointerdown","wheel","keydown"].forEach(function(t){ w.addEventListener(t,function(){ user=true; },{passive:true}); });
  w.addEventListener("touchstart",function(){ user=true; },{passive:true});
  w.addEventListener("scroll",function(){ var i=idx(); mark(i); clearTimeout(tm); tm=setTimeout(function(){ var j=idx(); if(user && j!==cur){ cur=j; onPick(values[j]); } },170); });
  w.addEventListener("click",function(e){ var it=e.target.closest(".it"); if(!it) return; user=true; w.scrollTo({top:+it.dataset.i*IT,behavior:"smooth"}); });
  setTimeout(function(){ w.scrollTop=init*IT; mark(init); },0);
  return w;
}
// spec : {title, tabs:[{key,label,kind:"clock"|"dur",get(),set(min)}], active, note}

function renderWheel(sh,spec){
  var active=spec.active||spec.tabs[0].key, t=spec.tabs.filter(function(x){ return x.key===active; })[0]||spec.tabs[0];
  sh.appendChild(sheetHead(spec.title));

    sh.appendChild(ch);

  showVal(v);

  var hours=[]; for(var h=(t.kind==="dur"?0:0);h<=(t.kind==="dur"?12:23);h++) hours.push(h);
  var mins=[]; for(var m=0;m<60;m+=5) mins.push(m);
  function pick(){ var val2=curH*60+(mTouched?curM:M0); if(mTouched) val2=curH*60+curM; t.set(val2); showVal(t.get()); }
  var ws=el("div","wheels");
  ws.appendChild(wheelCol(hours,function(x){ return t.kind==="dur"?x+"h":x; },hours.indexOf(H0)<0?0:hours.indexOf(H0),function(x){ curH=x; hTouched=true; pick(); }));
  ws.appendChild(el("div","colon",t.kind==="dur"?"":":"));
  ws.appendChild(wheelCol(mins,function(x){ return p2(x); },Math.floor(M0/5),function(x){ curM=x; mTouched=true; pick(); }));
  sh.appendChild(ws);
  sh.appendChild(val);
  sh.appendChild(el("div","small",'<div style="text-align:center">Crans de 5 min · tu lâches = enregistré · glisse vers le bas ou Retour pour fermer</div>'));
  if(spec.note) sh.appendChild(spec.note(t));
}
function openDayWheel(day,key,o){
  o=o||{};
  var hist=o.hist, get=function(){ return hist ? o.d : (S.currentWeek.days[day]||{}); };
  var cur=function(f){ var d=get(), c=hist?null:computeWeek()[day];
    if(f==="arrival") return d.arrival?toMin(d.arrival):(c&&c.today?Math.round(nowMin()):c?c.arr:toMin(ref(day).arrival));
    if(f==="lunchStart") return L1(day,d); if(f==="lunchEnd") return L2(day,d);
    return d.departure?toMin(d.departure):(c?Math.round(c.dep):toMin(ref(day).arrival)+555); };
  var obj=function(){ return hist ? o.d : dayObj(day); };
  var after=function(){ save(); if(hist){ if(o.onEdit) o.onEdit(); } else tick(); render(); };
  var tabs=[
    {key:"arrival",label:"Arrivée",kind:"clock",get:function(){ return cur("arrival"); },set:function(m){ obj().arrival=toClock(m); after(); }},
    {key:"lunchStart",label:"Midi",kind:"clock",get:function(){ return cur("lunchStart"); },set:function(m){ var d=obj(); d.noLunch=false; var e=L2(day,d), dur=e-L1(day,d); d.lunchStart=toClock(m); if(e<=m) d.lunchEnd=toClock(m+Math.max(15,dur)); after(); }},
    {key:"lunchEnd",label:"Reprise",kind:"clock",get:function(){ return cur("lunchEnd"); },set:function(m){ var d=obj(), s=L1(day,d); d.noLunch=false; d.lunchEnd=toClock(m); if(m<=s) d.lunchStart=toClock(m-45); after(); }},
    {key:"noLunch",label:"Aucun",kind:"none"},
    {key:"departure",label:"Départ",kind:"clock",get:function(){ return cur("departure"); },set:function(m){ var d=obj(); if(!d.arrival) d.arrival=toClock(cur("arrival")); d.departure=toClock(m); d.touched=true; d.auto=false; after(); }}
  ];
  openWheel({title:LB[day]+(hist?" (historique)":""),tabs:tabs,active:key,note:function(t){
    var d=get(), box=el("div");
    if(t.key==="noLunch"){ // horaire continu : on enlève tout le midi de la journée
      box.appendChild(el("div","small",'<div style="text-align:center;margin:6px 0 10px">Horaire continu : toute la pause de midi est enlevée, l’heure de sortie avance d’autant.</div>'));
      var nb=el("button","btn"+(d.noLunch?"":" pri"),d.noLunch?"Remettre le midi":"🍽️ Pas de midi aujourd'hui");
      nb.onclick=function(){ var x=obj(); x.noLunch=!x.noLunch; after(); redrawSheet(); toast(x.noLunch?"Horaire continu : pas de midi":"Le midi revient"); };
      box.appendChild(nb); return box; }
    if(!hist && t.key==="departure" && d.departure){ var b=el("button","lnk","Remettre le départ en automatique"); b.onclick=function(){ var dd=dayObj(day); dd.departure=null; dd.touched=false; dd.auto=false; save(); tick(); render(); closeSheet(); }; box.appendChild(b); }
    if(!hist && t.key==="departure" && !d.departure) box.appendChild(el("div","small",'<div style="text-align:center">Sans rien toucher, ce départ est retenu tout seul à minuit.</div>'));
    return box; }});
}

// vue barres : un bloc = 15 min ; on le glisse (ou on le touche puis on touche un autre jour) pour une exception de la semaine
var selBlk=null;
function modeName(){ return MODES.filter(function(m){ return m[0]===S.report.mode; })[0][1]; }
function barsView(c,dates){
  var box=el("div","card wbars"), bars=el("div","bars"), H=Math.max(260,(window.innerHeight||800)-300);
  bars.style.height=H+"px";
  var maxT=Math.max.apply(null,DAYS.map(function(x){ return c[x].done?c[x].worked:c[x].planTarget; }).concat([600]));
  DAYS.forEach(function(day){
    var x=c[day], col=el("div","bcol"+(x.done?" done":"")), bb=el("div","bb");
    col.dataset.day=day;
    var val = x.done ? x.ecart : x.planTarget - x.ref, n=Math.min(16,Math.round(Math.abs(val)/15));
    var total = x.done ? x.worked : x.planTarget;
    bb.style.height = Math.max(26, Math.round(total/maxT*(H-80)))+"px";
    for(var i=0;i<n;i++){
      var b=el("div","blk "+(x.done ? (val>0?"p":"m") : (val<0?"p":"m")));
      if(!x.done){ b.dataset.day=day; b.dataset.sign=val<0?"-1":"1"; if(selBlk&&selBlk.day===day&&i===0) b.classList.add("sel"); }
      bb.appendChild(b);
    }
    col.appendChild(bb);
    var bl=el("div","bl",SH[day]+'<small>'+dmy(dates[DAYS.indexOf(day)])+'</small>'); bl.onclick=function(){ var t=computeWeek()[day].today; selDay=t?null:day; fsel=null; go("today"); }; col.appendChild(bl);
    col.appendChild(el("div","bv",(x.done?"fait ":"")+fdur(total)));
    col.appendChild(el("div","bv "+cls(val),n?fsign(val):"·"));
    bars.appendChild(col);
  });
  box.appendChild(bars);
  box.appendChild(el("div","small",'<span style="color:var(--good)">■</span> heures en plus (ou à faire en moins) · <span style="color:var(--bad)">■</span> à rattraper. Les jours faits (pointillés) ne bougent pas. Une exception ne vaut que pour cette semaine.'));
  // glisser un bloc
  var drag=null, ghost=null;
  bars.addEventListener("pointerdown",function(e){
    var b=e.target.closest(".blk[data-day]");
    if(!b) return;
    e.preventDefault(); dragging=true;
    drag={day:b.dataset.day,sign:+b.dataset.sign,x:e.clientX,y:e.clientY,moved:false};
    ghost=el("div","ghostblk"); ghost.style.background=getComputedStyle(b).backgroundColor; ghost.style.left=(e.clientX-15)+"px"; ghost.style.top=(e.clientY-7)+"px"; document.body.appendChild(ghost);
    try{ bars.setPointerCapture(e.pointerId); }catch(_){}
  });
  bars.addEventListener("pointermove",function(e){
    if(!drag) return;
    if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>8) drag.moved=true;
    ghost.style.left=(e.clientX-15)+"px"; ghost.style.top=(e.clientY-7)+"px";
    bars.querySelectorAll(".bcol").forEach(function(cc){ cc.classList.remove("drop"); });
    var t=document.elementFromPoint(e.clientX,e.clientY); t=t&&t.closest(".bcol");
    if(t && t.dataset.day!==drag.day && !t.classList.contains("done")) t.classList.add("drop");
  });

    if(!drag) return; var dd=drag; drag=null; dragging=false; if(ghost){ ghost.remove(); ghost=null; }

    if(!dd.moved){ selBlk={day:dd.day,sign:dd.sign}; render(); toast("Touche le jour qui doit le prendre"); return; }
    if(t) moveBlock(dd.day,t.dataset.day,dd.sign); else render();
  }
  bars.addEventListener("pointerup",function(e){ finish(e); });
  bars.addEventListener("pointercancel",function(e){ finish(e,true); });
  bars.addEventListener("click",function(e){
    if(!selBlk) return; var t=e.target.closest(".bcol"); if(!t||e.target.closest(".blk[data-day]")) return;
    var s=selBlk; selBlk=null; moveBlock(s.day,t.dataset.day,s.sign);
  });
  return box;
}
function moveBlock(from,to,sign){
  selBlk=null;
  if(!to || from===to){ render(); return; }
  var tc=computeWeek()[to]; if(tc.done){ toast(SH[to]+" est déjà fait"); render(); return; }
  var adj=S.currentWeek.adj||(S.currentWeek.adj={});
  // bloc vert (le jour fait moins) : le jour source refait 15’, la destination fait 15’ de moins ; bloc rouge : l'inverse
  adj[from]=(adj[from]||0)+(sign<0?15:-15); adj[to]=(adj[to]||0)+(sign<0?-15:15);
  save(); render(); toast("15’ déplacées de "+SH[from]+" vers "+SH[to]);
}

function lastSave(){ try{ var e=JSON.parse(localStorage.getItem(KEY+"-sauvegarde")); return e&&e.derniere?new Date(e.derniere):null; }catch(e){ return null; } }
function atHour(d,h){ var x=dayStart(d), m=toMin(h); x.setMinutes(m); return x; }
function isEmpty(){ return !S.history.length && !DAYS.some(function(x){ var d=S.currentWeek.days[x]; return d&&d.arrival; }); }
function remindDue(now){
  var R=S.remind; if(!R.on || isEmpty()) return false;
  if(R.snooze && now<new Date(R.snooze)) return false;
  var last=lastSave();
  if(R.freq==="2j" && last) return now>=atHour(addDays(last,2),R.hour);

  for(var k=0;k<8 && !slot;k++){
    var d=addDays(dayStart(now),-k), t=atHour(d,R.hour), wd=d.getDay();

// touche Retour d'Android : ferme le panneau, revient à l'onglet d'avant, puis double appui pour quitter.
// Chrome saute une entrée d'historique posée sans vrai geste (pour un doigt, le geste ne compte qu'au relevé) :
// la garde se pose donc seulement au relevé du doigt / au clic / à une touche, jamais au chargement ni après un Retour.
// En plus, quand Chrome le permet (CloseWatcher), Retour ferme le panneau ouvert sans toucher à l'historique.
(function(){
  var armed=function(){ return history.state&&history.state.ph===1; };
  try{ if(!history.state||history.state.ph==null) history.replaceState({ph:0},""); }catch(e){}
  var cw=null, quitT=null;
  var backNav=function(){ if(sheets.length){ closeSheet(); return true; } if(navStack.length){ go(navStack.pop(),true); return true; } var home=defaultTab(); if(tab!==home){ go(home,true); return true; } return false; };
  var need=function(){ return sheets.length>0 || navStack.length>0 || tab!==defaultTab(); };
  var cwSync=function(){ if(typeof CloseWatcher!=="function") return;
    if(need()&&!cw){ try{ cw=new CloseWatcher(); cw.onclose=function(){ cw=null; backNav(); cwSync(); }; }catch(e){ cw=null; } }
    else if(!need()&&cw){ var w=cw; cw=null; try{ w.destroy(); }catch(e){} } };
  var gest=function(e){ if(e.type==="keydown"&&e.key==="Escape") return;
    if(e.type!=="pointerup"||e.pointerType!=="mouse"){ if(!armed()) try{ history.pushState({ph:1},""); }catch(x){} }
    setTimeout(cwSync,60); };
  ["pointerup","touchend","click","keydown"].forEach(function(t){ addEventListener(t,gest,true); });
  addEventListener("popstate",function(){ // la garde est consommée : elle sera reposée au prochain toucher
    if(quitT){ clearTimeout(quitT); quitT=null; }
    if(backNav()){ cwSync(); return; }
    toast("Appuie encore sur Retour pour quitter");
    quitT=setTimeout(function(){ quitT=null; },2500);
  });
  setInterval(cwSync,700); // un panneau fermé autrement (bouton, toucher) libère son CloseWatcher
})();

    demo:function(it){ if(F.on) feteStop(true); if(it.k==="b") return Bet.show(it.id); sheets=[]; redrawSheet(); selDay=null; go("today");
      setTimeout(function(){ if(it.k==="f"||it.k==="v"){ if(F.on) feteStop(true); feteStart(it.k==="v"?it.id:null); } else { var e=IDL.filter(function(x){ return x[0]===it.id; })[0]; if(!e||!e[1]()) toast("Pas possible ici"); } },450); },
    // pour le carnet : jouer une bêtise précise tout de suite (sur l'onglet qui lui convient)
    show:function(id){ var b=L.filter(function(x){ return x[0]===id; })[0]; if(!b) return;
      sheets=[]; redrawSheet(); if(b[0]==="barre") go("week"); else { selDay=null; go("today"); }
      setTimeout(function(){ if(!play(b)) toast("Pas possible maintenant (« "+b[1]+" » a besoin de son moment)"); },450); }};
})();

window.PH={state:function(){ return S; }, compute:computeWeek, tick:tick, migrate:migrate, recalc:function(i){ recalcHistory(i); save(); }, sv:SV_CFG, bet:Bet};
