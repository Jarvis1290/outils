<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planning Horaire</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6fae52">
<style>
/* Layout: single-page technical dashboard — grid backdrop, squared panels, instrument-style readouts, pistachio accent */
:root{
  --bg:#f3f4ee;
  --surface:#ffffff;
  --surface-2:#e9ece2;
  --fg:#242922;
  --fg-muted:#6b7266;
  --border:#cdd4c2;
  --grid-line:rgba(111,174,82,.10);
  --accent:#6fae52;
  --accent-strong:#4f8a38;
  --accent-soft:#dcedd0;
  --good:#3f8f4f;
  --warn:#c9822a;
  --bad:#c15b4a;
  --radius:6px;
  --font-display:'Rajdhani',system-ui,sans-serif;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15180f;
    --surface:#1d2117;
    --surface-2:#242a1c;
    --fg:#e9ede3;
    --fg-muted:#93a085;
    --border:#333c27;
    --grid-line:rgba(143,203,111,.08);
    --accent:#8fcb6f;
    --accent-strong:#a6db88;
    --accent-soft:#2c3a22;
    --good:#8fcb6f;
    --warn:#e0a855;
    --bad:#e08271;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15180f;
  --surface:#1d2117;
  --surface-2:#242a1c;
  --fg:#e9ede3;
  --fg-muted:#93a085;
  --border:#333c27;
  --grid-line:rgba(143,203,111,.08);
  --accent:#8fcb6f;
  --accent-strong:#a6db88;
  --accent-soft:#2c3a22;
  --good:#8fcb6f;
  --warn:#e0a855;
  --bad:#e08271;
  color-scheme:dark;
}
*{box-sizing:border-box;}
body{
  background-color:var(--bg);
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size:22px 22px;
  color:var(--fg);
  font-family:var(--font-body);
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:16px 32px;
  min-height:100%;
}
h1,h2,h3{font-family:var(--font-display); text-wrap:balance; margin:0;}
.app{max-width:480px; margin:0 auto; display:flex; flex-direction:column; gap:14px;}

header.top{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:10px 12px; padding-top:calc(10px + env(safe-area-inset-top,0px));
  background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:var(--radius);
}
header.top .title{display:flex; align-items:center; gap:9px;}
header.top .title .logo{flex-shrink:0;}
header.top h1{
  font-size:18px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--fg);
}
header.top h1 small{display:block; font-family:var(--font-mono); font-size:9px; font-weight:600; color:var(--fg-muted); letter-spacing:.1em; text-transform:none;}
.header-right{display:flex; flex-direction:column; align-items:flex-end; gap:5px;}
.weeklabel{
  font-size:11px; color:var(--accent-strong); font-weight:700; font-family:var(--font-mono);
  border:1px solid var(--border); border-radius:4px; padding:4px 8px; background:var(--surface-2); letter-spacing:.03em;
}
.clockbadge{
  font-size:14px; font-weight:700; font-family:var(--font-mono); color:var(--fg-muted); letter-spacing:.04em;
}

.pager-viewport{overflow:hidden; position:relative; touch-action:pan-y;}
.pager-track{display:flex; width:300%; transition:transform .28s ease;}
.pager-page{width:33.3333%; flex-shrink:0; display:flex; flex-direction:column; gap:14px; min-width:0; padding:0 4px;}

.page-dots{
  position:fixed; right:7px; top:50%; transform:translateY(-50%); z-index:40;
  display:flex; flex-direction:column; gap:9px;
}
.page-dot{
  width:6px; height:14px; border-radius:3px; background:var(--border); cursor:pointer; transition:background .15s ease, height .15s ease;
}
.page-dot.active{background:var(--accent); height:22px;}

nav.tabs{
  display:flex; gap:6px; background:var(--surface-2); border-radius:14px; padding:4px;
}
nav.tabs button{
  flex:1; border:none; background:transparent; color:var(--fg-muted); font-family:var(--font-body);
  font-weight:700; font-size:13px; padding:10px 6px; border-radius:11px; cursor:pointer;
  transition:background .15s ease, color .15s ease;
}
nav.tabs button.active{background:var(--surface); color:var(--accent-strong); box-shadow:0 1px 2px rgba(0,0,0,.08);}

.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px;
}
.card + .card{margin-top:0;}

.balance-card{
  background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:var(--radius); padding:14px 16px;
  display:flex; flex-direction:column; gap:4px;
}
.balance-card .label{font-size:10px; font-weight:700; color:var(--fg-muted); text-transform:uppercase; letter-spacing:.08em; font-family:var(--font-mono);}
.balance-card .value{font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:23px; font-weight:700; letter-spacing:-.01em;}
.balance-card .sub{font-size:11px; color:var(--fg-muted); font-family:var(--font-mono); line-height:1.5;}

.stat-row{display:flex; gap:10px;}
.stat-row .card{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; border-left:1px solid var(--border);}
.stat-row .stat-label{font-size:10px; color:var(--fg-muted); font-weight:700; text-transform:uppercase; letter-spacing:.06em; font-family:var(--font-mono);}
.stat-row .stat-value{font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:17px; font-weight:700;}

.day-row{
  display:flex; align-items:center; gap:13px; padding:16px 0; border-bottom:1px dashed var(--border);
}
.day-row:last-child{border-bottom:none;}
.day-row .d-name{
  width:52px; font-weight:700; font-size:15px; flex-shrink:0; font-family:var(--font-mono); text-transform:uppercase;
  color:var(--fg-muted); letter-spacing:.04em;
}
.day-row .d-reset{
  background:none; border:1px solid var(--border); border-radius:5px; color:var(--fg-muted); font-size:13px; padding:4px 7px; cursor:pointer; flex-shrink:0; line-height:1.4;
}
.day-row.today-row{flex-direction:column; align-items:stretch; gap:8px; padding:16px 0;}
.day-row.today-row .d-row-top{display:flex; align-items:center; gap:13px; width:100%;}
.day-row .d-info{flex:1; min-width:0; font-size:14px; color:var(--fg-muted);}
.day-row .d-info .times{font-family:var(--font-mono); font-variant-numeric:tabular-nums; color:var(--fg);}
.day-row .d-ecart{font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-weight:700; font-size:16px; flex-shrink:0; text-align:right; min-width:64px;}
.d-ecart.pos{color:var(--good);}
.d-ecart.neg{color:var(--bad);}
.d-ecart.zero{color:var(--fg-muted);}
.d-status{width:9px; height:9px; border-radius:2px; flex-shrink:0;}
.d-status.done{background:var(--accent); box-shadow:0 0 5px var(--accent);}
.d-status.pending{background:transparent; border:1px solid var(--border);}

.tip{
  background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius); padding:11px 13px; font-size:12px; line-height:1.45;
  display:flex; gap:8px; align-items:flex-start;
}
.tip .ic{flex-shrink:0;}

/* Day entry screen */
.day-tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px;}
.day-tabs button{
  flex-shrink:0; border:1px solid var(--border); background:var(--surface); color:var(--fg-muted);
  font-family:var(--font-mono); font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.04em;
  padding:8px 12px; border-radius:4px; cursor:pointer;
}
.day-tabs button.active{background:var(--accent); color:#10140a; border-color:var(--accent);}
.day-tabs button.has-data::after{content:" ●"; font-size:8px; vertical-align:middle;}

.field-group{display:flex; flex-direction:column; gap:10px;}
.field{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px dashed var(--border);}
.field:last-child{border-bottom:none;}
.field label{font-size:13px; font-weight:600; display:flex; align-items:center; gap:8px;}
.field input[type="time"]{
  font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:16px; font-weight:700;
  background:var(--surface-2); border:1px solid var(--border); border-radius:4px; padding:8px 10px; color:var(--fg);
  width:112px; text-align:center;
}
.field input[type="time"]::-webkit-calendar-picker-indicator{filter:var(--icon-filter, none); opacity:.6;}

.daysummary{
  margin-top:4px; display:flex; align-items:center; justify-content:space-between;
  background:var(--surface-2); border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:var(--radius); padding:12px 14px;
}
.daysummary .ds-label{font-size:10px; color:var(--fg-muted); font-weight:700; font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.06em;}
.daysummary .ds-value{font-family:var(--font-mono); font-size:19px; font-weight:700;}

button.primary{
  background:var(--accent); color:#10140a; border:none; border-radius:5px; padding:13px; font-size:13px;
  font-weight:700; font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.04em; cursor:pointer; width:100%;
}
button.primary:active{background:var(--accent-strong);}
button.ghost{
  background:var(--surface-2); color:var(--fg); border:1px solid var(--border); border-radius:5px; padding:13px;
  font-size:13px; font-weight:700; font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.04em; cursor:pointer; width:100%;
}
.btn-row{display:flex; gap:8px;}
.btn-row > *{flex:1;}

/* Report screen */
.week-item{
  display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border);
}
.week-item:last-child{border-bottom:none;}
.week-item input[type="checkbox"]{
  width:20px; height:20px; accent-color:var(--accent); flex-shrink:0; cursor:pointer;
}
.week-item .wi-label{flex:1; font-size:14px; font-weight:600;}
.week-item .wi-value{font-family:var(--font-mono); font-weight:700; font-size:14px;}
.week-item .wi-value.pos{color:var(--good);}
.week-item .wi-value.neg{color:var(--bad);}

.mode-option{
  display:flex; align-items:flex-start; gap:10px; padding:12px; border:1px solid var(--border); border-radius:var(--radius); cursor:pointer;
}
.mode-option.selected{border-color:var(--accent); background:var(--accent-soft);}
.mode-option input{margin-top:3px; accent-color:var(--accent); width:18px; height:18px; flex-shrink:0;}
.mode-option .mo-title{font-weight:700; font-size:14px;}
.mode-option .mo-desc{font-size:12px; color:var(--fg-muted); margin-top:2px;}

.section-title{
  font-size:11px; font-weight:700; color:var(--fg-muted); text-transform:uppercase; letter-spacing:.06em; margin:2px 0 0;
  font-family:var(--font-mono); border-left:2px solid var(--accent); padding-left:7px;
}
.section-title::before{content:"// "; color:var(--accent-strong);}

footer.note{
  text-align:center; font-size:10px; color:var(--fg-muted); padding-top:6px; font-family:var(--font-mono);
  text-transform:uppercase; letter-spacing:.04em;
}

.day-row.clickable{cursor:pointer;}
.day-row.clickable:active{background:var(--surface-2); border-radius:4px;}

.modal-backdrop{
  position:fixed; inset:0; background:rgba(10,12,8,.55); display:flex; align-items:flex-end; justify-content:center;
  padding:0; z-index:50;
}
.modal-sheet{
  width:100%; max-width:480px; background:var(--surface); border-radius:14px 14px 0 0; border-top:3px solid var(--accent);
  padding:18px max(18px, env(safe-area-inset-left,0px)) max(18px, calc(env(safe-area-inset-bottom,0px) + 18px)) max(18px, env(safe-area-inset-right,0px));
  display:flex; flex-direction:column; gap:12px; max-height:85vh; overflow-y:auto;
}
.modal-header{display:flex; align-items:center; justify-content:space-between;}
.modal-close{
  background:var(--surface-2); border:1px solid var(--border); color:var(--fg-muted); width:28px; height:28px; border-radius:4px;
  font-size:14px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center;
}

.mode-toggle{display:flex; gap:6px;}
.mode-toggle button{
  flex:1; border:1px solid var(--border); background:var(--surface); color:var(--fg-muted);
  font-family:var(--font-mono); font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.03em;
  padding:10px 8px; border-radius:5px; cursor:pointer;
  text-align:center; line-height:1.3;
}
.mode-toggle button.active{background:var(--accent); color:#10140a; border-color:var(--accent);}

.pointage-card{display:flex; flex-direction:column; gap:8px;}
.pointage-card-big{padding:20px 18px;}
.pointage-day-label{
  text-align:center; font-family:var(--font-display); text-transform:uppercase; letter-spacing:.08em;
  font-size:20px; font-weight:700; color:var(--fg);
}
.pointage-time{font-size:28px; font-weight:700; font-family:var(--font-mono); text-align:center; margin-top:4px;}
.pointage-icons{display:flex; gap:7px; margin-top:8px;}
.pointage-icon-btn{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer;
  background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius); padding:10px 4px;
}
.pointage-icon-btn .pi-emoji{font-size:20px;}
.pointage-icon-btn .pi-label{font-size:9px; font-weight:700; font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.02em; color:var(--fg-muted); text-align:center; line-height:1.2;}
.pointage-icon-btn .pi-time{font-size:10px; font-family:var(--font-mono); font-weight:700; color:var(--accent-strong);}
.pointage-icon-btn.done{background:var(--accent-soft); border-color:var(--accent);}
.pointage-icon-btn.done .pi-label{color:var(--accent-strong);}
.field .punched-tag{font-size:10px; font-weight:700; color:var(--accent-strong); background:var(--accent-soft); border-radius:6px; padding:2px 6px; margin-left:6px;}

button.tap-confirm.armed{
  background:var(--warn); animation:pointage-pulse 1.1s ease-in-out infinite;
}
@keyframes pointage-pulse{
  0%,100%{ box-shadow:0 0 0 0 rgba(201,130,42,.35); }
  50%{ box-shadow:0 0 0 8px rgba(201,130,42,0); }
}

/* Timeline visuelle du jour (modal détail) */
.timeline-wrap{position:relative; padding-top:16px; padding-bottom:2px;}
.timeline-track{
  position:relative; height:12px; background:var(--surface-2); border:1px solid var(--border); border-radius:3px; overflow:hidden;
}
.timeline-seg{position:absolute; top:0; bottom:0; transition:opacity .2s ease;}
.timeline-seg.work{background:var(--accent);}
.timeline-seg.lunch{background:repeating-linear-gradient(45deg, var(--warn) 0 4px, transparent 4px 8px); opacity:.75;}
.timeline-seg.projected{opacity:.28;}
.timeline-seg.lunch.projected{opacity:.3;}
.timeline-label.projected{opacity:.55; font-style:italic;}
.timeline-wrap.big .timeline-track{height:18px; border-radius:4px;}
.timeline-wrap.big .timeline-label{font-size:11px;}
.timeline-wrap.big .timeline-labels.two-row{height:30px;}
.timeline-wrap.big .timeline-label.row-bottom{top:15px;}
.timeline-tick{position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--fg-muted); opacity:.6;}
.timeline-now{position:absolute; top:-5px; bottom:-5px; width:2px; background:var(--bad); z-index:2;}
.timeline-now::after{
  content:""; position:absolute; top:-3px; left:-2px; width:6px; height:6px; background:var(--bad); border-radius:50%;
}
.timeline-labels{position:relative; height:13px; margin-top:4px;}
.timeline-labels.two-row{height:26px;}
.timeline-label{
  position:absolute; top:0; transform:translateX(-50%); font-family:var(--font-mono); font-size:9px; font-weight:600;
  color:var(--fg-muted); white-space:nowrap;
}
.timeline-label.row-bottom{top:13px;}
.timeline-legend{display:flex; gap:14px; margin-top:8px; font-size:10px; color:var(--fg-muted); font-family:var(--font-mono);}
.timeline-legend span{display:inline-flex; align-items:center; gap:5px;}
.timeline-legend i{width:9px; height:9px; border-radius:2px; display:inline-block;}
.timeline-legend i.work{background:var(--accent);}
.timeline-legend i.lunch{background:repeating-linear-gradient(45deg, var(--warn) 0 3px, transparent 3px 6px);}
.timeline-legend i.projected{opacity:.3;}
.clock-row{display:flex; align-items:center; gap:8px;}
.info-btn{
  width:24px; height:24px; border-radius:50%; border:1px solid var(--border); background:var(--surface-2); color:var(--accent-strong);
  font-family:var(--font-mono); font-weight:700; font-size:13px; line-height:1; cursor:pointer; padding:0;
  display:flex; align-items:center; justify-content:center;
}
.about-version{
  font-family:var(--font-mono); font-size:11px; font-weight:700; color:var(--accent-strong);
  border:1px solid var(--border); border-radius:4px; padding:4px 8px; background:var(--surface-2); align-self:flex-start;
}
.gloss{display:flex; flex-direction:column; gap:10px; margin:0;}
.gloss div{border-left:2px solid var(--accent); padding-left:9px;}
.gloss dt{font-family:var(--font-mono); font-size:12px; font-weight:700; color:var(--fg); text-transform:uppercase; letter-spacing:.03em;}
.gloss dd{margin:2px 0 0; font-size:13px; line-height:1.45; color:var(--fg-muted);}
.about-text{font-size:13px; line-height:1.5; color:var(--fg-muted); margin:0;}
.about-text strong{color:var(--fg);}
</style>

<body>

<script>
(function(){
"use strict";

// ---------- Schedule reference (minutes) ----------
var DEFAULT_SETTINGS = {
  // Mon-Thu
  weekday: { arrival:"07:00", lunchStart:"12:00", lunchEnd:"12:45", departure:"16:45", defaultDeparture:"16:15", refMin: 8*60+30 },
  // Friday
  friday:  { arrival:"07:00", lunchStart:"12:00", lunchEnd:"12:45", departure:"14:35", defaultDeparture:"14:35", refMin: 6*60+50 }
};
var WEEK_TARGET_MIN = 40*60+50;
var DAYS = ["lundi","mardi","mercredi","jeudi","vendredi"];
var DAY_LABELS = {lundi:"Lundi", mardi:"Mardi", mercredi:"Mercredi", jeudi:"Jeudi", vendredi:"Vendredi"};
var DAY_SHORT = {lundi:"Lun", mardi:"Mar", mercredi:"Mer", jeudi:"Jeu", vendredi:"Ven"};

// ---------- Storage ----------
var STORE_KEY = "planning-horaire-v3";
function loadStore(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {
    settings: DEFAULT_SETTINGS,
    currentWeek: {}, // { lundi: {arrival,lunchStart,lunchEnd,departure}, ... }
    pot: { totalMin: 60, spreadWeeks: 0 }, // pot d'heures sup/insup ; spreadWeeks=0 = pas étalé, reste en réserve
    reportMode: "vendredi" // "vendredi" | "repartir"
  };
}
function saveStore(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}

var state = loadStore();
var currentTab = "semaine";
var modalDay = null;
var APP_VERSION = "1.2";
var APP_DATE = "16.10.2026";
var aboutOpen = false;
var modalEdited = false; // true dès que l'utilisateur modifie un champ pendant que la fiche jour est ouverte

// ---------- Time helpers ----------
function toMin(hhmm){
  if(!hhmm) return null;
  var p = hhmm.split(":"); return (+p[0])*60 + (+p[1]);
}
function toHHMM(min){
  min = Math.round(min);
  var neg = min<0; min = Math.abs(min);
  var h = Math.floor(min/60), m = min%60;
  return (neg?"-":"")+h+"h"+(m<10?"0":"")+m;
}
function toClock(min){
  min = Math.round(min);
  min = ((min%1440)+1440)%1440;
  var h = Math.floor(min/60), m = min%60;
  return (h<10?"0":"")+h+":"+(m<10?"0":"")+m;
}

function isoWeekNumber(){
  var d = new Date();
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() + 3 - ((d.getDay()+6)%7));
  var week1 = new Date(d.getFullYear(),0,4);
  return 1 + Math.round(((d-week1)/86400000 - 3 + ((week1.getDay()+6)%7))/7);
}

function dayRef(day){ return day==="vendredi" ? state.settings.friday : state.settings.weekday; }

function ensureDayDefaults(day){
  var ref = dayRef(day);
  if(!state.currentWeek[day]) state.currentWeek[day] = {};
  var d = state.currentWeek[day];
  var changed = false;
  if(!d.arrival){ d.arrival = ref.arrival; changed = true; }
  if(!d.lunchStart){ d.lunchStart = ref.lunchStart; changed = true; }
  if(!d.lunchEnd){ d.lunchEnd = ref.lunchEnd; changed = true; }
  if(!d.departure){ d.departure = ref.defaultDeparture || ref.departure || ""; changed = true; }
  if(d.skipMorningBreak===undefined){ d.skipMorningBreak = false; changed = true; }
  if(d.skipAfternoonBreak===undefined){ d.skipAfternoonBreak = false; changed = true; }
  if(!d.punched){ d.punched = {}; changed = true; }
  if(changed) saveStore();
}
DAYS.forEach(ensureDayDefaults);

// ---------- Pointage (horodatage en un clic) ----------
var FIELD_ORDER = ["arrival","lunchStart","lunchEnd","departure"];
var FIELD_LABELS = {arrival:"Arrivée", lunchStart:"Pause midi", lunchEnd:"Reprise", departure:"Départ"};
var FIELD_EMOJI = {arrival:"🕒", lunchStart:"🍽️", lunchEnd:"☕", departure:"🚪"};
var pointageOpen = false;
var pointagePending = null; // { day, field, time }
var pointageChooserOpen = false;

function todayKey(){
  var jsDay = new Date().getDay(); // 0=Dim ... 6=Sam
  var map = {1:"lundi",2:"mardi",3:"mercredi",4:"jeudi",5:"vendredi"};
  return map[jsDay] || null;
}
function nowHHMM(){
  var now = new Date();
  var hh = (now.getHours()<10?"0":"")+now.getHours();
  var mm = (now.getMinutes()<10?"0":"")+now.getMinutes();
  return hh+":"+mm;
}
function nextPunchField(day){
  var d = state.currentWeek[day] || {};
  var p = d.punched || {};
  for(var i=0;i<FIELD_ORDER.length;i++){
    if(!p[FIELD_ORDER[i]]) return FIELD_ORDER[i];
  }
  return null;
}
function openPointage(field){
  if(pointageOpen) return;
  var day = todayKey();
  if(!day) return;
  if(!field) field = nextPunchField(day);
  if(!field) return;
  pointagePending = { day: day, field: field, time: nowHHMM() };
  pointageOpen = true;
  render();
}
function confirmPointage(){
  var p = pointagePending;
  if(!p || !p.field){ pointageOpen = false; pointagePending = null; render(); return; }
  if(!state.currentWeek[p.day]) state.currentWeek[p.day] = {};
  var d = state.currentWeek[p.day];
  d[p.field] = p.time;
  if(!d.punched) d.punched = {};
  d.punched[p.field] = true;
  if(p.field === "departure") d.touched = true;
  saveStore();
  pointageOpen = false;
  pointagePending = null;
  render();
}
function closePointage(){
  pointageOpen = false;
  pointagePending = null;
  render();
}

function resetDay(day){
  state.currentWeek[day] = {};
  ensureDayDefaults(day);
  saveStore();
  render();
}

function dayWorkedMin(day){
  var d = state.currentWeek[day];
  if(!d || !d.arrival || !d.lunchStart || !d.lunchEnd || !d.departure) return null;
  var a=toMin(d.arrival), ls=toMin(d.lunchStart), le=toMin(d.lunchEnd), dep=toMin(d.departure);
  var worked = (ls-a) + (dep-le);
  if(d.skipMorningBreak) worked += 15;
  if(day!=="vendredi" && d.skipAfternoonBreak) worked += 15;
  return worked;
}
function dayEcartMin(day){
  var w = dayWorkedMin(day);
  if(w===null) return null;
  return w - dayRef(day).refMin;
}
function isDayFilled(day){
  var d = state.currentWeek[day];
  return !!(d && d.arrival && d.lunchStart && d.lunchEnd && d.departure);
}
function isDayTouched(day){
  var d = state.currentWeek[day];
  return !!(d && d.touched);
}
function remainingUntouchedDays(){
  return DAYS.filter(function(d){ return !isDayTouched(d); });
}

function carriedBalance(){
  // part du pot appliquée à la semaine en cours
  if(state.pot.spreadWeeks > 0) return state.pot.totalMin / state.pot.spreadWeeks;
  return 0;
}
function closeWeekAndStart(){
  var appliedThisWeek = carriedBalance(); // part du pot consommée cette semaine
  var weekEcart = touchedEcartSum(); // ce que tu as réellement fait, en plus ou en moins
  state.pot.totalMin = Math.round((state.pot.totalMin||0) - appliedThisWeek + weekEcart);
  if(state.pot.spreadWeeks > 0) state.pot.spreadWeeks = Math.max(0, state.pot.spreadWeeks - 1);
  state.currentWeek = {};
  DAYS.forEach(ensureDayDefaults);
  saveStore();
  render();
}
function touchedEcartSum(){
  var sum = 0;
  DAYS.forEach(function(day){ if(isDayTouched(day)){ var e = dayEcartMin(day); if(e!==null) sum += e; } });
  return sum;
}
function cumulativeBalance(){
  return carriedBalance() + touchedEcartSum();
}

// Estimated departure for a day not yet touched, given the current report mode
function dayProjection(day){
  var ref = dayRef(day);
  var base = carriedBalance() + touchedEcartSum();
  var remaining = remainingUntouchedDays();
  if(remaining.length===0) remaining = [day];
  var target;
  if(state.reportMode === "vendredi"){
    if(day === "vendredi") target = ref.refMin - base;
    else target = ref.refMin;
  } else {
    var perDay = base / remaining.length;
    target = ref.refMin - perDay;
  }
  var arrivalMin = toMin(ref.arrival);
  var lunchEnd = toMin(ref.lunchEnd);
  var morningWorked = toMin(ref.lunchStart) - arrivalMin;
  var departureMin;
  if(target <= morningWorked){
    // Pas besoin d'aller jusqu'à midi : on saute la pause déjeuner, on part direct dans la matinée.
    departureMin = arrivalMin + Math.max(target, 0);
  } else {
    departureMin = lunchEnd + (target - morningWorked);
  }
  return { departure: toClock(departureMin), targetMin: target, skipsLunch: target <= morningWorked };
}

// ---------- Rendering ----------
function el(tag, cls, html){
  var e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html!==undefined) e.innerHTML = html;
  return e;
}

var PAGE_COUNT = 3; // 0 = Pointage, 1 = Semaine, 2 = Report
var currentPage = 1; // on démarre sur la semaine

function goToPage(n){
  currentPage = ((n%PAGE_COUNT)+PAGE_COUNT)%PAGE_COUNT;
  render();
}
function nextPage(){ goToPage(currentPage+1); }
function prevPage(){ goToPage(currentPage-1); }

function attachSwipe(viewportEl){
  var startX=0, startY=0, tracking=false;
  viewportEl.addEventListener("pointerdown", function(e){ startX=e.clientX; startY=e.clientY; tracking=true; });
  viewportEl.addEventListener("pointerup", function(e){
    if(!tracking) return;
    tracking = false;
    var dx = e.clientX-startX, dy = e.clientY-startY;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)*1.3){
      if(dx<0) nextPage(); else prevPage();
    }
  });
}

  }

  if(modalDay) renderDayModal();

  var big = el("div", null,
    '<div style="text-align:center; font-size:38px;">'+FIELD_EMOJI[p.field]+'</div>'+

  );
  sheet.appendChild(big);

  var armed = false, armedAt = 0, armTimer = null;
  confirmBtn.onclick = function(ev){
    if(ev){ ev.preventDefault(); ev.stopPropagation(); }
    var now = Date.now();
    if(armed){
      if(now - armedAt < 150) return; // filtre un double-évènement du même tap (touch+click)
      clearTimeout(armTimer);
      armed = false;
      confirmPointage();
    } else {
      armed = true;
      armedAt = now;
      confirmBtn.classList.add("armed");
      confirmBtn.textContent = "👉 Encore un tap pour confirmer";
      armTimer = setTimeout(function(){
        armed = false;
        confirmBtn.classList.remove("armed");
        confirmBtn.textContent = "✅ Valider cette heure";
      }, 2200);
    }
  };
  sheet.appendChild(confirmBtn);

  var cancelBtn = el("button","ghost","Annuler");
  cancelBtn.style.marginTop = "4px";

function closeModal(){

    // La journée n'est considérée "complète" que si le DÉPART a été explicitement
    // pointé/validé — toucher juste l'arrivée (ou une pause) ne doit pas figer le
    // départ, qui doit rester calculé en direct tant qu'on ne l'a pas confirmé.
    if(dd.punched && dd.punched.departure){
      dd.touched = true;

  modalDay = null;
  modalEdited = false;
  render();

function buildDayTimeline(day, opts){
  opts = opts || {};
  var d = state.currentWeek[day] || {};
  var p = d.punched || {};
  var winStart = toMin("06:45"), winEnd = toMin("17:15");
  var total = winEnd - winStart;
  function pct(min){ return Math.max(0, Math.min(100, ((min-winStart)/total)*100)); }

  var wrap = el("div","timeline-wrap"+(opts.big?" big":""));
  var track = el("div","timeline-track");

  var a = toMin(d.arrival), ls = toMin(d.lunchStart), le = toMin(d.lunchEnd);
  // Tant que le départ n'est pas pointé, on affiche l'heure calculée (mode de report + pot), pas une valeur figée.
  var dep = p.departure ? toMin(d.departure) : toMin(dayProjection(day).departure);

  if(a!=null && ls!=null && ls>a){
    var seg1 = el("div","timeline-seg work"+((p.arrival&&p.lunchStart)?"":" projected"));
    seg1.style.left = pct(a)+"%"; seg1.style.width = (pct(ls)-pct(a))+"%";
    track.appendChild(seg1);
  }
  if(ls!=null && le!=null && le>ls){
    var seg2 = el("div","timeline-seg lunch"+((p.lunchStart&&p.lunchEnd)?"":" projected"));
    seg2.style.left = pct(ls)+"%"; seg2.style.width = (pct(le)-pct(ls))+"%";
    track.appendChild(seg2);
  }
  if(le!=null && dep!=null && dep>le){
    var seg3 = el("div","timeline-seg work"+((p.lunchEnd&&p.departure)?"":" projected"));
    seg3.style.left = pct(le)+"%"; seg3.style.width = (pct(dep)-pct(le))+"%";
    track.appendChild(seg3);
  }
  if(!d.skipMorningBreak){
    var mb = toMin("09:30");
    if(a!=null && ls!=null && mb>a && mb<ls){
      var tick1 = el("div","timeline-tick"); tick1.style.left = pct(mb)+"%"; tick1.title = "Pause 9h30–9h45 (offerte)";
      track.appendChild(tick1);
    }
  }
  if(day!=="vendredi" && !d.skipAfternoonBreak){
    var ab = toMin("15:30");
    if(le!=null && dep!=null && ab>le && ab<dep){
      var tick2 = el("div","timeline-tick"); tick2.style.left = pct(ab)+"%"; tick2.title = "Pause 15h30–15h45 (offerte)";
      track.appendChild(tick2);
    }
  }
  if(todayKey()===day){
    var now = toMin(nowHHMM());
    if(now>=winStart && now<=winEnd){
      var nowMark = el("div","timeline-now"); nowMark.style.left = pct(now)+"%"; nowMark.title = "Maintenant";
      track.appendChild(nowMark);
    }
  }
  wrap.appendChild(track);

  var labels = el("div","timeline-labels");
  [[a,"arrival"],[dep,"departure"]].forEach(function(pair){
    if(pair[0]==null) return;
    var lab = el("div","timeline-label"+(p[pair[1]]?"":" projected"), toClock(pair[0]));
    lab.style.left = pct(pair[0])+"%";
    labels.appendChild(lab);
  });
  wrap.appendChild(labels);

  if(opts.legend!==false){
    var legend = el("div","timeline-legend",
      '<span><i class="work"></i>Travail confirmé</span><span><i class="work projected"></i>Prévu</span><span><i class="lunch"></i>Pause midi</span>'
    );
    wrap.appendChild(legend);
  }

  return wrap;
}

function renderDayModal(){
  var day = modalDay;
  var backdrop = el("div","modal-backdrop");
  backdrop.onclick = function(e){ if(e.target===backdrop){ closeModal(); } };

  var sheet = el("div","modal-sheet");

  head.appendChild(el("h3", null, DAY_LABELS[day]));

  var ref = dayRef(day);

  sheet.appendChild(buildDayTimeline(day));

  var group = el("div","field-group");

  function makeField(labelText, emoji, key, placeholder){
    var f = el("div","field");
    var lab = el("label", null, '<span>'+emoji+'</span><span>'+labelText+'</span>');
    f.appendChild(lab);
    var input = document.createElement("input");
    input.type = "time";
    input.value = d[key] || "";
    input.placeholder = placeholder;
    input.id = "field-"+day+"-"+key;
    input.onchange = function(){
      if(!state.currentWeek[day]) state.currentWeek[day] = {};
      state.currentWeek[day][key] = input.value;
      if(!state.currentWeek[day].punched) state.currentWeek[day].punched = {};
      state.currentWeek[day].punched[key] = true;
      modalEdited = true;
      saveStore();
      render(); // recalcule en direct sur les autres jours / le solde / vendredi
    };
    f.appendChild(input);
    group.appendChild(f);
  }

  makeField("Arrivée","🕒","arrival", ref.arrival);
  makeField("Début pause midi","🍽️","lunchStart", ref.lunchStart);
  makeField("Reprise","☕","lunchEnd", ref.lunchEnd);
  makeField("Départ","🚪","departure", ref.departure);

  sheet.appendChild(group);

  function makeSkipCheckbox(labelText, key){
    var f = el("div","field");
    var lab = el("label", null, '<span>☕❌</span><span>'+labelText+' sautée (+15min)</span>');
    f.appendChild(lab);
    var cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = !!d[key];
    cb.style.cssText = "width:22px;height:22px;accent-color:var(--accent);";
    cb.onchange = function(){
      if(!state.currentWeek[day]) state.currentWeek[day] = {};
      state.currentWeek[day][key] = cb.checked;
      modalEdited = true;
      saveStore();
      render();
    };
    f.appendChild(cb);
    return f;
  }
  var breaksGroup = el("div","field-group");
  breaksGroup.appendChild(makeSkipCheckbox("Pause du matin", "skipMorningBreak"));
  if(day !== "vendredi"){
    breaksGroup.appendChild(makeSkipCheckbox("Pause de l'après-midi", "skipAfternoonBreak"));
  }
  sheet.appendChild(breaksGroup);

  if(day === "vendredi"){
    var depPunched = !!(d.punched && d.punched.departure);
    if(!depPunched){
      var fp = dayProjection("vendredi");
      var fpTip = el("div","tip");
      fpTip.innerHTML = '<span class="ic">✨</span><span>Le départ reste <strong>calculé en direct</strong> ('+fp.departure+' pour l’instant) tant que tu ne l’as pas validé ci-dessous — pointer l’arrivée ou une pause ne le fige pas.</span>';
      sheet.appendChild(fpTip);
      var applyBtn = el("button","primary","✅ Valider la fin de journée ("+fp.departure+")");
      applyBtn.onclick = function(){
        if(!state.currentWeek[day]) state.currentWeek[day] = {};
        state.currentWeek[day].departure = fp.departure;
        if(!state.currentWeek[day].punched) state.currentWeek[day].punched = {};
        state.currentWeek[day].punched.departure = true;
        modalEdited = true;
        saveStore();
        render();
      };
      sheet.appendChild(applyBtn);
    } else {
      var doneTip = el("div","tip");
      doneTip.innerHTML = '<span class="ic">✅</span><span>Fin de journée validée à <strong>'+d.departure+'</strong>.</span>';
      sheet.appendChild(doneTip);
    }
  }

  var worked = dayWorkedMin(day);
  var summary = el("div","daysummary");
  if(worked!==null){
    var ec = worked - ref.refMin;
    summary.innerHTML =
      '<div><div class="ds-label">Heures du jour</div><div class="ds-value">'+toHHMM(worked)+'</div></div>'+
      '<div style="text-align:right;"><div class="ds-label">Écart</div><div class="ds-value" style="color:'+(ec>0?"var(--good)":ec<0?"var(--bad)":"var(--fg)")+'">'+(ec>=0?"+":"")+toHHMM(ec)+'</div></div>';
  } else {
    summary.innerHTML = '<div class="ds-label">Remplis les 4 heures pour voir le calcul</div>';
  }
  sheet.appendChild(summary);

  var hint = el("div","tip");
  hint.innerHTML = '<span class="ic">ℹ️</span><span>Référence '+DAY_LABELS[day]+' : '+toHHMM(ref.refMin)+'. Les pauses de 15’ sont offertes, seule la pause de midi est déduite.</span>';
  sheet.appendChild(hint);

  var doneBtn = el("button","primary","Fermer et recalculer");
  doneBtn.onclick = closeModal;
  sheet.appendChild(doneBtn);

  backdrop.appendChild(sheet);
  document.getElementById("app").appendChild(backdrop);
}

function renderAbout(){
  var backdrop = el("div","modal-backdrop");
  backdrop.onclick = function(e){ if(e.target===backdrop){ aboutOpen = false; render(); } };
  var sheet = el("div","modal-sheet");
  var head = el("div","modal-header");
  head.appendChild(el("h3", null, "À propos"));
  var closeBtn = el("button","modal-close","✕");
  closeBtn.onclick = function(){ aboutOpen = false; render(); };
  head.appendChild(closeBtn);
  sheet.appendChild(head);

  sheet.appendChild(el("div","about-version","Planning Horaire · v"+APP_VERSION+" · "+APP_DATE));

  sheet.appendChild(el("div","section-title","Comment ça marche"));
  sheet.appendChild(el("p","about-text",
    "<strong>Une journée est validée</strong> quand son <strong>départ</strong> est pointé ou confirmé. Pointer ou modifier l’arrivée ou une pause ne la valide pas : le départ reste <strong>calculé en direct</strong> (affiché en pâle, « prévu »).<br><br>"+
    "<strong>Le départ calculé</strong> dépend du mode choisi : « Tout sur vendredi » garde les jours normaux à leur référence et fait absorber le solde (et la part du pot) par le vendredi ; « Répartir » partage le solde sur les jours pas encore validés.<br><br>"+
    "<strong>Mise à jour de l’app</strong> : ouvre-la deux fois (ferme-la complètement entre les deux). Le numéro de version ci-dessus te dit laquelle tu as."
  ));

  sheet.appendChild(el("div","section-title","Glossaire"));
  var items = [
    ["Pointage","Enregistre l’heure actuelle sur l’arrivée, la pause midi, la reprise ou le départ, avec une confirmation par double tap."],
    ["Prévu / Confirmé","Prévu (pâle) = valeur par défaut ou calculée. Confirmé (plein) = heure que tu as pointée ou saisie toi-même."],
    ["Référence","Durée de travail attendue : 8h30 du lundi au jeudi, 6h50 le vendredi, soit 40h50 par semaine."],
    ["Écart","Heures faites moins la référence du jour. Positif = en plus, négatif = en moins."],
    ["Solde cumulé","Part du pot appliquée cette semaine + écarts des jours validés. C’est ce que le vendredi (ou les jours restants) doit compenser."],
    ["Pot","Réserve d’heures en plus ou en moins reportée de semaine en semaine. Il grossit à chaque clôture de semaine."],
    ["Étaler","Nombre de semaines sur lesquelles le pot est repris. « En réserve » = le pot dort, rien n’est appliqué."],
    ["Pauses offertes","Les pauses de 9h30 et 15h30 (matin seulement le vendredi) ne sont pas déduites. Si tu en sautes une, elle compte +15 min."],
    ["Clôturer la semaine","L’écart réel de la semaine part dans le pot, puis une nouvelle semaine vierge démarre."]
  ];
  var dl = el("dl","gloss");
  items.forEach(function(it){
    var row = el("div");
    row.appendChild(el("dt",null,it[0]));
    row.appendChild(el("dd",null,it[1]));
    dl.appendChild(row);
  });
  sheet.appendChild(dl);

  var ok = el("button","primary","Fermer");
  ok.onclick = function(){ aboutOpen = false; render(); };
  sheet.appendChild(ok);

  backdrop.appendChild(sheet);
  document.getElementById("app").appendChild(backdrop);
}

function renderReport(app){
  var pot = state.pot;

  var spreadCard = el("div","card");
  spreadCard.appendChild(el("div","section-title","Étaler sur combien de semaines ?"));
  var spreadRow = el("div", null);
  spreadRow.style.cssText = "display:flex; align-items:center; gap:10px; margin-top:10px;";
  var minusBtn = el("button","ghost","−"); minusBtn.style.width="48px";
  var plusBtn = el("button","ghost","+"); plusBtn.style.width="48px";
  var countDisplay = el("div", null, pot.spreadWeeks===0 ? "En réserve" : (pot.spreadWeeks+" semaine"+(pot.spreadWeeks>1?"s":"")));
  countDisplay.style.cssText = "flex:1; text-align:center; font-weight:700; font-family:var(--font-mono);";
  minusBtn.onclick = function(){ pot.spreadWeeks = Math.max(0, pot.spreadWeeks-1); saveStore(); render(); };
  plusBtn.onclick = function(){ pot.spreadWeeks = Math.min(12, pot.spreadWeeks+1); saveStore(); render(); };
  spreadRow.appendChild(minusBtn); spreadRow.appendChild(countDisplay); spreadRow.appendChild(plusBtn);
  spreadCard.appendChild(spreadRow);

  var appliedThisWeek = carriedBalance();
  var hint = el("div","tip");
  hint.style.marginTop = "10px";
  if(pot.spreadWeeks>0){
    hint.innerHTML = '<span class="ic">💡</span><span>Cette semaine, <strong>'+(appliedThisWeek>=0?"+":"")+toHHMM(appliedThisWeek)+'</strong> du pot est appliqué automatiquement (réparti sur '+pot.spreadWeeks+' semaine'+(pot.spreadWeeks>1?"s":"")+').</span>';
  } else {
    hint.innerHTML = '<span class="ic">💤</span><span>Le pot dort, rien n’est appliqué cette semaine. Augmente le nombre de semaines pour commencer à le reprendre, ou laisse-le grossir pour une demi-journée ou une journée de récup plus tard.</span>';
  }
  spreadCard.appendChild(hint);
  app.appendChild(spreadCard);
}

function renderCloseWeekCard(app){
  var closeCard = el("div","card");
  closeCard.appendChild(el("div","section-title","Fin de semaine"));
  var closeDesc = el("div", null, "Clôture la semaine en cours : son écart réel part dans le pot, et une nouvelle semaine vierge démarre.");
  closeDesc.style.cssText = "font-size:13px; color:var(--fg-muted); margin:8px 0 12px;";
  closeCard.appendChild(closeDesc);
  var closeBtn = el("button","primary","✅ Clôturer la semaine");
  closeBtn.onclick = closeWeekAndStart;
  closeCard.appendChild(closeBtn);
  app.appendChild(closeCard);
}

render();

// Rafraîchit le marqueur "maintenant" de la timeline toutes les 30s (sans gêner une fiche ouverte)
setInterval(function(){
  if(!modalDay && !pointageOpen && !pointageChooserOpen && !aboutOpen) render();
}, 30000);
})();
</script>
