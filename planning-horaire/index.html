<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planning Horaire</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6fae52">
<style>
/* Layout: single-page technical dashboard — grid backdrop, squared panels, instrument-style readouts, pistachio accent */
:root{
  --bg:#f3f4ee;
  --surface:#ffffff;
  --surface-2:#e9ece2;
  --fg:#242922;
  --fg-muted:#6b7266;
  --border:#cdd4c2;
  --grid-line:rgba(111,174,82,.10);
  --accent:#6fae52;
  --accent-strong:#4f8a38;
  --accent-soft:#dcedd0;
  --good:#3f8f4f;
  --warn:#c9822a;
  --bad:#c15b4a;
  --radius:6px;
  --font-display:'Rajdhani',system-ui,sans-serif;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15180f;
    --surface:#1d2117;
    --surface-2:#242a1c;
    --fg:#e9ede3;
    --fg-muted:#93a085;
    --border:#333c27;
    --grid-line:rgba(143,203,111,.08);
    --accent:#8fcb6f;
    --accent-strong:#a6db88;
    --accent-soft:#2c3a22;
    --good:#8fcb6f;
    --warn:#e0a855;
    --bad:#e08271;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15180f;
  --surface:#1d2117;
  --surface-2:#242a1c;
  --fg:#e9ede3;
  --fg-muted:#93a085;
  --border:#333c27;
  --grid-line:rgba(143,203,111,.08);
  --accent:#8fcb6f;
  --accent-strong:#a6db88;
  --accent-soft:#2c3a22;
  --good:#8fcb6f;
  --warn:#e0a855;
  --bad:#e08271;
  color-scheme:dark;
}
*{box-sizing:border-box;}
[hidden]{display:none!important;}
body{
  background-color:var(--bg);
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size:22px 22px;
  color:var(--fg);
  font-family:var(--font-body);
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:16px 32px;
  min-height:100%;
}
h1,h2,h3{font-family:var(--font-display); text-wrap:balance; margin:0;}
.app{max-width:480px; margin:0 auto; display:flex; flex-direction:column; gap:14px;}

header.top{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:10px 12px; padding-top:calc(10px + env(safe-area-inset-top,0px));
  background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:var(--radius);
}
header.top .title{display:flex; align-items:center; gap:9px;}
header.top .title .logo{flex-shrink:0;}
header.top h1{
  font-size:18px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--fg);
}
header.top h1 small{display:block; font-family:var(--font-mono); font-size:9px; font-weight:600; color:var(--fg-muted); letter-spacing:.1em; text-transform:none;}
.header-right{display:flex; flex-direction:column; align-items:flex-end; gap:5px;}
.weeklabel{
  font-size:11px; color:var(--accent-strong); font-weight:700; font-family:var(--font-mono);
  border:1px solid var(--border); border-radius:4px; padding:4px 8px; background:var(--surface-2); letter-spacing:.03em;
}
.clockbadge{
  font-size:14px; font-weight:700; font-family:var(--font-mono); color:var(--fg-muted); letter-spacing:.04em;
}

.pager-viewport{overflow:hidden; position:relative; touch-action:pan-y;}
.pager-track{display:flex; width:300%; transition:transform .28s ease;}
.pager-page{width:33.3333%; flex-shrink:0; display:flex; flex-direction:column; gap:14px; min-width:0; padding:0 4px;}

.page-dots{
  position:fixed; right:7px; top:50%; transform:translateY(-50%); z-index:40;
  display:flex; flex-direction:column; gap:9px;
}
.page-dot{
  width:6px; height:14px; border-radius:3px; background:var(--border); cursor:pointer; transition:background .15s ease, height .15s ease;
}
.page-dot.active{background:var(--accent); height:22px;}

nav.tabs{
  display:flex; gap:6px; background:var(--surface-2); border-radius:14px; padding:4px;
}
nav.tabs button{
  flex:1; border:none; background:transparent; color:var(--fg-muted); font-family:var(--font-body);
  font-weight:700; font-size:13px; padding:10px 6px; border-radius:11px; cursor:pointer;
  transition:background .15s ease, color .15s ease;
}
nav.tabs button.active{background:var(--surface); color:var(--accent-strong); box-shadow:0 1px 2px rgba(0,0,0,.08);}

.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px;
}
.card + .card{margin-top:0;}

.balance-card{
  background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:var(--radius); padding:14px 16px;
  display:flex; flex-direction:column; gap:4px;
}
.balance-card .label{font-size:10px; font-weight:700; color:var(--fg-muted); text-transform:uppercase; letter-spacing:.08em; font-family:var(--font-mono);}
.balance-card .value{font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:23px; font-weight:700; letter-spacing:-.01em;}
.balance-card .sub{font-size:11px; color:var(--fg-muted); font-family:var(--font-mono); line-height:1.5;}

.stat-row{display:flex; gap:10px;}
.stat-row .card{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; border-left:1px solid var(--border);}
.stat-row .stat-label{font-size:10px; color:var(--fg-muted); font-weight:700; text-transform:uppercase; letter-spacing:.06em; font-family:var(--font-mono);}
.stat-row .stat-value{font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:17px; font-weight:700;}

.day-row{
  display:flex; align-items:center; gap:13px; padding:16px 0; border-bottom:1px dashed var(--border);
}
.day-row:last-child{border-bottom:none;}
.day-row .d-name{
  width:52px; font-weight:700; font-size:15px; flex-shrink:0; font-family:var(--font-mono); text-transform:uppercase;
  color:var(--fg-muted); letter-spacing:.04em;
}
.day-row .d-reset{
  background:none; border:1px solid var(--border); border-radius:5px; color:var(--fg-muted); font-size:13px; padding:4px 7px; cursor:pointer; flex-shrink:0; line-height:1.4;
}
.day-row.today-row{flex-direction:column; align-items:stretch; gap:8px; padding:16px 0;}
.day-row.today-row .d-row-top{display:flex; align-items:center; gap:13px; width:100%;}
.day-row .d-info{flex:1; min-width:0; font-size:14px; color:var(--fg-muted);}
.day-row .d-info .times{font-family:var(--font-mono); font-variant-numeric:tabular-nums; color:var(--fg);}
.day-row .d-ecart{font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-weight:700; font-size:16px; flex-shrink:0; text-align:right; min-width:64px;}
.d-ecart.pos{color:var(--good);}
.d-ecart.neg{color:var(--bad);}
.d-ecart.zero{color:var(--fg-muted);}
.d-status{width:9px; height:9px; border-radius:2px; flex-shrink:0;}
.d-status.done{background:var(--accent); box-shadow:0 0 5px var(--accent);}
.d-status.pending{background:transparent; border:1px solid var(--border);}

.tip{
  background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius); padding:11px 13px; font-size:12px; line-height:1.45;
  display:flex; gap:8px; align-items:flex-start;
}
.tip .ic{flex-shrink:0;}
.ico{display:inline-flex;flex:none;width:1.25em;height:1.25em;vertical-align:-.28em;color:var(--ic)}.ico svg{width:100%;height:100%}
button.primary .ico,.sv-save .ico{color:inherit}
.modal-close .ico,.d-reset .ico{width:1.1em;height:1.1em;vertical-align:-.2em}

/* Day entry screen */
.day-tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px;}
.day-tabs button{
  flex-shrink:0; border:1px solid var(--border); background:var(--surface); color:var(--fg-muted);
  font-family:var(--font-mono); font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.04em;
  padding:8px 12px; border-radius:4px; cursor:pointer;
}
.day-tabs button.active{background:var(--accent); color:#10140a; border-color:var(--accent);}
.day-tabs button.has-data::after{content:" ●"; font-size:8px; vertical-align:middle;}

.field-group{display:flex; flex-direction:column; gap:10px;}
.field{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px dashed var(--border);}
.field:last-child{border-bottom:none;}
.field label{font-size:13px; font-weight:600; display:flex; align-items:center; gap:8px;}
.field input[type="time"]{
  font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:16px; font-weight:700;
  background:var(--surface-2); border:1px solid var(--border); border-radius:4px; padding:8px 10px; color:var(--fg);
  width:112px; text-align:center;
}
.field input[type="time"]::-webkit-calendar-picker-indicator{filter:var(--icon-filter, none); opacity:.6;}

.daysummary{
  margin-top:4px; display:flex; align-items:center; justify-content:space-between;
  background:var(--surface-2); border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:var(--radius); padding:12px 14px;
}
.daysummary .ds-label{font-size:10px; color:var(--fg-muted); font-weight:700; font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.06em;}
.daysummary .ds-value{font-family:var(--font-mono); font-size:19px; font-weight:700;}

button.primary{
  background:var(--accent); color:#10140a; border:none; border-radius:5px; padding:13px; font-size:13px;
  font-weight:700; font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.04em; cursor:pointer; width:100%;
}
button.primary:active{background:var(--accent-strong);}
button.ghost{
  background:var(--surface-2); color:var(--fg); border:1px solid var(--border); border-radius:5px; padding:13px;
  font-size:13px; font-weight:700; font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.04em; cursor:pointer; width:100%;
}
.btn-row{display:flex; gap:8px;}
.btn-row > *{flex:1;}

/* Report screen */
.week-item{
  display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border);
}
.week-item:last-child{border-bottom:none;}
.week-item input[type="checkbox"]{
  width:20px; height:20px; accent-color:var(--accent); flex-shrink:0; cursor:pointer;
}
.week-item .wi-label{flex:1; font-size:14px; font-weight:600;}
.week-item .wi-value{font-family:var(--font-mono); font-weight:700; font-size:14px;}
.week-item .wi-value.pos{color:var(--good);}
.week-item .wi-value.neg{color:var(--bad);}

.mode-option{
  display:flex; align-items:flex-start; gap:10px; padding:12px; border:1px solid var(--border); border-radius:var(--radius); cursor:pointer;
}
.mode-option.selected{border-color:var(--accent); background:var(--accent-soft);}
.mode-option input{margin-top:3px; accent-color:var(--accent); width:18px; height:18px; flex-shrink:0;}
.mode-option .mo-title{font-weight:700; font-size:14px;}
.mode-option .mo-desc{font-size:12px; color:var(--fg-muted); margin-top:2px;}

.section-title{
  font-size:11px; font-weight:700; color:var(--fg-muted); text-transform:uppercase; letter-spacing:.06em; margin:2px 0 0;
  font-family:var(--font-mono); border-left:2px solid var(--accent); padding-left:7px;
}
.section-title::before{content:"// "; color:var(--accent-strong);}

footer.note{
  text-align:center; font-size:10px; color:var(--fg-muted); padding-top:6px; font-family:var(--font-mono);
  text-transform:uppercase; letter-spacing:.04em;
}

.day-row.clickable{cursor:pointer;}
.day-row.clickable:active{background:var(--surface-2); border-radius:4px;}

.modal-backdrop{
  position:fixed; inset:0; background:rgba(10,12,8,.55); display:flex; align-items:flex-end; justify-content:center;
  padding:0; z-index:50;
}
.modal-sheet{
  width:100%; max-width:480px; background:var(--surface); border-radius:14px 14px 0 0; border-top:3px solid var(--accent);
  padding:18px max(18px, env(safe-area-inset-left,0px)) max(18px, calc(env(safe-area-inset-bottom,0px) + 18px)) max(18px, env(safe-area-inset-right,0px));
  display:flex; flex-direction:column; gap:12px; max-height:85vh; overflow-y:auto;
}
.modal-header{display:flex; align-items:center; justify-content:space-between;}
.modal-close{
  background:var(--surface-2); border:1px solid var(--border); color:var(--fg-muted); width:28px; height:28px; border-radius:4px;
  font-size:14px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center;
}

.mode-toggle{display:flex; gap:6px;}
.mode-toggle button{
  flex:1; border:1px solid var(--border); background:var(--surface); color:var(--fg-muted);
  font-family:var(--font-mono); font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.03em;
  padding:10px 8px; border-radius:5px; cursor:pointer;
  text-align:center; line-height:1.3;
}
.mode-toggle button.active{background:var(--accent); color:#10140a; border-color:var(--accent);}

.pointage-card{display:flex; flex-direction:column; gap:8px;}
.pointage-card-big{padding:20px 18px;}
.pointage-day-label{
  text-align:center; font-family:var(--font-display); text-transform:uppercase; letter-spacing:.08em;
  font-size:20px; font-weight:700; color:var(--fg);
}
.pointage-time{font-size:28px; font-weight:700; font-family:var(--font-mono); text-align:center; margin-top:4px;}
.pointage-icons{display:flex; gap:7px; margin-top:8px;}
.pointage-icon-btn{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer;
  background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius); padding:10px 4px;
}
.pointage-icon-btn .pi-emoji{font-size:22px;line-height:1;}
.pointage-icon-btn .pi-label{font-size:9px; font-weight:700; font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.02em; color:var(--fg-muted); text-align:center; line-height:1.2;}
.pointage-icon-btn .pi-time{font-size:10px; font-family:var(--font-mono); font-weight:700; color:var(--accent-strong);}
.pointage-icon-btn.done{background:var(--accent-soft); border-color:var(--accent);}
.pointage-icon-btn.done .pi-label{color:var(--accent-strong);}
.field .punched-tag{font-size:10px; font-weight:700; color:var(--accent-strong); background:var(--accent-soft); border-radius:6px; padding:2px 6px; margin-left:6px;}

button.tap-confirm.armed{
  background:var(--warn); animation:pointage-pulse 1.1s ease-in-out infinite;
}
@keyframes pointage-pulse{
  0%,100%{ box-shadow:0 0 0 0 rgba(201,130,42,.35); }
  50%{ box-shadow:0 0 0 8px rgba(201,130,42,0); }
}

/* Timeline visuelle du jour (modal détail) */
.timeline-wrap{position:relative; padding-top:16px; padding-bottom:2px;}
.timeline-track{
  position:relative; height:12px; background:var(--surface-2); border:1px solid var(--border); border-radius:3px; overflow:hidden;
}
.timeline-seg{position:absolute; top:0; bottom:0; transition:opacity .2s ease;}
.timeline-seg.work{background:var(--accent);}
.timeline-seg.lunch{background:repeating-linear-gradient(45deg, var(--warn) 0 4px, transparent 4px 8px); opacity:.75;}
.timeline-seg.projected{opacity:.28;}
.timeline-seg.lunch.projected{opacity:.3;}
.timeline-label.projected{opacity:.55; font-style:italic;}
.timeline-wrap.big .timeline-track{height:18px; border-radius:4px;}
.timeline-wrap.big .timeline-label{font-size:11px;}
.timeline-wrap.big .timeline-labels.two-row{height:30px;}
.timeline-wrap.big .timeline-label.row-bottom{top:15px;}
.timeline-tick{position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--fg-muted); opacity:.6;}
.timeline-now{position:absolute; top:-5px; bottom:-5px; width:2px; background:var(--bad); z-index:2;}
.timeline-now::after{
  content:""; position:absolute; top:-3px; left:-2px; width:6px; height:6px; background:var(--bad); border-radius:50%;
}
.timeline-labels{position:relative; height:13px; margin-top:4px;}
.timeline-labels.two-row{height:26px;}
.timeline-label{
  position:absolute; top:0; transform:translateX(-50%); font-family:var(--font-mono); font-size:9px; font-weight:600;
  color:var(--fg-muted); white-space:nowrap;
}
.timeline-label.row-bottom{top:13px;}
.timeline-legend{display:flex; gap:14px; margin-top:8px; font-size:10px; color:var(--fg-muted); font-family:var(--font-mono);}
.timeline-legend span{display:inline-flex; align-items:center; gap:5px;}
.timeline-legend i{width:9px; height:9px; border-radius:2px; display:inline-block;}
.timeline-legend i.work{background:var(--accent);}
.timeline-legend i.lunch{background:repeating-linear-gradient(45deg, var(--warn) 0 3px, transparent 3px 6px);}
.timeline-legend i.projected{opacity:.3;}
.clock-row{display:flex; align-items:center; gap:8px;}
.info-btn{
  width:24px; height:24px; border-radius:50%; border:1px solid var(--border); background:var(--surface-2); color:var(--accent-strong);
  font-family:var(--font-mono); font-weight:700; font-size:13px; line-height:1; cursor:pointer; padding:0;
  display:flex; align-items:center; justify-content:center;
}
.about-version{
  font-family:var(--font-mono); font-size:11px; font-weight:700; color:var(--accent-strong);
  border:1px solid var(--border); border-radius:4px; padding:4px 8px; background:var(--surface-2); align-self:flex-start;
}
.gloss{display:flex; flex-direction:column; gap:10px; margin:0;}
.gloss div{border-left:2px solid var(--accent); padding-left:9px;}
.gloss dt{font-family:var(--font-mono); font-size:12px; font-weight:700; color:var(--fg); text-transform:uppercase; letter-spacing:.03em;}
.gloss dd{margin:2px 0 0; font-size:13px; line-height:1.45; color:var(--fg-muted);}
.about-text{font-size:13px; line-height:1.5; color:var(--fg-muted); margin:0;}
.about-text strong{color:var(--fg);}
</style>

<div class="app" id="app"></div>

<script>
/* === SAUVEGARDE ATELIER v2 — début (copie identique dans chaque app, source : /mnt/project-files/sauvegarde-drive) === */
/* Sauvegarde Drive commune aux apps d'atelier.
   - 💾 Sauvegarder : fichier .txt daté (App_AAAA-MM-JJ_HHhMM.txt) → menu Partager d'Android (Drive), sinon téléchargement.
     v2 (choix d'Adi 6b) : chaque fichier contient TOUT l'historique des sauvegardes de l'app (le dernier fichier suffit).
     Historique gardé dans le téléphone (<cle>-historique), une entrée par sauvegarde dont les données ont changé.
   - 📂 Importer : lit le .txt (v1 ou v2), aperçu, choix de la version à remettre (la plus récente par défaut), confirmation ;
     les données actuelles partent d'abord dans « Copies avant import » ; l'historique du fichier rejoint celui du téléphone.
   - Copies avant import : jamais effacées, on peut revenir à n'importe laquelle (ce retour fait lui-même une copie).
   - Rappel : bandeau si aucune sauvegarde depuis 7 jours et que les données ont changé depuis.
   Usage :
     Sauvegarde.init({ app:"PorteOutils", nom:"Porte-outils", cle:"porteoutils-cnc-v1", version:"1.1",
       lire:() => donnees, ecrire:d => {...}, resume:d => "12 porte-outils…", valider:d => null|"erreur", vide:d => true|false });
     Sauvegarde.panneau(element)   // carte avec boutons, aperçu d'import, copies
     Sauvegarde.bandeau()          // HTML du rappel ("" si pas besoin)
     Sauvegarde.copieAvant(raison) // à appeler avant tout autre remplacement des données (ex. import Excel) ; false = échec
*/
const Sauvegarde = (() => {
  const MARQUE = "---- DONNÉES (ne pas modifier sous cette ligne) ----";
  let C = null;
  const p2 = n => String(n).padStart(2, "0");
  const ech = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const dateFr = d => `${p2(d.getDate())}.${p2(d.getMonth()+1)}.${d.getFullYear()} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
  const empreinte = s => { let h = 2166136261; for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); };
  const kEtat = () => C.cle + "-sauvegarde", kCopies = () => C.cle + "-copies", kHist = () => C.cle + "-historique";
  const lireLS = (k, def) => { try{ const v = JSON.parse(localStorage.getItem(k)); return v ?? def; }catch(e){ return def; } };
  const ecrireLS = (k, v) => { try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } };
  const etat = () => lireLS(kEtat(), {derniere:null, empreinte:null});
  const copies = () => lireLS(kCopies(), []);
  const historique = () => lireLS(kHist(), []);
  // réunit deux historiques (clé = date), trié du plus ancien au plus récent
  function fusion(a, b){ const m = new Map(); [...a, ...b].forEach(h => h && h.date && h.donnees && m.set(h.date, h)); return [...m.values()].sort((x, y) => x.date.localeCompare(y.date)); }
  const actuel = () => JSON.stringify(C.lire());
  let msgT;
  function message(t, erreur){
    let m = document.getElementById("sv-msg");
    if(!m){ m = document.createElement("div"); m.id = "sv-msg"; m.className = "sv-msg"; m.setAttribute("role","status"); document.body.appendChild(m); }
    m.textContent = t; m.classList.toggle("sv-err", !!erreur); m.classList.add("on"); clearTimeout(msgT); msgT = setTimeout(() => m.classList.remove("on"), 3200);
  }

  function init(cfg){ C = Object.assign({version:"", resume:() => "", valider:() => null, vide:() => false}, cfg); style(); }

  function nomFichier(d){ return `${C.app}_${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}_${p2(d.getHours())}h${p2(d.getMinutes())}.txt`; }
  function contenu(d, donnees, hist){
    const env = {format:"sauvegarde-atelier", formatVersion:2, app:C.app, nom:C.nom, appVersion:C.version, date:d.toISOString(), donnees, historique:hist};
    return ["SAUVEGARDE ATELIER", `App : ${C.nom}${C.version ? " v" + C.version : ""}`, `Date : ${dateFr(d)}`,
      `Contenu : ${C.resume(donnees)}`, `Historique : ${hist.length} sauvegarde(s), toutes dans ce fichier (le plus récent fichier suffit) :`,
      ...hist.slice().reverse().map(h => `  ${dateFr(new Date(h.date))}  ${h.resume}`),
      "Pour remettre ces données : dans l'app, bouton 📂 Importer.", "", MARQUE, JSON.stringify(env)].join("\n");
  }

  async function sauvegarder(){
    const d = new Date(), donnees = C.lire(), nom = nomFichier(d);
    let hist = historique();
    const der = hist[hist.length - 1];
    if(!der || empreinte(JSON.stringify(der.donnees)) !== empreinte(JSON.stringify(donnees))) hist = fusion(hist, [{date:d.toISOString(), resume:C.resume(donnees), donnees}]);
    const txt = contenu(d, donnees, hist);
    const fichier = new File([txt], nom, {type:"text/plain"});
    let fait = false;
    if(navigator.canShare && navigator.share){
      let ok = false; try{ ok = navigator.canShare({files:[fichier]}); }catch(e){}
      if(ok){
        try{ await navigator.share({files:[fichier], title:nom}); fait = true; message("Sauvegarde envoyée : " + nom); }
        catch(e){ if(e && e.name === "AbortError"){ message("Sauvegarde annulée"); return false; } }
      }
    }
    if(!fait){
      const a = document.createElement("a"); a.href = URL.createObjectURL(fichier); a.download = nom;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      fait = true; message("Fichier enregistré dans Téléchargements : " + nom);
    }
    ecrireLS(kEtat(), {derniere:d.toISOString(), empreinte:empreinte(JSON.stringify(donnees))});
    if(!ecrireLS(kHist(), hist)) message("Fichier envoyé, mais mémoire du téléphone pleine : l'historique n'a pas pu y être gardé.", true);
    return true;
  }

  async function lireFichier(f){
    const t = await f.text();
    const i = t.indexOf(MARQUE);
    let env;
    try{ env = JSON.parse(i >= 0 ? t.slice(i + MARQUE.length) : t); }catch(e){ throw new Error("ce n'est pas une sauvegarde lisible"); }
    if(!env || env.format !== "sauvegarde-atelier" || !env.donnees) throw new Error("ce n'est pas une sauvegarde d'atelier");
    if(env.app !== C.app) throw new Error(`c'est une sauvegarde de « ${env.nom || env.app} », pas de « ${C.nom} »`);
    const err = C.valider(env.donnees); if(err) throw new Error(err);
    const r = C.resume;
    env.versions = fusion(Array.isArray(env.historique) ? env.historique : [], [{date:env.date, resume:r(env.donnees), donnees:env.donnees}])
      .filter(h => !C.valider(h.donnees)).reverse(); // plus récente d'abord
    return env;
  }

  function copieAvant(raison){
    const l = copies();
    l.unshift({date:new Date().toISOString(), raison, resume:C.resume(C.lire()), donnees:C.lire()});
    return ecrireLS(kCopies(), l);
  }
  function remplacer(donnees, raison){
    if(!copieAvant(raison)){ message("Mémoire du téléphone pleine : copie impossible, rien n'a été remplacé. Sauvegarde d'abord sur Drive.", true); return false; }
    C.ecrire(donnees); return true;
  }

  function bandeau(){
    if(!C) return "";
    const e = etat(), donnees = actuel();
    if(C.vide(C.lire())) return "";
    const jours = e.derniere ? Math.floor((Date.now() - new Date(e.derniere).getTime()) / 864e5) : null;
    if(jours !== null && (jours < 7 || e.empreinte === empreinte(donnees))) return "";
    return `<div class="sv-bandeau"><span>${ic("cloud-arrow-up")} ${jours === null ? "Jamais sauvegardé sur Drive." : `Pas de sauvegarde depuis ${jours} jours.`} Tes données ne sont que dans ce téléphone.</span><button type="button" class="sv-btn sv-save" onclick="Sauvegarde.sauvegarder().then(ok=>ok&&this.closest('.sv-bandeau').remove())">${ic("cloud-arrow-up")} Sauvegarder</button></div>`;
  }

  function panneau(el){
    const e = etat(), l = copies(), d = e.derniere ? new Date(e.derniere) : null;
    const change = d && e.empreinte !== empreinte(actuel());
    el.innerHTML = `<div class="sv-carte">
      <div class="sv-titre">${ic("cloud-arrow-up")} Sauvegarde Drive</div>
      <div class="sv-info">Dernière sauvegarde : <b>${d ? dateFr(d) : "jamais"}</b>${change ? " · modifié depuis" : ""}</div>
      <div class="sv-btns"><button type="button" class="sv-btn sv-save" data-sv="save">${ic("cloud-arrow-up")} Sauvegarder</button>
        <label class="sv-btn sv-imp">${ic("folder-open")} Importer<input type="file" accept=".txt,.json,text/plain,application/json" hidden></label></div>
      <div class="sv-aide">Choisis Drive dans le menu Partager, dossier <b>Sauvegardes atelier</b>. Chaque fichier contient tout l'historique (${historique().length} sauvegarde(s)) : le plus récent suffit.</div>
      <div class="sv-apercu" hidden></div>
      <details class="sv-copies"><summary>Copies avant import (${l.length})</summary>
        ${l.length ? l.map((c, i) => `<div class="sv-copie"><div><b>${dateFr(new Date(c.date))}</b> · ${ech(c.raison)}<br><small>${ech(c.resume)}</small></div><button type="button" class="sv-btn" data-sv="rev" data-i="${i}">Revenir</button></div>`).join("")
          : `<div class="sv-aide">Aucune pour l'instant. Avant chaque import, tes données actuelles sont gardées ici, jamais effacées.</div>`}
      </details></div>`;
    const ap = el.querySelector(".sv-apercu"), inp = el.querySelector("input[type=file]");
    el.querySelector('[data-sv="save"]').onclick = () => sauvegarder().then(() => panneau(el));
    inp.onchange = async () => {
      const f = inp.files[0]; if(!f) return;
      let env;
      try{ env = await lireFichier(f); }catch(err){ inp.value = ""; message("Import impossible : " + err.message, true); return; }
      ap.hidden = false;
      const v = env.versions;
      ap.innerHTML = `<div><b>${ech(f.name)}</b></div>
        <div>Sauvegarde du <b>${dateFr(new Date(env.date))}</b>${env.appVersion ? ` (v${ech(env.appVersion)})` : ""} · ${v.length} version(s) dans le fichier</div>
        <label class="sv-aide">Version à remettre
          <select class="sv-choix">${v.map((h, i) => `<option value="${i}">${dateFr(new Date(h.date))} · ${ech(h.resume)}${i ? "" : " (la plus récente)"}</option>`).join("")}</select></label>
        <div>Actuellement : ${ech(C.resume(C.lire()))}</div>
        <div class="sv-aide">Tes données actuelles seront d'abord gardées dans « Copies avant import ».</div>
        <div class="sv-btns"><button type="button" class="sv-btn sv-ok" data-sv="ok">Remplacer mes données</button><button type="button" class="sv-btn" data-sv="no">Annuler</button></div>`;
      ap.querySelector('[data-sv="no"]').onclick = () => { inp.value = ""; ap.hidden = true; };
      ap.querySelector('[data-sv="ok"]').onclick = () => {
        const h = v[+ap.querySelector(".sv-choix").value] || v[0];
        if(remplacer(h.donnees, `import ${f.name} (version du ${dateFr(new Date(h.date))})`)){
          ecrireLS(kHist(), fusion(historique(), v));
          message("Données importées"); panneau(el);
        }
      };
    };
    el.querySelectorAll('[data-sv="rev"]').forEach(b => b.onclick = () => {
      const c = copies()[+b.dataset.i];
      if(!c || !confirm(`Revenir aux données du ${dateFr(new Date(c.date))} ?\n(${c.resume})\nTes données actuelles seront gardées comme nouvelle copie.`)) return;
      if(remplacer(c.donnees, "retour à la copie du " + dateFr(new Date(c.date)))){ message("Données remises"); panneau(el); }
    });
  }

  function style(){
    if(document.getElementById("sv-style")) return;
    const s = document.createElement("style"); s.id = "sv-style";
    s.textContent = `
.sv-carte{border:2px solid #1f8a5b;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--surface,transparent)}
.sv-titre{font-weight:700;font-size:18px}
.sv-info,.sv-aide{font-size:14px;opacity:.85}
.sv-btns{display:flex;gap:12px;flex-wrap:wrap}
.sv-btn{flex:1 1 140px;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 16px;border-radius:10px;
  border:1px solid #1f8a5b;background:transparent;color:inherit;font:inherit;font-weight:700;cursor:pointer}
.sv-btn.sv-save{background:linear-gradient(135deg,#1f8a5b,#2a9d8f);border-color:transparent;color:#fff}
.sv-btn.sv-imp{color:#1f8a5b}
.sv-btn.sv-ok{background:#c0392b;border-color:#c0392b;color:#fff}
.sv-apercu{border:2px solid #c0392b;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.sv-choix{display:block;width:100%;margin-top:4px;min-height:48px;font:inherit}
.sv-copies summary{cursor:pointer;font-weight:600;padding:6px 0}
.sv-copie{display:flex;gap:12px;align-items:center;justify-content:space-between;border-top:1px solid rgba(127,127,127,.3);padding:8px 0}
.sv-copie .sv-btn{flex:0 0 auto;min-height:44px}
.sv-bandeau{border:2px solid #1f8a5b;border-radius:10px;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.sv-bandeau span{flex:1 1 200px}
.sv-bandeau .sv-btn{flex:0 0 auto}
.sv-msg{position:fixed;left:16px;right:16px;bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:50;background:#1f8a5b;color:#fff;border-radius:10px;
  padding:14px 16px;font-weight:600;text-align:center;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
.sv-msg.on{opacity:1;transform:none}
.sv-msg.sv-err{background:#c0392b}
@media (prefers-color-scheme:dark){.sv-btn.sv-imp{color:#5cd69a}}`;
    document.head.appendChild(s);
  }

  return {init, historique, sauvegarder, panneau, bandeau, copieAvant, remplacer, lireFichier, nomFichier};
})();
/* === SAUVEGARDE ATELIER v2 — fin === */
</script>
<script>
(function(){
"use strict";

// ---------- Schedule reference (minutes) ----------
var DEFAULT_SETTINGS = {
  // Mon-Thu
  weekday: { arrival:"07:00", lunchStart:"12:00", lunchEnd:"12:45", departure:"16:45", defaultDeparture:"16:15", refMin: 8*60+30 },
  // Friday
  friday:  { arrival:"07:00", lunchStart:"12:00", lunchEnd:"12:45", departure:"14:35", defaultDeparture:"14:35", refMin: 6*60+50 }
};
var WEEK_TARGET_MIN = 40*60+50;
var DAYS = ["lundi","mardi","mercredi","jeudi","vendredi"];
var DAY_LABELS = {lundi:"Lundi", mardi:"Mardi", mercredi:"Mercredi", jeudi:"Jeudi", vendredi:"Vendredi"};
var DAY_SHORT = {lundi:"Lun", mardi:"Mar", mercredi:"Mer", jeudi:"Jeu", vendredi:"Ven"};

// ---------- Storage ----------
var STORE_KEY = "planning-horaire-v3";
function loadStore(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {
    settings: DEFAULT_SETTINGS,
    currentWeek: {}, // { lundi: {arrival,lunchStart,lunchEnd,departure}, ... }
    pot: { totalMin: 60, spreadWeeks: 0 }, // pot d'heures sup/insup ; spreadWeeks=0 = pas étalé, reste en réserve
    reportMode: "vendredi", // "vendredi" | "repartir"
    history: [] // semaines clôturées, de la plus ancienne à la plus récente
  };
}
function saveStore(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}

var state = loadStore();
if(!Array.isArray(state.history)) state.history = [];
var currentTab = "semaine";
var modalDay = null;
var APP_VERSION = "1.4";
var APP_DATE = "22.10.2026";
var aboutOpen = false;
var closeWeekOpen = false; // fenêtre de récap avant clôture
var showAllHistory = false;
var modalEdited = false; // true dès que l'utilisateur modifie un champ pendant que la fiche jour est ouverte

// ---------- Time helpers ----------
function toMin(hhmm){
  if(!hhmm) return null;
  var p = hhmm.split(":"); return (+p[0])*60 + (+p[1]);
}
function toHHMM(min){
  min = Math.round(min);
  var neg = min<0; min = Math.abs(min);
  var h = Math.floor(min/60), m = min%60;
  return (neg?"-":"")+h+"h"+(m<10?"0":"")+m;
}
function toClock(min){
  min = Math.round(min);
  min = ((min%1440)+1440)%1440;
  var h = Math.floor(min/60), m = min%60;
  return (h<10?"0":"")+h+":"+(m<10?"0":"")+m;
}

function isoWeekNumber(){
  var d = new Date();
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() + 3 - ((d.getDay()+6)%7));
  var week1 = new Date(d.getFullYear(),0,4);
  return 1 + Math.round(((d-week1)/86400000 - 3 + ((week1.getDay()+6)%7))/7);
}

function dayRef(day){ return day==="vendredi" ? state.settings.friday : state.settings.weekday; }

function ensureDayDefaults(day){
  var ref = dayRef(day);
  if(!state.currentWeek[day]) state.currentWeek[day] = {};
  var d = state.currentWeek[day];
  var changed = false;
  if(!d.arrival){ d.arrival = ref.arrival; changed = true; }
  if(!d.lunchStart){ d.lunchStart = ref.lunchStart; changed = true; }
  if(!d.lunchEnd){ d.lunchEnd = ref.lunchEnd; changed = true; }
  if(!d.departure){ d.departure = ref.defaultDeparture || ref.departure || ""; changed = true; }
  if(d.skipMorningBreak===undefined){ d.skipMorningBreak = false; changed = true; }
  if(d.skipAfternoonBreak===undefined){ d.skipAfternoonBreak = false; changed = true; }
  if(!d.punched){ d.punched = {}; changed = true; }
  if(changed) saveStore();
}
DAYS.forEach(ensureDayDefaults);

// ---------- Pointage (horodatage en un clic) ----------
var FIELD_ORDER = ["arrival","lunchStart","lunchEnd","departure"];
var FIELD_LABELS = {arrival:"Arrivée", lunchStart:"Pause midi", lunchEnd:"Reprise", departure:"Départ"};
var FIELD_EMOJI = {arrival:ic("sign-in"), lunchStart:ic("fork-knife"), lunchEnd:ic("coffee"), departure:ic("sign-out")};
var pointageOpen = false;
var pointagePending = null; // { day, field, time }
var pointageChooserOpen = false;

function todayKey(){
  var jsDay = new Date().getDay(); // 0=Dim ... 6=Sam
  var map = {1:"lundi",2:"mardi",3:"mercredi",4:"jeudi",5:"vendredi"};
  return map[jsDay] || null;
}
function nowHHMM(){
  var now = new Date();
  var hh = (now.getHours()<10?"0":"")+now.getHours();
  var mm = (now.getMinutes()<10?"0":"")+now.getMinutes();
  return hh+":"+mm;
}
function nextPunchField(day){
  var d = state.currentWeek[day] || {};
  var p = d.punched || {};
  for(var i=0;i<FIELD_ORDER.length;i++){
    if(!p[FIELD_ORDER[i]]) return FIELD_ORDER[i];
  }
  return null;
}
function openPointage(field){
  if(pointageOpen) return;
  var day = todayKey();
  if(!day) return;
  if(!field) field = nextPunchField(day);
  if(!field) return;
  pointagePending = { day: day, field: field, time: nowHHMM() };
  pointageOpen = true;
  render();
}
function confirmPointage(){
  var p = pointagePending;
  if(!p || !p.field){ pointageOpen = false; pointagePending = null; render(); return; }
  if(!state.currentWeek[p.day]) state.currentWeek[p.day] = {};
  var d = state.currentWeek[p.day];
  d[p.field] = p.time;
  if(!d.punched) d.punched = {};
  d.punched[p.field] = true;
  if(p.field === "departure") d.touched = true;
  saveStore();
  pointageOpen = false;
  pointagePending = null;
  render();
}
function closePointage(){
  pointageOpen = false;
  pointagePending = null;
  render();
}

function resetDay(day){
  state.currentWeek[day] = {};
  ensureDayDefaults(day);
  saveStore();
  render();
}

function dayWorkedMin(day){
  var d = state.currentWeek[day];
  if(!d || !d.arrival || !d.lunchStart || !d.lunchEnd || !d.departure) return null;
  var a=toMin(d.arrival), ls=toMin(d.lunchStart), le=toMin(d.lunchEnd), dep=toMin(d.departure);
  var worked = (ls-a) + (dep-le);
  if(d.skipMorningBreak) worked += 15;
  if(day!=="vendredi" && d.skipAfternoonBreak) worked += 15;
  return worked;
}
function dayEcartMin(day){
  var w = dayWorkedMin(day);
  if(w===null) return null;
  return w - dayRef(day).refMin;
}
function isDayFilled(day){
  var d = state.currentWeek[day];
  return !!(d && d.arrival && d.lunchStart && d.lunchEnd && d.departure);
}
function isDayTouched(day){
  var d = state.currentWeek[day];
  return !!(d && d.touched);
}
function remainingUntouchedDays(){
  return DAYS.filter(function(d){ return !isDayTouched(d); });
}

function carriedBalance(){
  // part du pot appliquée à la semaine en cours
  if(state.pot.spreadWeeks > 0) return state.pot.totalMin / state.pot.spreadWeeks;
  return 0;
}
// Ce que la clôture va faire, calculé sans rien modifier (sert au récap ET à la clôture)
function closeWeekSummary(){
  var applied = carriedBalance(); // part du pot consommée cette semaine
  var weekEcart = touchedEcartSum(); // ce que tu as réellement fait, en plus ou en moins
  var potBefore = state.pot.totalMin || 0;
  return {
    applied: applied,
    weekEcart: weekEcart,
    potBefore: potBefore,
    potAfter: Math.round(potBefore - applied + weekEcart),
    validated: DAYS.filter(isDayTouched),
    pending: remainingUntouchedDays()
  };
}
function closeWeekAndStart(){
  var s = closeWeekSummary();
  var days = {};
  s.validated.forEach(function(day){
    var d = state.currentWeek[day];
    days[day] = { arrival:d.arrival, lunchStart:d.lunchStart, lunchEnd:d.lunchEnd, departure:d.departure,
      skipMorningBreak:!!d.skipMorningBreak, skipAfternoonBreak:!!d.skipAfternoonBreak, ecartMin:dayEcartMin(day) };
  });
  state.history.push({
    closedAt: new Date().toISOString(), week: isoWeekNumber(), days: days,
    weekEcartMin: Math.round(s.weekEcart), potAppliedMin: Math.round(s.applied),
    potBeforeMin: s.potBefore, potAfterMin: s.potAfter, spreadWeeks: state.pot.spreadWeeks
  });
  state.pot.totalMin = s.potAfter;
  if(state.pot.spreadWeeks > 0) state.pot.spreadWeeks = Math.max(0, state.pot.spreadWeeks - 1);
  state.currentWeek = {};
  DAYS.forEach(ensureDayDefaults);
  saveStore();
  closeWeekOpen = false;
  render();
}
function touchedEcartSum(){
  var sum = 0;
  DAYS.forEach(function(day){ if(isDayTouched(day)){ var e = dayEcartMin(day); if(e!==null) sum += e; } });
  return sum;
}
function cumulativeBalance(){
  return carriedBalance() + touchedEcartSum();
}

// Estimated departure for a day not yet touched, given the current report mode
function dayProjection(day){
  var ref = dayRef(day);
  var base = carriedBalance() + touchedEcartSum();
  var remaining = remainingUntouchedDays();
  if(remaining.length===0) remaining = [day];
  var target;
  if(state.reportMode === "vendredi"){
    if(day === "vendredi") target = ref.refMin - base;
    else target = ref.refMin;
  } else {
    var perDay = base / remaining.length;
    target = ref.refMin - perDay;
  }
  var arrivalMin = toMin(ref.arrival);
  var lunchEnd = toMin(ref.lunchEnd);
  var morningWorked = toMin(ref.lunchStart) - arrivalMin;
  var departureMin;
  if(target <= morningWorked){
    // Pas besoin d'aller jusqu'à midi : on saute la pause déjeuner, on part direct dans la matinée.
    departureMin = arrivalMin + Math.max(target, 0);
  } else {
    departureMin = lunchEnd + (target - morningWorked);
  }
  return { departure: toClock(departureMin), targetMin: target, skipsLunch: target <= morningWorked };
}

// ---------- Rendering ----------
function el(tag, cls, html){
  var e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html!==undefined) e.innerHTML = html;
  return e;
}

var PAGE_COUNT = 3; // 0 = Pointage, 1 = Semaine, 2 = Report
var currentPage = 1; // on démarre sur la semaine

function goToPage(n){
  currentPage = ((n%PAGE_COUNT)+PAGE_COUNT)%PAGE_COUNT;
  render();
}
function nextPage(){ goToPage(currentPage+1); }
function prevPage(){ goToPage(currentPage-1); }

function attachSwipe(viewportEl){
  var startX=0, startY=0, tracking=false;
  viewportEl.addEventListener("pointerdown", function(e){ startX=e.clientX; startY=e.clientY; tracking=true; });
  viewportEl.addEventListener("pointerup", function(e){
    if(!tracking) return;
    tracking = false;
    var dx = e.clientX-startX, dy = e.clientY-startY;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)*1.3){
      if(dx<0) nextPage(); else prevPage();
    }
  });
}

function render(){
  var app = document.getElementById("app");
  app.innerHTML = "";
  var oldDots = document.querySelector(".page-dots");
  if(oldDots) oldDots.remove();

  var header = el("header","top");
  var titleWrap = el("div","title");
  titleWrap.innerHTML =
    '<svg class="logo" width="26" height="26" viewBox="0 0 26 26" fill="none">'+
      '<circle cx="13" cy="13" r="10.5" stroke="var(--accent)" stroke-width="2"/>'+
      '<path d="M13 7v6l4.2 2.4" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'+
      '<circle cx="13" cy="13" r="1.4" fill="var(--accent)"/>'+
    '</svg>'+
    '<h1>Planning<small>Horaire · suivi des heures</small></h1>';
  header.appendChild(titleWrap);
  var headerRight = el("div","header-right");
  headerRight.appendChild(el("div","weeklabel","S."+isoWeekNumber()));
  var clockRow = el("div","clock-row");
  clockRow.appendChild(el("div","clockbadge",nowHHMM()));
  var infoBtn = el("button","info-btn","i");
  infoBtn.setAttribute("aria-label","À propos");
  infoBtn.onclick = function(){ aboutOpen = true; render(); };
  clockRow.appendChild(infoBtn);
  headerRight.appendChild(clockRow);
  header.appendChild(headerRight);
  app.appendChild(header);

  var viewport = el("div","pager-viewport");
  var track = el("div","pager-track pager-track-3");
  track.style.transform = "translateX(-"+(currentPage*100/PAGE_COUNT)+"%)";

  var page0 = el("div","pager-page");
  renderPointagePage(page0);
  renderCloseWeekCard(page0);

  var page1 = el("div","pager-page");
  var rappel = Sauvegarde.bandeau();
  if(rappel) page1.appendChild(el("div", null, rappel));
  renderSemaine(page1);

  var page2 = el("div","pager-page");
  renderTopRow(page2);
  renderWeekStatRow(page2);
  page2.appendChild(el("div","section-title","Report des heures"));
  renderReport(page2);
  page2.appendChild(el("div","section-title","Historique des semaines"));
  renderHistory(page2);
  var svPanel = el("div");
  Sauvegarde.panneau(svPanel);
  page2.appendChild(svPanel);
  var foot = el("footer","note","Données sur ton téléphone, copie de sécurité sur Drive · v"+APP_VERSION);
  page2.appendChild(foot);

  track.appendChild(page0);
  track.appendChild(page1);
  track.appendChild(page2);
  viewport.appendChild(track);
  app.appendChild(viewport);
  attachSwipe(viewport);

  if(!modalDay && !pointageOpen && !pointageChooserOpen && !aboutOpen && !closeWeekOpen){
    var dots = el("div","page-dots");
    for(var i=0;i<PAGE_COUNT;i++){
      (function(i){
        var dot = el("div","page-dot"+(currentPage===i?" active":""));
        dot.onclick = function(){ goToPage(i); };
        dots.appendChild(dot);
      })(i);
    }
    document.body.appendChild(dots);
  }

  if(modalDay) renderDayModal();
  if(pointageChooserOpen) renderPointageChooser();
  if(pointageOpen) renderPointageConfirm();
  if(aboutOpen) renderAbout();
  if(closeWeekOpen) renderCloseWeekConfirm();
}

function renderPointagePage(app){
  var day = todayKey();
  app.appendChild(el("div","section-title","Pointage"));

  var card = el("div","card pointage-card pointage-card-big");
  if(!day){
    card.innerHTML = '<div style="text-align:center;font-size:13px;color:var(--fg-muted);padding:20px 0;">Pas de pointage le week-end 😴</div>';
    app.appendChild(card);
    return;
  }
  var d = state.currentWeek[day] || {};
  var punched = d.punched || {};
  var allDone = FIELD_ORDER.every(function(k){ return !!punched[k]; });

  card.appendChild(el("div","pointage-day-label",DAY_LABELS[day]));

  if(allDone){
    var doneMsg = el("div", null, ic("check-circle")+" "+DAY_LABELS[day]+" complet");
    doneMsg.style.cssText = "font-size:15px;color:var(--good);font-weight:700;text-align:center;margin:10px 0;";
    card.appendChild(doneMsg);
  } else {
    var doneCount = FIELD_ORDER.filter(function(k){ return !!punched[k]; }).length;
    var btn = el("button","primary pointage-big-btn",ic("clock")+" Pointer ("+doneCount+"/4)");
    btn.style.marginTop = "10px";
    btn.onclick = function(){ pointageChooserOpen = true; render(); };
    card.appendChild(btn);
  }

  card.appendChild(buildDayTimeline(day, {big:true}));
  app.appendChild(card);
}

function renderPointageChooser(){
  var day = todayKey();
  var backdrop = el("div","modal-backdrop");
  backdrop.onclick = function(e){ if(e.target===backdrop){ pointageChooserOpen = false; render(); } };

  var sheet = el("div","modal-sheet");
  var head = el("div","modal-header");
  head.appendChild(el("h3", null, "Pointage · "+DAY_LABELS[day]));
  var closeBtn = el("button","modal-close",ic("x"));
  closeBtn.onclick = function(){ pointageChooserOpen = false; render(); };
  head.appendChild(closeBtn);
  sheet.appendChild(head);

  var hint = el("div", null, "Choisis l'horaire à pointer :");

// Bouton à confirmer par un second tap (il passe en orange, puis revient au bout de 2,2 s)
function doubleTapButton(label, onConfirm){
  var btn = el("button", "primary tap-confirm", label);
  var armed = false, armedAt = 0, armTimer = null;
  btn.onclick = function(ev){
    if(ev){ ev.preventDefault(); ev.stopPropagation(); }
    var now = Date.now();
    if(armed){
      if(now - armedAt < 150) return; // filtre un double-évènement du même tap (touch+click)
      clearTimeout(armTimer);
      armed = false;
      onConfirm();
    } else {
      armed = true;
      armedAt = now;
      btn.classList.add("armed");
      btn.innerHTML = ic("hand-tap")+" Encore un tap pour confirmer";
      armTimer = setTimeout(function(){
        armed = false;
        btn.classList.remove("armed");
        btn.innerHTML = label;
      }, 2200);
    }
  };
  return btn;
}

function buildDayTimeline(day, opts){
  opts = opts || {};
  var d = state.currentWeek[day] || {};
  var p = d.punched || {};
  var winStart = toMin("06:45"), winEnd = toMin("17:15");
  var total = winEnd - winStart;
  function pct(min){ return Math.max(0, Math.min(100, ((min-winStart)/total)*100)); }

  var wrap = el("div","timeline-wrap"+(opts.big?" big":""));
  var track = el("div","timeline-track");

  var a = toMin(d.arrival), ls = toMin(d.lunchStart), le = toMin(d.lunchEnd);
  // Tant que le départ n'est pas pointé, on affiche l'heure calculée (mode de report + pot), pas une valeur figée.
  var dep = p.departure ? toMin(d.departure) : toMin(dayProjection(day).departure);

  if(a!=null && ls!=null && ls>a){
    var seg1 = el("div","timeline-seg work"+((p.arrival&&p.lunchStart)?"":" projected"));
    seg1.style.left = pct(a)+"%"; seg1.style.width = (pct(ls)-pct(a))+"%";
    track.appendChild(seg1);
  }
  if(ls!=null && le!=null && le>ls){
    var seg2 = el("div","timeline-seg lunch"+((p.lunchStart&&p.lunchEnd)?"":" projected"));
    seg2.style.left = pct(ls)+"%"; seg2.style.width = (pct(le)-pct(ls))+"%";
    track.appendChild(seg2);
  }
  if(le!=null && dep!=null && dep>le){
    var seg3 = el("div","timeline-seg work"+((p.lunchEnd&&p.departure)?"":" projected"));
    seg3.style.left = pct(le)+"%"; seg3.style.width = (pct(dep)-pct(le))+"%";
    track.appendChild(seg3);
  }
  if(!d.skipMorningBreak){
    var mb = toMin("09:30");
    if(a!=null && ls!=null && mb>a && mb<ls){
      var tick1 = el("div","timeline-tick"); tick1.style.left = pct(mb)+"%"; tick1.title = "Pause 9h30–9h45 (offerte)";
      track.appendChild(tick1);
    }
  }
  if(day!=="vendredi" && !d.skipAfternoonBreak){
    var ab = toMin("15:30");
    if(le!=null && dep!=null && ab>le && ab<dep){
      var tick2 = el("div","timeline-tick"); tick2.style.left = pct(ab)+"%"; tick2.title = "Pause 15h30–15h45 (offerte)";
      track.appendChild(tick2);
    }
  }
  if(todayKey()===day){
    var now = toMin(nowHHMM());
    if(now>=winStart && now<=winEnd){
      var nowMark = el("div","timeline-now"); nowMark.style.left = pct(now)+"%"; nowMark.title = "Maintenant";
      track.appendChild(nowMark);
    }
  }
  wrap.appendChild(track);

  var labels = el("div","timeline-labels");
  [[a,"arrival"],[dep,"departure"]].forEach(function(pair){
    if(pair[0]==null) return;
    var lab = el("div","timeline-label"+(p[pair[1]]?"":" projected"), toClock(pair[0]));
    lab.style.left = pct(pair[0])+"%";
    labels.appendChild(lab);
  });
  wrap.appendChild(labels);

  if(opts.legend!==false){
    var legend = el("div","timeline-legend",
      '<span><i class="work"></i>Travail confirmé</span><span><i class="work projected"></i>Prévu</span><span><i class="lunch"></i>Pause midi</span>'
    );
    wrap.appendChild(legend);
  }

  return wrap;
}

  var cancel = function(){ closeWeekOpen = false; render(); };
  backdrop.onclick = function(e){ if(e.target===backdrop) cancel(); };

  var sheet = el("div","modal-sheet");
  var head = el("div","modal-header");
  head.appendChild(el("h3", null, "Clôturer la semaine S."+isoWeekNumber()));
  var closeBtn = el("button","modal-close",ic("x"));
  closeBtn.onclick = cancel;
  head.appendChild(closeBtn);
  sheet.appendChild(head);

  if(s.pending.length){
    var warn = el("div","tip");
    warn.style.borderColor = "var(--warn)";
    warn.innerHTML = '<span class="ic">'+ic("warning")+'</span><span><strong>'+s.pending.length+' jour(s) pas validé(s)</strong> ('+s.pending.map(function(d){ return DAY_SHORT[d]; }).join(", ")+') : ils ne comptent pas dans l’écart et ne seront pas gardés dans l’historique.</span>';
    sheet.appendChild(warn);
  }

  var rows = el("div","card");
  rows.style.padding = "4px 14px";
  [["Jours validés", s.validated.length+" / 5", "var(--fg)"],
   ["Écart de la semaine", signed(s.weekEcart), signColor(s.weekEcart)],
   ["Part du pot appliquée", signed(s.applied), signColor(s.applied)]].forEach(function(r){
    var f = el("div","field");
    f.innerHTML = '<span style="font-size:13px;font-weight:600;">'+r[0]+'</span><span style="font-family:var(--font-mono);font-weight:700;font-size:16px;color:'+r[2]+';">'+r[1]+'</span>';
    rows.appendChild(f);
  });
  sheet.appendChild(rows);

  var pot = el("div","daysummary");
  pot.innerHTML =
    '<div><div class="ds-label">'+ic("piggy-bank")+' Pot avant</div><div class="ds-value" style="color:'+signColor(s.potBefore)+'">'+signed(s.potBefore)+'</div></div>'+
    '<div style="font-size:20px;color:var(--fg-muted);">→</div>'+
    '<div style="text-align:right;"><div class="ds-label">Pot après</div><div class="ds-value" style="color:'+signColor(s.potAfter)+'">'+signed(s.potAfter)+'</div></div>';
  sheet.appendChild(pot);

  var info = el("div","tip");
  info.innerHTML = '<span class="ic">ℹ️</span><span>La semaine part dans l’historique (page Report) et une nouvelle semaine vierge démarre.'+(state.pot.spreadWeeks>0?' Étalement du pot : '+state.pot.spreadWeeks+' → '+Math.max(0,state.pot.spreadWeeks-1)+' semaine(s).':'')+'</span>';
  sheet.appendChild(info);

  sheet.appendChild(doubleTapButton(ic("calendar-check")+" Clôturer la semaine", closeWeekAndStart));
  var cancelBtn = el("button","ghost","Annuler");
  cancelBtn.style.marginTop = "4px";
  cancelBtn.onclick = cancel;
  sheet.appendChild(cancelBtn);

  backdrop.appendChild(sheet);
  document.getElementById("app").appendChild(backdrop);
}

function renderHistory(app){
  var card = el("div","card");
  var list = state.history.slice().reverse(); // plus récente d'abord
  if(!list.length){
    card.appendChild(el("div","about-text","Aucune semaine clôturée pour l’instant. Chaque clôture viendra se ranger ici."));
    app.appendChild(card);
    return;
  }
  var shown = showAllHistory ? list : list.slice(0, 8);
  shown.forEach(function(h){
    var row = el("div","week-item");
    var nDays = Object.keys(h.days||{}).length;
    row.innerHTML =
      '<div class="wi-label">S.'+h.week+' <span style="font-weight:400;color:var(--fg-muted);font-size:12px;">· clôturée le '+dateCH(h.closedAt)+' · '+nDays+' j</span>'+
        '<div style="font-weight:400;color:var(--fg-muted);font-size:12px;font-family:var(--font-mono);">pot '+signed(h.potBeforeMin)+' → '+signed(h.potAfterMin)+'</div></div>'+
      '<div class="wi-value '+(h.weekEcartMin>0?"pos":h.weekEcartMin<0?"neg":"")+'">'+signed(h.weekEcartMin)+'</div>';
    card.appendChild(row);
  });
  if(list.length > 8){
    var more = el("button","ghost", showAllHistory ? "Voir moins" : "Voir tout ("+list.length+" semaines)");
    more.style.marginTop = "8px";
    more.onclick = function(){ showAllHistory = !showAllHistory; render(); };
    card.appendChild(more);
  }
  app.appendChild(card);
}

// ---------- Sauvegarde Drive (bloc commun SAUVEGARDE ATELIER) ----------
Sauvegarde.init({
  app: "PlanningHoraire",
  nom: "Planning Horaire",
  cle: STORE_KEY,
  version: APP_VERSION,
  lire: function(){ return JSON.parse(JSON.stringify(state)); },
  ecrire: function(d){
    state = d;
    if(!Array.isArray(state.history)) state.history = [];
    DAYS.forEach(ensureDayDefaults);
    saveStore();
    modalDay = null; closeWeekOpen = false;
    render();
  },
  resume: function(d){
    var n = (d.history||[]).length;
    var jours = DAYS.filter(function(day){ return d.currentWeek && d.currentWeek[day] && d.currentWeek[day].touched; }).length;
    var pot = (d.pot && d.pot.totalMin) || 0;
    return n+" semaine(s) clôturée(s), pot "+(pot>=0?"+":"")+toHHMM(pot)+", "+jours+" jour(s) validé(s) cette semaine";
  },
  valider: function(d){ return d && d.settings && d.currentWeek && d.pot ? null : "données de Planning Horaire incomplètes"; },
  vide: function(d){
    return !(d.history && d.history.length) && !DAYS.some(function(day){ return d.currentWeek[day] && d.currentWeek[day].touched; });
  }
});
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}

render();

// Rafraîchit le marqueur "maintenant" de la timeline toutes les 30s (sans gêner une fiche ouverte)
setInterval(function(){
  if(!modalDay && !pointageOpen && !pointageChooserOpen && !aboutOpen && !closeWeekOpen && currentPage !== 2) render();
}, 30000);
})();
</script>
