<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kardex</title>
<meta name="theme-color" content="#0E1014">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap">
<style>
/* Kardex v3 : simple et fonctionnel. La recherche est l'élément principal ; une colonne ; un clic ouvre, un clic ferme. */
:root{
  color-scheme:dark;
  --ink:#0E1014; --card:#171A20; --card-2:#1F232A; --line:#2A2F38;
  --acc:#F5A524; --acc-hi:#FFC965; --acc-soft:rgba(245,165,36,.16);
  --fg:#EEF0F4; --fg-2:#B3B8C2; --fg-3:#8B92A0; --on-acc:#14110A;
  --ok:#3DD39B; --bad:#FF8A8D;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{background:var(--ink);color:var(--fg);font-family:var(--f-body);font-size:15px;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ink)}
button{font:inherit;color:inherit}
.app{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px;display:flex;flex-direction:column;gap:20px}

/* en-tête + recherche (collants) */
header.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);padding-block:12px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid transparent}
header.hd.scrolled{border-bottom-color:var(--line)}
.bar{display:flex;align-items:center;gap:8px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--acc);display:grid;place-items:center;flex:none}
.logo svg{width:18px;height:18px}
.name{flex:1;min-width:0;font-size:20px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.name small{font-size:12px;font-weight:500;color:var(--fg-3);margin-left:6px;letter-spacing:0}
.ib{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;min-width:38px;padding:0 10px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--fg-2);cursor:pointer;font-size:13px;font-weight:600}
.ib svg{width:18px;height:18px}
.ib[aria-expanded="true"],.ib[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
@media (max-width:440px){.ib .tx{display:none}.name small{display:none}}
.search{position:relative;display:block}
.search input{width:100%;box-sizing:border-box;font:600 19px var(--f-body);color:var(--fg);background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px 46px 16px 50px;outline:none;transition:border-color .15s}
.search input:focus{border-color:var(--acc)}
.search input::placeholder{color:var(--fg-3);font-weight:500;font-size:16px}
.search .ico{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:var(--acc);pointer-events:none}
.search .clr{position:absolute;right:9px;top:50%;transform:translateY(-50%);border:0;background:var(--card-2);color:var(--fg-2);height:32px;padding:0 10px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--fg-2);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{border-color:var(--c,var(--acc));color:var(--fg);background:color-mix(in srgb,var(--c,var(--acc)) 20%,var(--card))}
.chips.sub .chip{font-size:11.5px;padding:5px 10px}

#bandeau:empty,#pTop:empty{display:none}
h2{margin:0;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-3);display:flex;align-items:baseline;gap:8px}
h2 small{margin-left:auto;font-weight:500;letter-spacing:0;text-transform:none;font-size:11.5px}
section{display:flex;flex-direction:column;gap:10px}
.note{font-size:12.5px;color:var(--fg-3);margin:0}
.note button{border:0;background:none;color:var(--acc-hi);font-weight:700;cursor:pointer;padding:0;text-decoration:underline}

/* article : ligne + détail dépliable */
.list{display:flex;flex-direction:column;gap:6px}
.item{border:1px solid var(--line);background:var(--card);border-radius:14px;overflow:hidden}
.item.open{border-color:color-mix(in srgb,var(--c) 70%,var(--line))}
.item.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 9%,var(--card))}
.row{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:9px 12px 9px 9px;cursor:pointer;text-align:left}
.fl{flex:none;width:50px;height:46px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--card-2);border-left:5px solid var(--c);font:800 21px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.fl small{font:600 8.5px var(--f-body);letter-spacing:.08em;color:var(--fg-3);text-transform:uppercase;margin-bottom:2px}
.t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.t b{font-size:15.5px;font-weight:700;overflow-wrap:anywhere}
.t b mark{background:var(--acc-soft);color:var(--acc-hi);border-radius:3px}
.cat{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-2);min-width:0}
.cat i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.cat .s{color:var(--fg-3)}
.hot{flex:none;font:700 11px var(--f-mono);color:var(--acc-hi);background:var(--acc-soft);border-radius:6px;padding:2px 6px}
.chev{flex:none;width:18px;height:18px;color:var(--fg-3);transition:transform .2s}
.item.open .chev{transform:rotate(90deg)}
.ck{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--fg-3);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--on-acc)}
.item.sel .ck{background:var(--acc);border-color:var(--acc)}
.item.sel .ck::after{content:"✓"}
.det{padding:2px 12px 14px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:12px;margin:0 0 0}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills span{font-size:12px;color:var(--fg-2);background:var(--card-2);border-radius:999px;padding:5px 10px}
.pills span b{color:var(--fg-3);font-weight:600;margin-right:4px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card-2);color:var(--fg);border-radius:11px;padding:10px 13px;font-size:13px;font-weight:700;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.bad{border-color:#E5484D;color:var(--bad);background:transparent}
.btn[aria-expanded="true"]{border-color:var(--acc);color:var(--acc-hi)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.grow{flex:1}
h3{margin:0;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-3)}
.same{display:flex;flex-wrap:wrap;gap:6px}
.same span{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;background:var(--card-2);border-radius:8px;padding:5px 9px}
.same span i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist li{display:grid;grid-template-columns:auto 1fr;gap:1px 12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.hist li:last-child{border-bottom:0}
.hist time{font:600 11.5px var(--f-mono);color:var(--fg-3);grid-row:span 2;padding-top:2px;white-space:nowrap}
.hist .w{overflow-wrap:anywhere}
.hist .d{color:var(--fg-3);font-size:12px;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:5px;padding:1px 6px;margin-right:6px;background:var(--card-2);color:var(--acc-hi)}

/* formulaires */
.form{display:flex;flex-direction:column;gap:11px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--fg-3)}
.form input,.form select{font:600 15px var(--f-body);color:var(--fg);background:var(--ink);border:1px solid var(--line);border-radius:11px;padding:11px 12px;outline:none;width:100%;box-sizing:border-box}
.form input:focus,.form select:focus{border-color:var(--acc)}
.two{display:grid;grid-template-columns:100px 1fr;gap:10px}
.two>*{min-width:0}
.msg{font-size:12.5px;color:var(--bad);margin:0}
.panel{border:1px solid var(--acc);background:var(--card);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.panel>.ph{display:flex;align-items:baseline;gap:10px}
.panel>.ph b{font-size:17px;font-weight:800}
.panel>.ph span{font-size:12px;color:var(--fg-3)}
.prev{display:flex;flex-direction:column;gap:5px;max-height:36vh;overflow:auto}
.prev div{display:flex;flex-direction:column;gap:2px;font-size:13.5px;background:var(--card-2);border-radius:9px;padding:7px 10px}
.prev em{font-style:normal;font:700 12px var(--f-mono);color:var(--fg-2);overflow-wrap:anywhere}
.prev em b{color:var(--acc-hi)}

/* étages les plus utilisés */
.tops{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.tp{border:1px solid var(--line);background:var(--card);border-radius:13px;padding:9px 10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:5px;min-width:0}
.tp[aria-expanded="true"]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--card))}
.tp .n{display:flex;align-items:baseline;justify-content:space-between;gap:4px}
.tp .n b{font:800 24px/1 var(--f-mono);color:var(--acc-hi)}
.tp .n span{font:700 10.5px var(--f-mono);color:var(--fg-3)}
.tp .w{font-size:11.5px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* le Kardex : 60 plateaux, chaque plateau montre toutes ses catégories */
.kx{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.tr{position:relative;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:7px 7px 6px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0;text-align:left}
.tr .n{display:flex;align-items:center;justify-content:space-between;gap:2px}
.tr .n b{font:800 15px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.tr .n span{font:600 10px var(--f-mono);color:var(--fg-3)}
.tr .seg{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px}
.tr .seg i{display:block;height:100%;background:var(--c);flex:var(--w) 1 0;border-radius:2px;min-width:5px}
.tr.used .n b{color:var(--acc-hi)}
.tr.used::after{content:"";position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--acc);border:2px solid var(--ink)}
.tr.empty{background:transparent;border-style:dashed}
.tr.empty .n b{color:var(--fg-3)}
.tr.empty .seg{background:var(--card-2)}
.tr[aria-expanded="true"]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--card))}
.tr.pick{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.fp{grid-column:1/-1}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11.5px;color:var(--fg-3)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%;background:var(--c)}

/* paramètres */
.set{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.set:last-of-type{border-bottom:0}
.set .l{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.set .l b{font-size:14.5px}
.set .l span{font-size:12px;color:var(--fg-3)}
.sw{flex:none;position:relative;width:46px;height:28px;border-radius:999px;border:0;background:var(--line);cursor:pointer;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--fg);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--acc)}
.sw[aria-checked="true"]::after{transform:translateX(18px);background:var(--on-acc)}
.seg3{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.seg3 button{border:0;background:none;padding:7px 11px;font-size:13px;font-weight:700;color:var(--fg-2);cursor:pointer}
.seg3 button[aria-pressed="true"]{background:var(--acc);color:var(--on-acc)}

/* lots */
.lotbar{position:fixed;left:0;right:0;bottom:0;z-index:36;background:var(--card-2);border-top:2px solid var(--acc);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lotbar .in{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lotbar b{flex:1;min-width:100px;font-size:14px}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--card-2);border:1px solid var(--acc);padding:10px 14px;border-radius:12px;z-index:70;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:calc(100% - 40px);display:flex;align-items:center;gap:10px}
.toast button{border:0;background:var(--acc);color:var(--on-acc);font-size:12px;font-weight:700;border-radius:8px;padding:5px 10px;cursor:pointer}
:focus-visible{outline:2px solid var(--acc-hi);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* photos */
.phs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.phb{flex:none;width:132px;height:100px;border:1px solid var(--line);border-radius:11px;overflow:hidden;padding:0;background:var(--card-2);cursor:zoom-in}
.phb img{width:100%;height:100%;object-fit:cover;display:block}
.phadd{flex:none;min-width:100px;height:100px;box-sizing:border-box;border:1.5px dashed var(--line);border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:700;color:var(--fg-2);cursor:pointer;padding:0 10px}
.phadd span{font-size:22px}
.pg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:560px){.pg{grid-template-columns:repeat(3,1fr)}}
.pc{border:1px solid var(--line);background:var(--card);border-radius:13px;overflow:hidden;padding:0;cursor:pointer;text-align:left;display:flex;flex-direction:column;min-width:0}
.pc[aria-expanded="true"]{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.pc .pi{position:relative;aspect-ratio:4/3;max-width:100%;background:var(--card-2);display:grid;place-items:center}
.pc .pi img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pc .pi>span{font-size:26px;opacity:.35}
.pc .pi b{position:absolute;left:7px;top:7px;font:800 17px/1 var(--f-mono);background:rgba(14,16,20,.82);color:var(--acc-hi);border-radius:8px;padding:5px 8px}
.pc .pi em{position:absolute;right:7px;top:7px;font:700 11px var(--f-mono);font-style:normal;background:rgba(14,16,20,.82);color:var(--fg);border-radius:7px;padding:3px 7px}
.pc.none .pi b{color:var(--fg-3)}
.pc .pw{font-size:12px;color:var(--fg-2);padding:7px 9px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vw{position:fixed;inset:0;z-index:80;background:#000;display:flex;flex-direction:column}
.vw .stage{flex:1;min-height:0;overflow:hidden;display:grid;place-items:center;touch-action:none;cursor:zoom-in}
.vw .stage img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center;user-select:none;-webkit-user-drag:none;pointer-events:none}
.vw .vbar{display:flex;align-items:center;gap:8px;padding:10px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));color:#EEF0F4}
.vw .vbar b{font:700 14px var(--f-mono)}
.vw .vhint{margin:0;padding:0 16px calc(12px + env(safe-area-inset-bottom,0px));font-size:11.5px;color:#8B92A0;text-align:center}
.phsave{border:2px solid #1f8a5b;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.phsave .sv-titre{font-weight:700;font-size:18px}

/* swipe par étage (paysage / grand écran) */
.carw{position:relative}
.car{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;min-height:260px;border:1px solid var(--line);border-radius:16px;background:var(--card);overscroll-behavior-x:contain}
.car::-webkit-scrollbar{display:none}
.sl{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;display:grid;grid-template-columns:minmax(0,1.7fr) minmax(220px,1fr);min-width:0;height:100%}
.sl .big{position:relative;border:0;padding:0;margin:0;background:#000;display:grid;place-items:center;overflow:hidden;cursor:zoom-in;min-width:0;min-height:0}
.sl .big img{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain}
.sl .big b{position:absolute;left:12px;top:12px;font:800 30px/1 var(--f-mono);background:rgba(14,16,20,.82);color:var(--acc-hi);border-radius:12px;padding:8px 12px}
.sl .big.none{cursor:pointer;background:var(--card-2);color:var(--fg-3);text-align:center;font-weight:700;font-size:14px}
.sl .big.none span{font-size:15px;line-height:1.8}
.sl .side{min-width:0;min-height:0;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;border-left:1px solid var(--line)}
.sl .sh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sl .sh b{font-size:20px;font-weight:800}
.sl .sh span{font-size:12.5px;color:var(--fg-3)}
.sl .seg{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;flex:none}
.sl .seg i{display:block;height:100%;background:var(--c);flex:var(--w) 1 0;border-radius:2px;min-width:5px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs button,.thumbs .tadd{width:58px;height:44px;border-radius:8px;overflow:hidden;padding:0;border:2px solid transparent;background:var(--card-2);cursor:pointer;box-sizing:border-box}
.thumbs button.on{border-color:var(--acc)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .tadd{display:grid;place-items:center;border:1.5px dashed var(--line);font-size:20px;color:var(--fg-2)}
.cl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.cl li{display:grid;grid-template-columns:auto 1fr;gap:0 9px;align-items:center;background:var(--card-2);border-radius:9px;padding:7px 10px;font-size:14px}
.cl li i{width:8px;height:8px;border-radius:50%;background:var(--c);grid-row:span 2}
.cl li span{font-weight:700;overflow-wrap:anywhere}
.cl li em{font-style:normal;font-size:11.5px;color:var(--fg-3)}
.cl li.e{display:block;color:var(--fg-3)}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;border-radius:12px;border:1px solid var(--line);background:rgba(23,26,32,.85);color:var(--fg);font-size:28px;font-weight:700;cursor:pointer;z-index:2}
.nav.prev{left:8px}
.nav.next{right:calc(8px + max(220px, 37%))}
.ccount{position:absolute;left:12px;bottom:12px;font:700 12.5px var(--f-mono);background:rgba(14,16,20,.82);border-radius:8px;padding:5px 9px;z-index:2}

/* deux modes : ce qui modifie n'apparaît qu'en édition */
body:not(.edit) .ed{display:none!important}
#bLock{border-color:var(--line)}
#bLock[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
#bLock[aria-expanded="true"]{border-color:var(--acc);color:var(--acc-hi)}
.shake{animation:shk .45s}
@keyframes shk{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.vw .vbar .btn{white-space:nowrap}
/* recadrage */

<script>
/* === SAUVEGARDE ATELIER v2 — début (copie identique dans chaque app, source : /mnt/project-files/sauvegarde-drive) === */
/* Sauvegarde Drive commune aux apps d'atelier.
   - 💾 Sauvegarder : fichier .txt daté (App_AAAA-MM-JJ_HHhMM.txt) → menu Partager d'Android (Drive), sinon téléchargement.
     v2 (choix d'Adi 6b) : chaque fichier contient TOUT l'historique des sauvegardes de l'app (le dernier fichier suffit).
     Historique gardé dans le téléphone (<cle>-historique), une entrée par sauvegarde dont les données ont changé.
   - 📂 Importer : lit le .txt (v1 ou v2), aperçu, choix de la version à remettre (la plus récente par défaut), confirmation ;
     les données actuelles partent d'abord dans « Copies avant import » ; l'historique du fichier rejoint celui du téléphone.
   - Copies avant import : jamais effacées, on peut revenir à n'importe laquelle (ce retour fait lui-même une copie).
   - Rappel : bandeau si aucune sauvegarde depuis 7 jours et que les données ont changé depuis.
   Usage :
     Sauvegarde.init({ app:"PorteOutils", nom:"Porte-outils", cle:"porteoutils-cnc-v1", version:"1.1",
       lire:() => donnees, ecrire:d => {...}, resume:d => "12 porte-outils…", valider:d => null|"erreur", vide:d => true|false });
     Sauvegarde.panneau(element)   // carte avec boutons, aperçu d'import, copies
     Sauvegarde.bandeau()          // HTML du rappel ("" si pas besoin)
     Sauvegarde.copieAvant(raison) // à appeler avant tout autre remplacement des données (ex. import Excel) ; false = échec
*/
const Sauvegarde = (() => {
  const MARQUE = "---- DONNÉES (ne pas modifier sous cette ligne) ----";
  let C = null;
  const p2 = n => String(n).padStart(2, "0");
  const ech = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const dateFr = d => `${p2(d.getDate())}.${p2(d.getMonth()+1)}.${d.getFullYear()} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
  const empreinte = s => { let h = 2166136261; for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); };
  const kEtat = () => C.cle + "-sauvegarde", kCopies = () => C.cle + "-copies", kHist = () => C.cle + "-historique";
  const lireLS = (k, def) => { try{ const v = JSON.parse(localStorage.getItem(k)); return v ?? def; }catch(e){ return def; } };
  const ecrireLS = (k, v) => { try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } };
  const etat = () => lireLS(kEtat(), {derniere:null, empreinte:null});
  const copies = () => lireLS(kCopies(), []);
  const historique = () => lireLS(kHist(), []);
  // réunit deux historiques (clé = date), trié du plus ancien au plus récent
  function fusion(a, b){ const m = new Map(); [...a, ...b].forEach(h => h && h.date && h.donnees && m.set(h.date, h)); return [...m.values()].sort((x, y) => x.date.localeCompare(y.date)); }
  const actuel = () => JSON.stringify(C.lire());
  let msgT;
  function message(t, erreur){
    let m = document.getElementById("sv-msg");
    if(!m){ m = document.createElement("div"); m.id = "sv-msg"; m.className = "sv-msg"; m.setAttribute("role","status"); document.body.appendChild(m); }
    m.textContent = t; m.classList.toggle("sv-err", !!erreur); m.classList.add("on"); clearTimeout(msgT); msgT = setTimeout(() => m.classList.remove("on"), 3200);
  }

  function init(cfg){ C = Object.assign({version:"", resume:() => "", valider:() => null, vide:() => false}, cfg); style(); }

  function nomFichier(d){ return `${C.app}_${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}_${p2(d.getHours())}h${p2(d.getMinutes())}.txt`; }
  function contenu(d, donnees, hist){
    const env = {format:"sauvegarde-atelier", formatVersion:2, app:C.app, nom:C.nom, appVersion:C.version, date:d.toISOString(), donnees, historique:hist};
    return ["SAUVEGARDE ATELIER", `App : ${C.nom}${C.version ? " v" + C.version : ""}`, `Date : ${dateFr(d)}`,
      `Contenu : ${C.resume(donnees)}`, `Historique : ${hist.length} sauvegarde(s), toutes dans ce fichier (le plus récent fichier suffit) :`,
      ...hist.slice().reverse().map(h => `  ${dateFr(new Date(h.date))}  ${h.resume}`),
      "Pour remettre ces données : dans l'app, bouton 📂 Importer.", "", MARQUE, JSON.stringify(env)].join("\n");
  }

  async function sauvegarder(){
    const d = new Date(), donnees = C.lire(), nom = nomFichier(d);
    let hist = historique();
    const der = hist[hist.length - 1];
    if(!der || empreinte(JSON.stringify(der.donnees)) !== empreinte(JSON.stringify(donnees))) hist = fusion(hist, [{date:d.toISOString(), resume:C.resume(donnees), donnees}]);
    const txt = contenu(d, donnees, hist);
    const fichier = new File([txt], nom, {type:"text/plain"});
    let fait = false;
    if(navigator.canShare && navigator.share){
      let ok = false; try{ ok = navigator.canShare({files:[fichier]}); }catch(e){}
      if(ok){
        try{ await navigator.share({files:[fichier], title:nom}); fait = true; message("Sauvegarde envoyée : " + nom); }
        catch(e){ if(e && e.name === "AbortError"){ message("Sauvegarde annulée"); return false; } }
      }
    }
    if(!fait){
      const a = document.createElement("a"); a.href = URL.createObjectURL(fichier); a.download = nom;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      fait = true; message("Fichier enregistré dans Téléchargements : " + nom);
    }
    ecrireLS(kEtat(), {derniere:d.toISOString(), empreinte:empreinte(JSON.stringify(donnees))});
    if(!ecrireLS(kHist(), hist)) message("Fichier envoyé, mais mémoire du téléphone pleine : l'historique n'a pas pu y être gardé.", true);
    return true;
  }

  async function lireFichier(f){
    const t = await f.text();
    const i = t.indexOf(MARQUE);
    let env;
    try{ env = JSON.parse(i >= 0 ? t.slice(i + MARQUE.length) : t); }catch(e){ throw new Error("ce n'est pas une sauvegarde lisible"); }
    if(!env || env.format !== "sauvegarde-atelier" || !env.donnees) throw new Error("ce n'est pas une sauvegarde d'atelier");
    if(env.app !== C.app) throw new Error(`c'est une sauvegarde de « ${env.nom || env.app} », pas de « ${C.nom} »`);
    const err = C.valider(env.donnees); if(err) throw new Error(err);
    const r = C.resume;
    env.versions = fusion(Array.isArray(env.historique) ? env.historique : [], [{date:env.date, resume:r(env.donnees), donnees:env.donnees}])
      .filter(h => !C.valider(h.donnees)).reverse(); // plus récente d'abord
    return env;
  }

  function copieAvant(raison){
    const l = copies();
    l.unshift({date:new Date().toISOString(), raison, resume:C.resume(C.lire()), donnees:C.lire()});
    return ecrireLS(kCopies(), l);
  }
  function remplacer(donnees, raison){
    if(!copieAvant(raison)){ message("Mémoire du téléphone pleine : copie impossible, rien n'a été remplacé. Sauvegarde d'abord sur Drive.", true); return false; }
    C.ecrire(donnees); return true;
  }

  function bandeau(){
    if(!C) return "";
    const e = etat(), donnees = actuel();
    if(C.vide(C.lire())) return "";
    const jours = e.derniere ? Math.floor((Date.now() - new Date(e.derniere).getTime()) / 864e5) : null;
    if(jours !== null && (jours < 7 || e.empreinte === empreinte(donnees))) return "";
    return `<div class="sv-bandeau"><span>💾 ${jours === null ? "Jamais sauvegardé sur Drive." : `Pas de sauvegarde depuis ${jours} jours.`} Tes données ne sont que dans ce téléphone.</span><button type="button" class="sv-btn sv-save" onclick="Sauvegarde.sauvegarder().then(ok=>ok&&this.closest('.sv-bandeau').remove())">💾 Sauvegarder</button></div>`;
  }

  function panneau(el){
    const e = etat(), l = copies(), d = e.derniere ? new Date(e.derniere) : null;
    const change = d && e.empreinte !== empreinte(actuel());
    el.innerHTML = `<div class="sv-carte">
      <div class="sv-titre">💾 Sauvegarde Drive</div>
      <div class="sv-info">Dernière sauvegarde : <b>${d ? dateFr(d) : "jamais"}</b>${change ? " · modifié depuis" : ""}</div>
      <div class="sv-btns"><button type="button" class="sv-btn sv-save" data-sv="save">💾 Sauvegarder</button>
        <label class="sv-btn sv-imp">📂 Importer<input type="file" accept=".txt,.json,text/plain,application/json" hidden></label></div>
      <div class="sv-aide">Choisis Drive dans le menu Partager, dossier <b>Sauvegardes atelier</b>. Chaque fichier contient tout l'historique (${historique().length} sauvegarde(s)) : le plus récent suffit.</div>
      <div class="sv-apercu" hidden></div>
      <details class="sv-copies"><summary>Copies avant import (${l.length})</summary>
        ${l.length ? l.map((c, i) => `<div class="sv-copie"><div><b>${dateFr(new Date(c.date))}</b> · ${ech(c.raison)}<br><small>${ech(c.resume)}</small></div><button type="button" class="sv-btn" data-sv="rev" data-i="${i}">Revenir</button></div>`).join("")
          : `<div class="sv-aide">Aucune pour l'instant. Avant chaque import, tes données actuelles sont gardées ici, jamais effacées.</div>`}
      </details></div>`;
    const ap = el.querySelector(".sv-apercu"), inp = el.querySelector("input[type=file]");
    el.querySelector('[data-sv="save"]').onclick = () => sauvegarder().then(() => panneau(el));
    inp.onchange = async () => {
      const f = inp.files[0]; if(!f) return;
      let env;
      try{ env = await lireFichier(f); }catch(err){ inp.value = ""; message("Import impossible : " + err.message, true); return; }
      ap.hidden = false;
      const v = env.versions;
      ap.innerHTML = `<div><b>${ech(f.name)}</b></div>
        <div>Sauvegarde du <b>${dateFr(new Date(env.date))}</b>${env.appVersion ? ` (v${ech(env.appVersion)})` : ""} · ${v.length} version(s) dans le fichier</div>
        <label class="sv-aide">Version à remettre
          <select class="sv-choix">${v.map((h, i) => `<option value="${i}">${dateFr(new Date(h.date))} · ${ech(h.resume)}${i ? "" : " (la plus récente)"}</option>`).join("")}</select></label>
        <div>Actuellement : ${ech(C.resume(C.lire()))}</div>
        <div class="sv-aide">Tes données actuelles seront d'abord gardées dans « Copies avant import ».</div>
        <div class="sv-btns"><button type="button" class="sv-btn sv-ok" data-sv="ok">Remplacer mes données</button><button type="button" class="sv-btn" data-sv="no">Annuler</button></div>`;
      ap.querySelector('[data-sv="no"]').onclick = () => { inp.value = ""; ap.hidden = true; };
      ap.querySelector('[data-sv="ok"]').onclick = () => {
        const h = v[+ap.querySelector(".sv-choix").value] || v[0];
        if(remplacer(h.donnees, `import ${f.name} (version du ${dateFr(new Date(h.date))})`)){
          ecrireLS(kHist(), fusion(historique(), v));
          message("Données importées"); panneau(el);
        }
      };
    };
    el.querySelectorAll('[data-sv="rev"]').forEach(b => b.onclick = () => {
      const c = copies()[+b.dataset.i];
      if(!c || !confirm(`Revenir aux données du ${dateFr(new Date(c.date))} ?\n(${c.resume})\nTes données actuelles seront gardées comme nouvelle copie.`)) return;
      if(remplacer(c.donnees, "retour à la copie du " + dateFr(new Date(c.date)))){ message("Données remises"); panneau(el); }
    });
  }

  function style(){
    if(document.getElementById("sv-style")) return;
    const s = document.createElement("style"); s.id = "sv-style";
    s.textContent = `
.sv-carte [hidden]{display:none!important}

/* ---------- recherche intelligente ---------- */
const SYN=[["meche","foret","percage","perceuse"],["cle","clef","cles"],["scotch","ruban","adhesif","tape"],["sangle","span","elingue","levage"],["colle","loctite","sika"],["metre","regle","mesure","metrologie"],["vis","boulon","visserie"],["rondelle","belleville","seeger"],["taraud","filetage","helicoil"],["meuleuse","disque"],["perforateur","hilti","beton"],["batterie","accu"],["inox","inoxydable"],["fraise","fraiseuse"],["pince","pinces"]];
const synOf=w=>{const r=new Set([w]);SYN.forEach(g=>{if(g.some(x=>x===w||(w.length>=4&&x.startsWith(w))))g.forEach(x=>r.add(x))});return [...r]};
const sing=w=>w.length>3&&/[sx]$/.test(w)?w.slice(0,-1):w;
function lev(a,b,max){if(Math.abs(a.length-b.length)>max)return max+1;let p=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){const c=[i];let m=i;for(let j=1;j<=b.length;j++){c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));m=Math.min(m,c[j])}if(m>max)return max+1;p=c}return p[b.length]}

// 4 exact, 3 début de mot, 2 contenu, 1 faute de frappe (si la recherche tolérante est active)
function wordScore(q,ws){
  let best=0;const qs=sing(q),tol=!P().tolerante?0:q.length>=7?2:q.length>=4?1:0;
  for(const v of synOf(qs))for(const w of ws){
    const syn=v!==qs?.5:0;
    if(w===v)best=Math.max(best,4-syn);

let RANK={};
function rankCalc(){const fl=[...Array(60).keys()].map(i=>i+1);const nb={};all().forEach(a=>nb[a.floor]=(nb[a.floor]||0)+1);
  fl.sort((a,b)=>fUse(b)-fUse(a)||(nb[b]||0)-(nb[a]||0)||a-b);RANK={};fl.forEach((f,i)=>RANK[f]=i+1)}
const byRank=()=>Object.keys(RANK).map(Number).sort((a,b)=>RANK[a]-RANK[b]);
// les 60 tuiles et le swipe tiennent sur un écran
function fitScreen(){requestAnimationFrame(()=>{
  const tb=$("tabs").getBoundingClientRect().height,el=tab==="tiles"?$("kx"):tab==="photos"?$("car"):null;if(!el)return;
  const top=el.getBoundingClientRect().top+scrollY;
  if(tab==="tiles"){const land=innerWidth>innerHeight;el.style.setProperty("--cols",land?10:6);
    el.style.setProperty("--kxH",openF&&openF.where==="kx"?"auto":Math.max(170,innerHeight-top-tb-10)+"px")}
  else el.style.setProperty("--carH",Math.max(200,innerHeight-top-tb-10)+"px");
})}

function renderTop(){
  const n=P().nbTop,used=Object.keys(st.uses.floors).some(f=>fUse(+f)>0);
  const rows=byRank().slice(0,n);$("topSrc").textContent=used?"selon ce que tu ouvres":"pour l'instant : les plus remplis";
  let h=rows.map(f=>{const it=byFloor(f);return `<button class="tp" type="button" data-act="floor" data-w="top" data-f="${f}" aria-expanded="${openF&&openF.where==="top"&&openF.f===f}"><span class="n"><b>${f}</b><span class="rk">#${RANK[f]}</span></span><span class="w">${esc(it.map(a=>a.name.trim()).join(", ")||"vide")}</span></button>`}).join("");

function renderKx(){
  const cols=innerWidth>innerHeight?10:6;let h="";const rowEnd=openF&&openF.where==="kx"?Math.min(60,Math.ceil(openF.f/cols)*cols):-1;

    const pick=lots&&it.length&&it.every(a=>sel.has(a.id));
    h+=`<button class="tr${it.length?"":" empty"}${fUse(f)?" used":""}${pick?" pick":""}" type="button" data-act="floor" data-w="kx" data-f="${f}" aria-expanded="${openF&&openF.where==="kx"&&openF.f===f}" aria-label="Étage ${f}, ${it.length} articles"><span class="rk${RANK[f]<=3?" t3":RANK[f]<=10?" t10":""}" title="Rang d'utilisation">#${RANK[f]}</span><span class="n"><b>${f}</b><span class="cnt">${it.length||""}</span></span><span class="seg">${segs}</span></button>`;

/* ---------- modifs : sauvegarde avant, journal, annuler ---------- */
function diff(a,n){const r=[];if(a.name!==n.name)r.push(`Nom : ${a.name.trim()} → ${n.name.trim()}`);if(a.floor!==n.floor)r.push(`Étage ${a.floor} → ${n.floor}`);if(a.c!==n.c)r.push(`${cat[a.c].name} → ${cat[n.c].name}`);if((a.sub||"")!==(n.sub||""))r.push(`Sous-cat. : ${a.sub||"—"} → ${n.sub||"—"}`);return r}
function touch(a,k,w,d){a.mod=now();a.hist.push({t:a.mod,k,w,d})}
function log(k,w,d){st.journal.push({t:now(),k,w,d})}
function snapshot(ids,label){st.undo={label,t:now(),items:ids.map(id=>JSON.parse(JSON.stringify(st.arts[id])))}}
function undo(){if(!st.undo)return;const u=st.undo;u.items.forEach(x=>st.arts[x.id]=x);log("annul",`Annulé : ${u.label}`,`${u.items.length} article${u.items.length>1?"s":""} remis comme avant`);st.undo=null;save();render();toast("Annulé ↩")}

function submitEdit(form){
  const isNew=form.dataset.new==="1",a=isNew?null:st.arts[editA];
  const n={name:$("eName").value,floor:Math.round(+$("eFloor").value),c:+$("eCat").value,sub:$("eSub").value.trim()};
  if(!n.name.trim()){$("eMsg").textContent="Il faut un nom.";return}
  if(!(n.floor>=1&&n.floor<=60)){$("eMsg").textContent="L'étage va de 1 à 60.";return}
  if(isNew){const id=st.next++,t=now();st.arts[id]={id,...n,added:t,mod:null,hist:[{t,k:"ajout",w:"Ajouté à la main",d:`Étage ${n.floor} · ${cat[n.c].name}${n.sub?" › "+n.sub:""}`}]};
    log("ajout",`${n.name.trim()} ajouté`,`Étage ${n.floor} · ${cat[n.c].name}`);save();panel=null;openA=id;render();toast("Article ajouté ✓");return}
  const ch=diff(a,n);editA=null;if(!ch.length){render();return}
  snapshot([a.id],`modif de ${a.name.trim()}`);Object.assign(a,n);touch(a,"modif","Modifié",ch.join(" · "));log("modif",`${a.name.trim()} modifié`,ch.join(" · "));save();render();toast("Enregistré ✓",4000,true);
}

function setLots(on){lots=on;$("bLots").setAttribute("aria-pressed",on);$("lotbar").hidden=!on;document.body.classList.toggle("lots",on);if(!on){sel.clear();if(panel==="lotFloor"||panel==="lotCat")panel=null}openA=null;editA=null;render()}
function renderLot(el,kind){

    <form class="form" id="fLot">
    ${kind==="floor"?`<label for="lFloor">Nouvel étage (1 à 60)<input id="lFloor" type="number" inputmode="numeric" min="1" max="60" required placeholder="ex. 12"></label>`:
     `<label for="lCat">Nouvelle catégorie<select id="lCat"><option value="">(garder la catégorie)</option>${catOptions(-1)}</select></label>
      <label for="lSub">Sous-catégorie<input id="lSub" list="dl-sub" maxlength="40" placeholder="vide = aucune · ex. Tête fraisée"></label>${subList(items[0].c)}`}

  if(keep){if(keep.f!=null&&$("lFloor"))$("lFloor").value=keep.f;if(keep.c!=null&&$("lCat"))$("lCat").value=keep.c;if(keep.s!=null&&$("lSub"))$("lSub").value=keep.s}

function lotTarget(a){if(panel==="lotFloor"){const f=Math.round(+$("lFloor").value);return f>=1&&f<=60?{...a,floor:f}:null}
  return {...a,c:$("lCat").value?+$("lCat").value:a.c,sub:$("lSub").value.trim()}}
function lotPreview(){
  const items=[...sel].map(id=>st.arts[id]).filter(Boolean);let n=0;
  $("lPrev").innerHTML=items.map(a=>{const t=lotTarget(a);const d=t?diff(a,t):[];if(d.length)n++;
    return `<div><span>${esc(a.name.trim())}</span><em>${!t?`étage ${a.floor}`:!d.length?"inchangé":panel==="lotFloor"?`${a.floor} → <b>${t.floor}</b>`:`${esc(cat[a.c].name)}${a.sub?" › "+esc(a.sub):""} → <b>${esc(cat[t.c].name)}${t.sub?" › "+esc(t.sub):""}</b>`}</em></div>`}).join("");
  $("lGo").disabled=!n;$("lGo").textContent=n?`Confirmer (${n} changement${n>1?"s":""})`:"Rien à changer";
}
function submitLot(){
  const kind=panel==="lotFloor"?"floor":"cat";
  const plan=[...sel].map(id=>st.arts[id]).filter(Boolean).map(a=>({a,t:lotTarget(a)})).filter(x=>x.t&&diff(x.a,x.t).length);
  if(!plan.length)return;
  snapshot(plan.map(x=>x.a.id),`lot de ${plan.length} (${kind==="floor"?"étage":"catégorie"})`);
  plan.forEach(({a,t})=>{const d=diff(a,t).join(" · ");a.floor=t.floor;a.c=t.c;a.sub=t.sub;touch(a,"lot","Modifié par lot",d)});
  const okN=plan.filter(({a,t})=>a.floor===t.floor&&a.c===t.c&&a.sub===t.sub).length;
  const t0=plan[0].t,what=kind==="floor"?`→ étage ${t0.floor}`:`→ ${cat[t0.c].name}${t0.sub?" › "+t0.sub:""}`;
  log("lot",`Lot de ${plan.length} article${plan.length>1?"s":""} ${what}`,plan.map(x=>x.a.name.trim()).join(", "));
  save();sel.clear();panel=null;render();toast(`✓ ${okN}/${plan.length} vérifiés`,6000,true);
}

/* ---------- 📷 photos des étages : pleine qualité, dans le téléphone (IndexedDB), sauvegarde à part en .zip ---------- */
const PHDB="kardex-photos";let PH=[];const phUrl=new Map();
function idb(){return new Promise((ok,ko)=>{const r=indexedDB.open(PHDB,1);r.onupgradeneeded=()=>r.result.createObjectStore("photos",{keyPath:"id"});r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)})}
async function idbDo(mode,fn){const db=await idb();return new Promise((ok,ko)=>{const tx=db.transaction("photos",mode);const s=tx.objectStore("photos");const r=fn(s);tx.oncomplete=()=>ok(r&&r.result);tx.onerror=()=>ko(tx.error)})}
async function phLoad(){try{const l=await idbDo("readonly",s=>s.getAll());PH=(l||[]).map(p=>({id:p.id,floor:p.floor,t:p.t,size:p.blob.size})).sort((a,b)=>a.t.localeCompare(b.t))}catch(e){PH=[]}render()}
const phOf=f=>PH.filter(p=>p.floor===f);
async function phGet(id){return idbDo("readonly",s=>s.get(id))}
async function phSrc(id,orig){const k=id+(orig?":o":":p");if(phUrl.has(k))return phUrl.get(k);const p=await phGet(id);if(!p)return "";const u=URL.createObjectURL(orig?p.blob:p.prev);phUrl.set(k,u);return u}
// aperçu léger seulement pour l'affichage des grilles (la photo d'origine reste intacte)
async function makePrev(blob){
  try{const bm=await createImageBitmap(blob,{imageOrientation:"from-image"});const k=Math.min(1,720/Math.max(bm.width,bm.height));
    const c=document.createElement("canvas");c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext("2d").drawImage(bm,0,0,c.width,c.height);bm.close&&bm.close();
    return await new Promise(r=>c.toBlob(r,"image/jpeg",.82))}catch(e){return blob}}
async function phAdd(f,files){
  let n=0;for(const file of files){if(!file.type.startsWith("image/"))continue;
    const r=await cropEditor(file,{adding:true});if(!r)continue;
    const blob=r==="keep"?file:r,id=Date.now().toString(36)+Math.random().toString(36).slice(2,6),t=now();
    const prev=await makePrev(blob);

const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

  const enc=new TextEncoder(),parts=[],cd=[];let off=0;const d=new Date(),dt=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1)),dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate());

    [[0,0x04034b50,4],[4,20,2],[6,0,2],[8,0,2],[10,dt,2],[12,dd,2],[14,crc,4],[18,f.data.length,4],[22,f.data.length,4],[26,nm.length,2],[28,0,2]].forEach(([o,v,n])=>n===4?h.setUint32(o,v,true):h.setUint16(o,v,true));

    [[0,0x02014b50,4],[4,20,2],[6,20,2],[8,0,2],[10,0,2],[12,dt,2],[14,dd,2],[16,crc,4],[20,f.data.length,4],[24,f.data.length,4],[28,nm.length,2],[30,0,2],[32,0,2],[34,0,2],[36,0,2],[38,0,4],[42,off,4]].forEach(([o,v,n])=>n===4?c.setUint32(o,v,true):c.setUint16(o,v,true));

  [[0,0x06054b50,4],[8,files.length,2],[10,files.length,2],[12,cdSize,4],[16,off,4]].forEach(([o,v,n])=>n===4?e.setUint32(o,v,true):e.setUint16(o,v,true));

    <div class="cbar"><div class="seg3">${[["Libre",0],["4:3",4/3],["3:4",3/4],["16:9",16/9],["1:1",1]].map(([l,r])=>`<button type="button" data-r="${r}" aria-pressed="${r===0}">${l}</button>`).join("")}</div>

      ${opt.adding?'<button class="btn" type="button" data-c="keep">Garder telle quelle</button>':""}${opt.orig?'<button class="btn" type="button" data-c="orig">Photo d’origine</button>':""}
      <span class="grow"></span><button class="btn pri" type="button" data-c="ok">✂️ Recadrer</button></div>`;
  document.body.appendChild(v);document.body.style.overflow="hidden";

  const W=()=>src.width,H=()=>src.height;

    const x=c.getContext("2d");x.translate(c.width/2,c.height/2);x.rotate(rot*Math.PI/2);x.drawImage(bm,-bm.width/2,-bm.height/2);return c}
  function full(){if(!ratio)return {x:0,y:0,w:W(),h:H()};let w=W(),h=w/ratio;if(h>H()){h=H();w=h*ratio}return {x:(W()-w)/2,y:(H()-h)/2,w,h}}

    cv.width=dw;cv.height=dh;cv.style.width=dw+"px";cv.style.height=dh+"px";ox=(r.width-dw)/2;oy=(r.height-dh)/2;cv.style.left=ox+"px";cv.style.top=oy+"px";
    cv.getContext("2d").drawImage(src,0,0,dw,dh);draw()}
  function draw(){Object.assign(box.style,{left:ox+crop.x*k+"px",top:oy+crop.y*k+"px",width:crop.w*k+"px",height:crop.h*k+"px"})}

  const nb=r==="orig"?p.orig:r;
  const rec={...p,blob:nb,orig:r==="orig"?null:(p.orig||p.blob),prev:await makePrev(nb),type:"image/jpeg"};
  try{await idbDo("readwrite",s=>s.put(rec))}catch(e){toast("Mémoire pleine : recadrage non gardé");return}
  ["o","p"].forEach(k=>{const u=phUrl.get(id+":"+k);if(u)URL.revokeObjectURL(u);phUrl.delete(id+":"+k)});
  const m=PH.find(x=>x.id===id);if(m)m.size=nb.size;
  log("photo",r==="orig"?"Photo remise d'origine":"Photo recadrée",`Étage ${p.floor}`);save();render();toast(r==="orig"?"Photo d'origine remise":"✂️ Photo recadrée")
}

/* ---------- 🔒 deux modes : Utilisation (par défaut, rien ne se modifie) et Édition (code) ---------- */
let ED=false,lastAct=Date.now();
const LOCK_PANELS=["add","set","lotFloor","lotCat"];
async function pinHash(code){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("kardex:"+code));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function setEdit(on){
  ED=on;document.body.classList.toggle("edit",on);
  if(!on){if(lots)setLots(false);editA=null;if(LOCK_PANELS.includes(panel)||panel==="pin")panel=null}
  else if(panel==="pin")panel=null;
  lastAct=Date.now();render();
}
function pinHtml(){
  const nouveau=!P().pin||panel2==="chpin";
  return `<div class="panel"><div class="ph"><b>${nouveau?(P().pin?"Changer le code":"Créer le code d'édition"):"Mode édition"}</b><span>${nouveau?"4 à 8 chiffres":"tape ton code"}</span></div>
    <form class="form" id="fPin" data-new="${nouveau?1:0}">
      <label for="pin1">${nouveau?"Nouveau code":"Code"}<input id="pin1" type="password" inputmode="numeric" autocomplete="off" pattern="[0-9]*" maxlength="8" required></label>
      ${nouveau?'<label for="pin2">Encore une fois<input id="pin2" type="password" inputmode="numeric" autocomplete="off" pattern="[0-9]*" maxlength="8" required></label>':""}
      <div class="acts"><button class="btn pri grow" type="submit">${nouveau?"Enregistrer le code":"🔓 Passer en édition"}</button></div>
      <p class="msg" id="pinMsg"></p></form></div>`;
}
let panel2=null;
async function submitPin(form){
  const a=$("pin1").value.trim();
  if(form.dataset.new==="1"){const b=$("pin2").value.trim();
    if(!/^\d{4,8}$/.test(a)){$("pinMsg").textContent="Le code doit avoir 4 à 8 chiffres.";return}
    if(a!==b){$("pinMsg").textContent="Les deux codes ne sont pas pareils.";return}
    const had=!!P().pin;st.params.pin=await pinHash(a);log("code",had?"Code d'édition changé":"Code d'édition créé","");save();panel2=null;
    if(had){panel="set";render();toast("Code changé ✓")}else{setEdit(true);toast("Code créé ✓ · mode édition")}return}
  if(await pinHash(a)===P().pin){setEdit(true);toast("🔓 Mode édition")}
  else{$("pinMsg").textContent="Mauvais code.";$("pin1").value="";$("pin1").focus();$("hd").classList.add("shake");setTimeout(()=>$("hd").classList.remove("shake"),500)}
}
function lockBtn(){const b=$("bLock");b.setAttribute("aria-pressed",ED);b.setAttribute("aria-expanded",panel==="pin");
  b.querySelector(".tx").textContent=ED?"Édition":"Utilisation";b.querySelector(".lk").hidden=ED;b.querySelector(".un").hidden=!ED;
  b.setAttribute("aria-label",ED?"Mode édition : toucher pour revenir au mode utilisation":"Mode utilisation : toucher pour passer en édition")}
$("bLock").onclick=()=>{if(ED){setEdit(false);toast("🔒 Mode utilisation");return}panel2=null;togglePanel("pin");setTimeout(()=>$("pin1")&&$("pin1").focus(),50)};
// retour automatique au mode utilisation après un moment sans rien toucher
["pointerdown","keydown"].forEach(t=>addEventListener(t,()=>lastAct=Date.now(),{passive:true}));
function relockCheck(){const m=P().relock;if(ED&&m>0&&Date.now()-lastAct>m*60000){setEdit(false);toast("🔒 Retour au mode utilisation")}}
setInterval(relockCheck,20000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)relockCheck()});

const toData=s=>({articles:s.arts,compteurs:s.uses,journal:s.journal,parametres:s.params,prochainId:s.next});
/* ---------- 💾 sauvegarde Drive commune (bloc SAUVEGARDE ATELIER v2), paramètres compris ---------- */
Sauvegarde.init({
  app:"Kardex",nom:"Kardex",cle:LS,version:APP_VERSION,
  lire:()=>toData(st),
  ecrire:d=>{st={arts:d.articles,uses:d.compteurs||{floors:{},arts:{}},journal:d.journal||[],next:d.prochainId||100000,undo:null,params:{...PARAMS0,...(d.parametres||{})}};save();openA=editA=openF=null;render()},
  resume:d=>{const n=Object.keys(d.articles||{}).length,m=Object.values(d.articles||{}).filter(a=>a.mod).length;return `${n} articles, ${m} modifié${m>1?"s":""}, ${(d.journal||[]).length} ligne${(d.journal||[]).length>1?"s":""} de journal`},
  valider:d=>!d||typeof d.articles!=="object"||!Object.keys(d.articles).length?"pas d'articles dans ce fichier":null,
  vide:d=>!(d.journal||[]).length
});


chips();render();phLoad();
