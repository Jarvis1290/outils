        setTimeout(end,(dur/2+8)*1000)});
      vid.pause();
    }
    // tranches oubliées (ou navigateur sans suivi d'images) : on va les chercher une par une
    for(let k=0;k<TV_SCRUB;k++)if(best[k].s<0){await seek((k+.5)/TV_SCRUB*dur);consider(vid.currentTime);onStep&&onStep(.8+k/TV_SCRUB*.1,"Recherche des images nettes")}
    const sharpIdx=[];const per=TV_SCRUB/TV_SHARP;for(let k=0;k<TV_SHARP;k++){let b=-1,bs=-1;for(let j=Math.round(k*per);j<Math.round((k+1)*per);j++)if(best[j].s>bs){bs=best[j].s;b=j}sharpIdx.push(b)}
    const frames=[];
    for(let k=0;k<TV_SCRUB;k++){const full=sharpIdx.includes(k);let blob;
      if(full&&kS<1){await seek(best[k].t);blob=await enc(W,H,.93)}else blob=await best[k].p;
      frames.push({t:best[k].t,s:best[k].s,blob,full});onStep&&onStep(.9+k/TV_SCRUB*.1,"Préparation des images")}
    return {frames,W,H,dur}}
  finally{vid.pause();vid.removeAttribute("src");vid.load();URL.revokeObjectURL(url)}}

// 3) enregistrer : chaque image est une photo cachée (sauvegardée dans le .zip comme les autres) ; l'image la plus nette sert de couverture
async function tvSave(f,res){
  const vid="v"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),t=now(),list=[];
  for(let k=0;k<res.frames.length;k++){const fr=res.frames[k],id=vid+"-"+k;
    await idbDo("readwrite",x=>x.put({id,floor:f,t,name:`tiroir-video-${k+1}.jpg`,type:"image/jpeg",blob:fr.blob,prev:null,part:vid,...(fr.full?{}:{sc:1})}));
    PH.push({id,floor:f,t,size:fr.blob.size,part:vid,sc:!fr.full});list.push({id,t:+fr.t.toFixed(2),full:fr.full})}
  const best=res.frames.filter(x=>x.full).sort((a,b)=>b.s-a.s)[0]||res.frames[0];const prev=await makePrev(best.blob);
  await idbDo("readwrite",x=>x.put({id:vid,floor:f,t,name:"tiroir-video.jpg",type:"image/jpeg",blob:best.blob,prev,vid:{dur:res.dur,frames:list}}));
  PH.push({id:vid,floor:f,t,size:best.blob.size,vid:true});return vid}
async function tvMake(f){
  if(!ED)return;const src=await tvCapture(f);if(!src)return;
  const v=document.createElement("div");v.className="tc tcr";v.innerHTML=`<div class="tcs"><b>🎬 Tri des images…</b><p id="tcp">Lecture de la vidéo</p><div class="bar"><i id="tcbar"></i></div></div>`;
  document.body.appendChild(v);document.body.style.overflow="hidden";
  let res;try{res=await tvFrames(src,(p,m)=>{$("tcp").textContent=m;$("tcbar").style.width=p*100+"%"})}
  catch(e){v.remove();document.body.style.overflow="";toast("Vidéo illisible : "+e.message,5000);return}
  const best=res.frames.filter(x=>x.full).sort((a,b)=>b.s-a.s)[0],url=URL.createObjectURL(best.blob),mo=res.frames.reduce((t,x)=>t+x.blob.size,0)/1048576;
  v.innerHTML=`<div class="tcs wide"><b>✓ ${res.frames.length} images gardées</b><p>dont ${TV_SHARP} en pleine qualité (${res.W}×${res.H}) · ${mo.toFixed(1)} Mo. Voici la plus nette :</p>
    <img src="${url}" alt="Image la plus nette du tiroir"><div class="acts"><button class="btn" type="button" data-t="no">Annuler</button><button class="btn" type="button" data-t="again">Refilmer</button><button class="btn pri grow" type="button" data-t="keep">Garder</button></div></div>`;
  v._close=()=>v.querySelector('[data-t="no"]').click();
  v.addEventListener("click",async e=>{const b=e.target.closest("[data-t]");if(!b)return;const t=b.dataset.t;URL.revokeObjectURL(url);v.remove();document.body.style.overflow="";
    if(t==="again"){tvMake(f);return}
    if(t==="keep"){try{const id=await tvSave(f,res);carPick[f]=id;log("photo","Tiroir vidéo ajouté",`Étage ${f} · ${res.frames.length} images`);save();render();toast("🎬 Tiroir vidéo gardé")}catch(x){toast("Mémoire pleine : tiroir non gardé")}}})}

// 4) la vue : glisser = avancer dans le tiroir ; au lâcher, l'image nette la plus proche ; deux doigts = zoom ; léger relief avec le téléphone
async function vidView(id){
  const p=await phGet(id);if(!p||!p.vid)return;const fr=p.vid.frames,n=fr.length,sharp=fr.map((x,i)=>x.full?i:-1).filter(i=>i>=0);
  const v=document.createElement("div");v.className="mv vv";
  v.innerHTML=`<div class="mvs"><div class="mvt"><div class="mvz"><img class="fa" alt="Tiroir de l'étage ${p.floor}"><img class="fb" alt=""></div></div><div class="vpos"><i></i></div></div>
    <div class="vth">${sharp.map(i=>`<button type="button" data-k="${i}"><img alt=""></button>`).join("")}</div>
    <div class="vbar"><b>🎬 Étage ${p.floor} · tiroir vidéo</b><span class="grow"></span>${ED?'<button class="btn bad" type="button" data-v="del">Supprimer</button>':""}</div>
    <p class="vhint">Glisse le doigt pour avancer · deux doigts pour zoomer · un toucher ferme</p>`;
  document.body.appendChild(v);document.body.style.overflow="hidden";
  const stage=v.querySelector(".mvs"),tilt=v.querySelector(".mvt"),zm=v.querySelector(".mvz"),fa=v.querySelector(".fa"),fb=v.querySelector(".fb");
  const urls=await Promise.all(fr.map(x=>phSrc(x.id,true)));
  urls.forEach(u=>{const i=new Image();i.src=u});// préchargement : le glissé reste fluide
  v.querySelectorAll(".vth button").forEach(b=>b.querySelector("img").src=urls[+b.dataset.k]);
  let idx=sharp[0]??0,s=1,x=0,y=0,tx=0,ty=0,cx=0,cy=0,raf=0;
  const show=(k,soft)=>{idx=Math.max(0,Math.min(n-1,k));if(soft){fb.src=urls[idx];fb.classList.remove("on");void fb.offsetWidth;fb.classList.add("on");setTimeout(()=>{fa.src=urls[idx];fb.classList.remove("on")},260)}else fa.src=urls[idx];
    v.querySelector(".vpos i").style.left=idx/(n-1||1)*100+"%";v.querySelectorAll(".vth button").forEach(b=>b.classList.toggle("on",+b.dataset.k===idx))};
  const snap=()=>{const j=sharp.reduce((a,b)=>Math.abs(b-idx)<Math.abs(a-idx)?b:a,sharp[0]);if(j!==idx)show(j,true)};
  show(idx);
  const apply=()=>{zm.style.transform=`translate(${x}px,${y}px) scale(${s})`};
  const onOri=e=>{if(e.beta==null)return;tx=Math.max(-6,Math.min(6,(e.beta-35)*.25));ty=Math.max(-6,Math.min(6,e.gamma*.25))};
  addEventListener("deviceorientation",onOri);
  const tick=()=>{raf=requestAnimationFrame(tick);cx+=(tx-cx)*.12;cy+=(ty-cy)*.12;tilt.style.transform=`rotateX(${cx.toFixed(2)}deg) rotateY(${cy.toFixed(2)}deg)`};tick();
  const close=()=>{cancelAnimationFrame(raf);removeEventListener("deviceorientation",onOri);v.remove();document.body.style.overflow=""};v._close=close;
  v.querySelector(".vth").onclick=e=>{const b=e.target.closest("[data-k]");if(b){s=1;x=y=0;apply();show(+b.dataset.k,true)}};
  v.querySelector(".vbar").onclick=async e=>{const b=e.target.closest("[data-v]");if(!b)return;
    if(b.dataset.v==="del"){if(b.dataset.sure){await tirDel(id);close()}else{b.dataset.sure=1;b.textContent="Sûr ? Re-toucher"}}};
  const pts=new Map();let start=null,pinch=null,moved=false,lastTap=0,tapT=null;
  stage.addEventListener("pointerdown",e=>{stage.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){start={x:e.clientX,y:e.clientY,ox:x,oy:y,i:idx,t:Date.now()};moved=false}
    if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s,ox:x,oy:y};moved=true;snap()}});
  stage.addEventListener("pointermove",e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pinch&&pts.size===2){const [a,b]=[...pts.values()];const ns=Math.min(8,Math.max(1,pinch.s*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d));x=pinch.ox*ns/pinch.s;y=pinch.oy*ns/pinch.s;s=ns;if(s===1)x=y=0;apply();return}
    if(start&&pts.size===1){const dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.hypot(dx,dy)>8)moved=true;if(!moved)return;
      if(s>1){x=start.ox+dx;y=start.oy+dy;apply();return}
      const r=stage.getBoundingClientRect(),d=Math.abs(dx)>=Math.abs(dy)?-dx/r.width:-dy/r.height;const k=Math.round(start.i+d*n*1.1);if(k!==idx)show(k)}});
  const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null;
    if(pts.size===0&&start){
      if(moved&&s===1)snap();
      else if(!moved&&Date.now()-start.t<350){const t=Date.now();
        if(t-lastTap<300){clearTimeout(tapT);lastTap=0;if(s>1){s=1;x=y=0}else{snap();s=2.5}zm.style.transition="transform .2s";apply();setTimeout(()=>zm.style.transition="",220)}
        else{lastTap=t;tapT=setTimeout(close,300)}}}
    if(pts.size===0)start=null};
  stage.addEventListener("pointerup",up);stage.addEventListener("pointercancel",up);
  stage.addEventListener("wheel",e=>{e.preventDefault();if(e.ctrlKey||s>1){s=Math.min(8,Math.max(1,s*(e.deltaY<0?1.2:1/1.2)));if(s===1)x=y=0;apply()}else{show(idx+(e.deltaY>0?1:-1));clearTimeout(tapT);tapT=setTimeout(snap,250)}},{passive:false});
  addEventListener("keydown",function k(e){if(!v.isConnected){removeEventListener("keydown",k);return}if(e.key==="ArrowRight"){show(idx+1)}if(e.key==="ArrowLeft"){show(idx-1)}});
}

/* anciens tiroirs 3D raccordés (v1.3) : on peut encore les voir et les supprimer */
// 4) vue en relief : le tiroir s'incline avec le téléphone ; deux doigts = zoom ; toucher une zone = la photo d'origine, nette
async function mosView(id){
  const p=await phGet(id);if(!p||!p.mos)return;const parts=p.mos.parts||[];
  const v=document.createElement("div");v.className="mv";
  v.innerHTML=`<div class="mvs"><div class="mvt"><div class="mvz"><img alt="Tiroir de l'étage ${p.floor}">${parts.map((q,i)=>`<i data-pi="${i}" style="left:${q.x*100}%;top:${q.y*100}%;width:${q.w*100}%;height:${q.h*100}%"></i>`).join("")}</div></div></div>
    <div class="vbar"><b>🧩 Étage ${p.floor} · tiroir 3D</b><span class="grow"></span>${ED?'<button class="btn bad" type="button" data-v="del">Supprimer</button>':""}</div>
    <p class="vhint">Penche le téléphone · deux doigts pour zoomer · touche une zone pour la photo nette · touche à côté pour fermer</p>`;
  document.body.appendChild(v);document.body.style.overflow="hidden";
  const img=v.querySelector("img"),stage=v.querySelector(".mvs"),tilt=v.querySelector(".mvt"),zm=v.querySelector(".mvz");img.src=await phSrc(id,true);
  let s=1,x=0,y=0,tx=18,ty=0,cx=0,cy=0,gyro=false,raf=0;
  const apply=()=>{zm.style.transform=`translate(${x}px,${y}px) scale(${s})`};
  const onOri=e=>{if(e.beta==null)return;gyro=true;tx=Math.max(-14,Math.min(14,(e.beta-35)*.5));ty=Math.max(-14,Math.min(14,e.gamma*.5))};
  addEventListener("deviceorientation",onOri);setTimeout(()=>{if(!gyro)tx=0},700);
  const tick=()=>{raf=requestAnimationFrame(tick);cx+=(tx-cx)*.12;cy+=(ty-cy)*.12;tilt.style.transform=`rotateX(${cx.toFixed(2)}deg) rotateY(${cy.toFixed(2)}deg)`};tick();
  stage.addEventListener("pointermove",e=>{if(gyro||e.pointerType!=="mouse")return;const r=stage.getBoundingClientRect();ty=((e.clientX-r.left)/r.width-.5)*16;tx=-((e.clientY-r.top)/r.height-.5)*16});
  const close=()=>{cancelAnimationFrame(raf);removeEventListener("deviceorientation",onOri);v.remove();document.body.style.overflow=""};v._close=close;
  v.querySelector(".vbar").onclick=async e=>{const b=e.target.closest("[data-v]");if(!b)return;
    if(b.dataset.v==="del"){if(b.dataset.sure){await tirDel(id);close()}else{b.dataset.sure=1;b.textContent="Sûr ? Re-toucher"}}};
  const pts=new Map();let start=null,pinch=null,moved=false;
  stage.addEventListener("pointerdown",e=>{stage.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){start={x:e.clientX,y:e.clientY,ox:x,oy:y,t:Date.now()};moved=false}
    if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s,ox:x,oy:y};moved=true}});
  stage.addEventListener("pointermove",e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pinch&&pts.size===2){const [a,b]=[...pts.values()];const ns=Math.min(8,Math.max(1,pinch.s*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d));x=pinch.ox*ns/pinch.s;y=pinch.oy*ns/pinch.s;s=ns;if(s===1)x=y=0;apply();return}
    if(start&&pts.size===1){const dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.hypot(dx,dy)>8)moved=true;if(s>1&&moved){x=start.ox+dx;y=start.oy+dy;apply()}}});
  const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null;
    if(pts.size===0&&start&&!moved&&Date.now()-start.t<400){
      const hit=document.elementsFromPoint(e.clientX,e.clientY).filter(el=>el.dataset&&el.dataset.pi!=null);
      if(hit.length){// la photo dont le centre est le plus proche du doigt
        const best=hit.map(el=>{const r=el.getBoundingClientRect();return {el,d:Math.hypot(e.clientX-r.left-r.width/2,e.clientY-r.top-r.height/2)}}).sort((a,b)=>a.d-b.d)[0].el;
        best.classList.add("hit");setTimeout(()=>phView(parts[+best.dataset.pi].id),160);setTimeout(()=>best.classList.remove("hit"),600)}
      else close()}
    if(pts.size===0)start=null};
  stage.addEventListener("pointerup",up);stage.addEventListener("pointercancel",up);
  stage.addEventListener("wheel",e=>{e.preventDefault();s=Math.min(8,Math.max(1,s*(e.deltaY<0?1.2:1/1.2)));if(s===1)x=y=0;apply()},{passive:false});
}
async function tirDel(mid){const ids=PH.filter(p=>p.id===mid||p.part===mid).map(p=>p.id);
  await idbDo("readwrite",s=>{ids.forEach(i=>s.delete(i))});
  ids.forEach(i=>["o","p"].forEach(k=>{const u=phUrl.get(i+":"+k);if(u)URL.revokeObjectURL(u);phUrl.delete(i+":"+k)}));
  const f=PH.find(p=>p.id===mid)?.floor;PH=PH.filter(p=>!ids.includes(p.id));log("photo","Tiroir supprimé",`Étage ${f}`);save();render()}
