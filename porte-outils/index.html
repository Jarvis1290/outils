<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Porte-outils CNC</title>
<meta name="theme-color" content="#1d4f73">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#eef1f3; --surface:#ffffff; --surface-2:#f6f8f9; --line:#d5dce1;
  --ink:#16212b; --muted:#5c6b77; --primary:#1d4f73; --primary-ink:#ffffff;
  --sel:#ffe3a3; --sel-line:#d99a00; --ok:#2e7d4f; --warn:#b26a00; --danger:#b3261e;
  --mono:ui-monospace,"Roboto Mono","Cascadia Mono","Consolas",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1519;--surface:#172128;--surface-2:#1d2830;--line:#2c3a44;
    --ink:#e5ebef;--muted:#95a5b1;--primary:#5aa3d6;--primary-ink:#0c1419;
    --sel:#4a3b12;--sel-line:#f0b429;--ok:#5cc28a;--warn:#f0a53b;--danger:#ff8a80;color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--sans);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.code{font-family:var(--mono);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
[hidden]{display:none!important}

.top{position:sticky;top:0;z-index:5;background:var(--primary);color:var(--primary-ink);
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;display:flex;align-items:center;gap:12px}
.top h1{margin:0;font-size:20px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .back{background:none;border:0;color:inherit;font-size:22px;padding:4px 8px 4px 0;cursor:pointer}
main{padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px));max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.nav a{flex:1;text-align:center;padding:12px 4px;text-decoration:none;color:var(--muted);font-size:13px;font-weight:600}
.nav a.on{color:var(--primary);box-shadow:inset 0 3px 0 var(--primary)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);
  border-radius:10px;padding:12px 16px;min-height:52px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.row:focus-visible{outline:3px solid var(--sel-line);outline-offset:2px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn.huge{min-height:120px;font-size:22px;flex-direction:column;gap:6px}
.btn.huge svg{width:44px;height:44px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btns>.btn{flex:1 1 160px}

input,select,textarea{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:12px;min-height:50px}
textarea{min-height:80px;resize:vertical}
.field{display:flex;flex-direction:column;gap:6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.inline{display:flex;gap:12px}
.inline>input{flex:1;min-width:0}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;
  text-align:left;width:100%;cursor:pointer;min-height:56px;color:var(--ink);text-decoration:none}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .s{font-size:14px;color:var(--muted)}
.row .d{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.row.sel{background:var(--sel);box-shadow:inset 4px 0 0 var(--sel-line)}
.empty{padding:16px;color:var(--muted)}

.po-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px}
.po-code{font-family:var(--mono);font-size:34px;font-weight:700;letter-spacing:.02em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 12px;font-size:14px}
.chip.st-Monté{border-color:var(--ok);color:var(--ok)}
.chip.st-Réparation{border-color:var(--warn);color:var(--warn)}
.chip.st-Retiré{border-color:var(--danger);color:var(--danger)}
.current{border-left:6px solid var(--primary)}
.current .ref{font-family:var(--mono);font-size:30px;font-weight:700;color:var(--primary);overflow-wrap:anywhere;margin:4px 0}
.current .spec{font-size:18px}
.current.vide{border-left-color:var(--line)}
.current.vide .ref{color:var(--muted);font-family:var(--sans);font-size:22px}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.cols{display:grid;gap:16px}
@media (min-width:760px){.cols{grid-template-columns:1fr 1fr;align-items:start}}

.banner{border:1px solid var(--warn);color:var(--warn);background:var(--surface);border-radius:10px;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner span{flex:1 1 200px}
.confirm{border:2px solid var(--danger);border-radius:10px;padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:12px}

.toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);
  border-radius:10px;padding:14px 16px;font-weight:600;text-align:center;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:none}

/* scanner */
#scan{position:fixed;inset:0;z-index:20;background:#000;display:flex;flex-direction:column}
#scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#scan .frame{position:absolute;left:50%;top:45%;width:min(70vw,70vh,340px);aspect-ratio:1;transform:translate(-50%,-50%);
  border:3px solid rgba(255,255,255,.9);border-radius:18px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
#scan .frame.hit{border-color:#5cc28a}
#scan .bar{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;color:#fff}
#scan .bar button,#scan .foot button{background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:10px;min-height:48px;padding:0 16px;font-weight:600}
#scan .foot{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 20px);text-align:center;color:#fff}
#scan .msg{margin-bottom:12px;text-shadow:0 1px 3px #000}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<header class="top"><button class="back" id="back" hidden aria-label="Retour">←</button><h1 id="title">Porte-outils</h1></header>
<main id="view"></main>
<nav class="nav" id="nav">
  <a href="#/" data-n="home">Scanner</a>
  <a href="#/porte-outils" data-n="po">Porte-outils</a>
  <a href="#/outils" data-n="outils">Outils</a>
  <a href="#/donnees" data-n="data">Données</a>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div id="scan" hidden>
  <video id="video" playsinline muted></video>
  <div class="frame" id="frame"></div>
  <div class="bar"><strong>Scanner un QR</strong><button id="torch" hidden>Lampe</button></div>
  <div class="foot"><div class="msg" id="scanMsg">Vise le QR du porte-outil</div><button id="scanClose">Fermer</button></div>
  <canvas id="scanCanvas" hidden></canvas>
</div>

<script src="vendor/jsQR.js"></script>
<script>
/* === SAUVEGARDE ATELIER v1 — début (copie identique dans chaque app, source : /mnt/project-files/sauvegarde-drive) === */
/* Sauvegarde Drive commune aux apps d'atelier.
   - 💾 Sauvegarder : fichier .txt daté (App_AAAA-MM-JJ_HHhMM.txt) → menu Partager d'Android (Drive), sinon téléchargement.
   - 📂 Importer : lit le .txt, aperçu, confirmation ; les données actuelles partent d'abord dans « Copies avant import ».
   - Copies avant import : jamais effacées, on peut revenir à n'importe laquelle (ce retour fait lui-même une copie).
   - Rappel : bandeau si aucune sauvegarde depuis 7 jours et que les données ont changé depuis.
   Usage :
     Sauvegarde.init({ app:"PorteOutils", nom:"Porte-outils", cle:"porteoutils-cnc-v1", version:"1.1",
       lire:() => donnees, ecrire:d => {...}, resume:d => "12 porte-outils…", valider:d => null|"erreur", vide:d => true|false });
     Sauvegarde.panneau(element)   // carte avec boutons, aperçu d'import, copies
     Sauvegarde.bandeau()          // HTML du rappel ("" si pas besoin)
     Sauvegarde.copieAvant(raison) // à appeler avant tout autre remplacement des données ; false = échec
*/
const Sauvegarde = (() => {
  const MARQUE = "---- DONNÉES (ne pas modifier sous cette ligne) ----";
  let C = null;
  const p2 = n => String(n).padStart(2, "0");
  const ech = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const dateFr = d => `${p2(d.getDate())}.${p2(d.getMonth()+1)}.${d.getFullYear()} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
  const empreinte = s => { let h = 2166136261; for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); };
  const kEtat = () => C.cle + "-sauvegarde", kCopies = () => C.cle + "-copies";
  const lireLS = (k, def) => { try{ const v = JSON.parse(localStorage.getItem(k)); return v ?? def; }catch(e){ return def; } };
  const ecrireLS = (k, v) => { try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } };
  const etat = () => lireLS(kEtat(), {derniere:null, empreinte:null});
  const copies = () => lireLS(kCopies(), []);
  const actuel = () => JSON.stringify(C.lire());
  let msgT;
  function message(t, erreur){
    let m = document.getElementById("sv-msg");
    if(!m){ m = document.createElement("div"); m.id = "sv-msg"; m.className = "sv-msg"; m.setAttribute("role","status"); document.body.appendChild(m); }
    m.textContent = t; m.classList.toggle("sv-err", !!erreur); m.classList.add("on"); clearTimeout(msgT); msgT = setTimeout(() => m.classList.remove("on"), 3200);
  }

  function init(cfg){ C = Object.assign({version:"", resume:() => "", valider:() => null, vide:() => false}, cfg); style(); }

  function nomFichier(d){ return `${C.app}_${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}_${p2(d.getHours())}h${p2(d.getMinutes())}.txt`; }
  function contenu(d, donnees){
    const env = {format:"sauvegarde-atelier", formatVersion:1, app:C.app, nom:C.nom, appVersion:C.version, date:d.toISOString(), donnees};
    return ["SAUVEGARDE ATELIER", `App : ${C.nom}${C.version ? " v" + C.version : ""}`, `Date : ${dateFr(d)}`,
      `Contenu : ${C.resume(donnees)}`, "Pour remettre ces données : dans l'app, bouton 📂 Importer.", "", MARQUE, JSON.stringify(env)].join("\n");
  }

  async function sauvegarder(){
    const d = new Date(), donnees = C.lire(), nom = nomFichier(d), txt = contenu(d, donnees);
    const fichier = new File([txt], nom, {type:"text/plain"});
    let fait = false;
    if(navigator.canShare && navigator.share){
      let ok = false; try{ ok = navigator.canShare({files:[fichier]}); }catch(e){}
      if(ok){
        try{ await navigator.share({files:[fichier], title:nom}); fait = true; message("Sauvegarde envoyée : " + nom); }
        catch(e){ if(e && e.name === "AbortError"){ message("Sauvegarde annulée"); return false; } }
      }
    }
    if(!fait){
      const a = document.createElement("a"); a.href = URL.createObjectURL(fichier); a.download = nom;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      fait = true; message("Fichier enregistré dans Téléchargements : " + nom);
    }
    ecrireLS(kEtat(), {derniere:d.toISOString(), empreinte:empreinte(JSON.stringify(donnees))});
    return true;
  }

  async function lireFichier(f){
    const t = await f.text();
    const i = t.indexOf(MARQUE);
    let env;
    try{ env = JSON.parse(i >= 0 ? t.slice(i + MARQUE.length) : t); }catch(e){ throw new Error("ce n'est pas une sauvegarde lisible"); }
    if(!env || env.format !== "sauvegarde-atelier" || !env.donnees) throw new Error("ce n'est pas une sauvegarde d'atelier");
    if(env.app !== C.app) throw new Error(`c'est une sauvegarde de « ${env.nom || env.app} », pas de « ${C.nom} »`);
    const err = C.valider(env.donnees); if(err) throw new Error(err);
    return env;
  }

  function copieAvant(raison){
    const l = copies();
    l.unshift({date:new Date().toISOString(), raison, resume:C.resume(C.lire()), donnees:C.lire()});
    return ecrireLS(kCopies(), l);
  }
  function remplacer(donnees, raison){
    if(!copieAvant(raison)){ message("Mémoire du téléphone pleine : copie impossible, rien n'a été remplacé. Sauvegarde d'abord sur Drive.", true); return false; }
    C.ecrire(donnees); return true;
  }

  function bandeau(){
    if(!C) return "";
    const e = etat(), donnees = actuel();
    if(C.vide(C.lire())) return "";
    const jours = e.derniere ? Math.floor((Date.now() - new Date(e.derniere).getTime()) / 864e5) : null;
    if(jours !== null && (jours < 7 || e.empreinte === empreinte(donnees))) return "";
    return `<div class="sv-bandeau"><span>💾 ${jours === null ? "Jamais sauvegardé sur Drive." : `Pas de sauvegarde depuis ${jours} jours.`} Tes données ne sont que dans ce téléphone.</span><button type="button" class="sv-btn sv-save" onclick="Sauvegarde.sauvegarder().then(ok=>ok&&this.closest('.sv-bandeau').remove())">💾 Sauvegarder</button></div>`;
  }

  function panneau(el){
    const e = etat(), l = copies(), d = e.derniere ? new Date(e.derniere) : null;
    const change = d && e.empreinte !== empreinte(actuel());
    el.innerHTML = `<div class="sv-carte">
      <div class="sv-titre">💾 Sauvegarde Drive</div>
      <div class="sv-info">Dernière sauvegarde : <b>${d ? dateFr(d) : "jamais"}</b>${change ? " · modifié depuis" : ""}</div>
      <div class="sv-btns"><button type="button" class="sv-btn sv-save" data-sv="save">💾 Sauvegarder</button>
        <label class="sv-btn sv-imp">📂 Importer<input type="file" accept=".txt,.json,text/plain,application/json" hidden></label></div>
      <div class="sv-aide">Choisis Drive dans le menu Partager, dossier <b>Sauvegardes atelier</b>. Chaque sauvegarde est un nouveau fichier daté, rien n'est écrasé.</div>
      <div class="sv-apercu" hidden></div>
      <details class="sv-copies"><summary>Copies avant import (${l.length})</summary>
        ${l.length ? l.map((c, i) => `<div class="sv-copie"><div><b>${dateFr(new Date(c.date))}</b> · ${ech(c.raison)}<br><small>${ech(c.resume)}</small></div><button type="button" class="sv-btn" data-sv="rev" data-i="${i}">Revenir</button></div>`).join("")
          : `<div class="sv-aide">Aucune pour l'instant. Avant chaque import, tes données actuelles sont gardées ici, jamais effacées.</div>`}
      </details></div>`;
    const ap = el.querySelector(".sv-apercu"), inp = el.querySelector("input[type=file]");
    el.querySelector('[data-sv="save"]').onclick = () => sauvegarder().then(() => panneau(el));
    inp.onchange = async () => {
      const f = inp.files[0]; if(!f) return;
      let env;
      try{ env = await lireFichier(f); }catch(err){ inp.value = ""; message("Import impossible : " + err.message, true); return; }
      ap.hidden = false;
      ap.innerHTML = `<div><b>${ech(f.name)}</b></div>
        <div>Sauvegarde du <b>${dateFr(new Date(env.date))}</b>${env.appVersion ? ` (v${ech(env.appVersion)})` : ""}</div>
        <div>Fichier : ${ech(C.resume(env.donnees))}</div><div>Actuellement : ${ech(C.resume(C.lire()))}</div>
        <div class="sv-aide">Tes données actuelles seront d'abord gardées dans « Copies avant import ».</div>
        <div class="sv-btns"><button type="button" class="sv-btn sv-ok" data-sv="ok">Remplacer mes données</button><button type="button" class="sv-btn" data-sv="no">Annuler</button></div>`;
      ap.querySelector('[data-sv="no"]').onclick = () => { inp.value = ""; ap.hidden = true; };
      ap.querySelector('[data-sv="ok"]').onclick = () => {
        if(remplacer(env.donnees, "import " + f.name)){ message("Données importées"); panneau(el); }
      };
    };
    el.querySelectorAll('[data-sv="rev"]').forEach(b => b.onclick = () => {
      const c = copies()[+b.dataset.i];
      if(!c || !confirm(`Revenir aux données du ${dateFr(new Date(c.date))} ?\n(${c.resume})\nTes données actuelles seront gardées comme nouvelle copie.`)) return;
      if(remplacer(c.donnees, "retour à la copie du " + dateFr(new Date(c.date)))){ message("Données remises"); panneau(el); }
    });
  }

  function style(){
    if(document.getElementById("sv-style")) return;
    const s = document.createElement("style"); s.id = "sv-style";
    s.textContent = `
.sv-carte{border:2px solid #1f8a5b;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--surface,transparent)}
.sv-titre{font-weight:700;font-size:18px}
.sv-info,.sv-aide{font-size:14px;opacity:.85}
.sv-btns{display:flex;gap:12px;flex-wrap:wrap}
.sv-btn{flex:1 1 140px;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 16px;border-radius:10px;
  border:1px solid #1f8a5b;background:transparent;color:inherit;font:inherit;font-weight:700;cursor:pointer}
.sv-btn.sv-save{background:linear-gradient(135deg,#1f8a5b,#2a9d8f);border-color:transparent;color:#fff}
.sv-btn.sv-imp{color:#1f8a5b}
.sv-btn.sv-ok{background:#c0392b;border-color:#c0392b;color:#fff}
.sv-apercu{border:2px solid #c0392b;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.sv-copies summary{cursor:pointer;font-weight:600;padding:6px 0}
.sv-copie{display:flex;gap:12px;align-items:center;justify-content:space-between;border-top:1px solid rgba(127,127,127,.3);padding:8px 0}
.sv-copie .sv-btn{flex:0 0 auto;min-height:44px}
.sv-bandeau{border:2px solid #1f8a5b;border-radius:10px;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.sv-bandeau span{flex:1 1 200px}
.sv-bandeau .sv-btn{flex:0 0 auto}
.sv-msg{position:fixed;left:16px;right:16px;bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:50;background:#1f8a5b;color:#fff;border-radius:10px;
  padding:14px 16px;font-weight:600;text-align:center;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
.sv-msg.on{opacity:1;transform:none}
.sv-msg.sv-err{background:#c0392b}
@media (prefers-color-scheme:dark){.sv-btn.sv-imp{color:#5cd69a}}`;
    document.head.appendChild(s);
  }

  return {init, sauvegarder, panneau, bandeau, copieAvant, remplacer, lireFichier, nomFichier};
})();
/* === SAUVEGARDE ATELIER v1 — fin === */
</script>
<script>
"use strict";
/* ================= Données ================= */
const KEY = "porteoutils-cnc-v1";
const EMPTY = () => ({porteOutils:[], outils:[], montages:[], machines:["Fp4","DMU 50 eco"], lastExport:null, changesSinceExport:0});
let db = load();
function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && s.porteOutils) return Object.assign(EMPTY(), s); }catch(e){}
  return EMPTY();
}
function save(changed=true){
  if(changed) db.changesSinceExport = (db.changesSinceExport||0) + 1;
  try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){ toast("Enregistrement impossible sur ce téléphone"); }
}
const APP_VERSION = "1.2";
Sauvegarde.init({app:"PorteOutils", nom:"Porte-outils", cle:KEY, version:APP_VERSION,
  lire:() => ({porteOutils:db.porteOutils, outils:db.outils, montages:db.montages, machines:db.machines}),
  ecrire:d => { db = Object.assign(EMPTY(), d); save(false); route(); },
  resume:d => `${(d.porteOutils||[]).length} porte-outils, ${(d.outils||[]).length} outils, ${(d.montages||[]).length} montages`,
  vide:d => !d.porteOutils.length,
  valider:d => Array.isArray(d.porteOutils) && Array.isArray(d.outils) && Array.isArray(d.montages) ? null : "données de porte-outils incomplètes"});
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}

const STATUTS = ["Monté","En stock","Réparation","Retiré"];
const TYPES_ATT = ["SK40","HSK63","Mandrin","Pince ER16","Pince ER32","Pince ER76","Weldon","Schunk","Frettage","Custom","Autre"];
const TYPES_OUTIL = ["Fraise","Fraise Eb","Fraise Eb-Fin","Fraise Fin","Fraise à plaquettes","Mèche","Mèche NC","Alésoir","Taraud","Scie","Autre"];

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const str = v => (v === null || v === undefined) ? "" : String(v).trim();
const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : null; };
const pad = n => String(n).padStart(2,"0");
function nowStamp(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fmtDate(s){ const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s||""); return m ? `${m[3]}.${m[2]}.${m[1]}` : esc(s); }
function normCode(raw){
  let s = str(raw).toUpperCase();
  const h = s.match(/PO-\d+/); if(h) s = h[0];
  if(/^\d+$/.test(s)) s = "PO-" + s.padStart(4,"0");
  const m = /^PO-?(\d+)$/.exec(s); if(m) s = "PO-" + m[1].padStart(4,"0");
  return s;
}
const getPO = c => db.porteOutils.find(p => p.CodePO === c);
const getOutil = r => db.outils.find(o => o.RefOutil === r);
// plus récent d'abord ; à date égale, le dernier enregistré gagne
const newestFirst = list => list.map((m,i) => [m,i]).sort((a,b) => (b[0].DateMontage||"").localeCompare(a[0].DateMontage||"") || (b[1]-a[1])).map(x => x[0]);
const montagesOf = c => newestFirst(db.montages.filter(m => m.IDPorteOutil === c));
const currentOf = c => montagesOf(c)[0] || null;
function whereMounted(ref){ return db.porteOutils.filter(p => { const m = currentOf(p.CodePO); return m && m.RefOutil === ref; }); }
function outilSpec(o){
  if(!o) return "";
  const p = [o.TypeOutil, o.Diametre != null && o.Diametre !== "" ? "Ø" + o.Diametre : "", o.NbDents ? "Z" + o.NbDents : "", o.MatiereOutil].filter(Boolean);
  return p.join("  ·  ");
}
function sortedOutils(){ return [...db.outils].sort((a,b) => (num(a.Diametre)??999)-(num(b.Diametre)??999) || str(a.RefOutil).localeCompare(str(b.RefOutil))); }

function addMontage(m){
  const d = new Date();
  db.montages.push(Object.assign({IDMontage:`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}-${Math.random().toString(36).slice(2,5)}`,
    DateMontage:nowStamp(), IDPorteOutil:"", RefOutil:"", LongSortie:"", Machine:"", PosteT:"", MatiereUsinee:"", Notes:""}, m));
}

  $("#fM").onsubmit = e => { e.preventDefault(); const v = $("#newM").value.trim(); if(v && !db.machines.includes(v)){ db.machines.push(v); save(); } vData(); };
}

/* ================= Scanner ================= */
let stream = null, scanning = false, detector = null, torchOn = false;
async function openScanner(){
  const box = $("#scan"), msg = $("#scanMsg");
  box.hidden = false; msg.textContent = "Ouverture de la caméra…"; $("#frame").classList.remove("hit");
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}, width:{ideal:1280}, height:{ideal:720}}, audio:false});
  }catch(e){ msg.textContent = "Caméra refusée ou indisponible. Autorise la caméra pour ce site dans les réglages du navigateur."; return; }
  const v = $("#video"); v.srcObject = stream; await v.play().catch(()=>{});
  msg.textContent = "Vise le QR du porte-outil";
  const track = stream.getVideoTracks()[0];
  try{ const caps = track.getCapabilities ? track.getCapabilities() : {}; $("#torch").hidden = !caps.torch; }catch(e){ $("#torch").hidden = true; }
  if("BarcodeDetector" in window){ try{ const f = await BarcodeDetector.getSupportedFormats(); if(f.includes("qr_code")) detector = new BarcodeDetector({formats:["qr_code"]}); }catch(e){ detector = null; } }
  scanning = true; loop();
}
function closeScanner(){
  scanning = false; torchOn = false;
  if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
  $("#scan").hidden = true;
}
async function loop(){
  if(!scanning) return;
  const v = $("#video");
  let text = null;
  if(v.readyState >= 2){
    try{
      if(detector){ const r = await detector.detect(v); if(r && r.length) text = r[0].rawValue; }
      else if(window.jsQR){
        const c = $("#scanCanvas"), w = 640, h = Math.round(640 * v.videoHeight / v.videoWidth) || 480;
        c.width = w; c.height = h; const ctx = c.getContext("2d", {willReadFrequently:true}); ctx.drawImage(v, 0, 0, w, h);
        const r = jsQR(ctx.getImageData(0, 0, w, h).data, w, h, {inversionAttempts:"attemptBoth"}); if(r) text = r.data;
      }
    }catch(e){}
  }
  if(text){ onScan(text); return; }
  setTimeout(() => requestAnimationFrame(loop), 120);
}
function onScan(text){
  const code = normCode(text);
  $("#frame").classList.add("hit");
  try{ navigator.vibrate && navigator.vibrate(80); }catch(e){}
  closeScanner();
  if(!/^PO-\d{4,}$/.test(code)){ toast("QR non reconnu : " + text); return; }
  go("#/po/" + code);
}
$("#scanClose").onclick = closeScanner;
$("#torch").onclick = async () => { try{ torchOn = !torchOn; await stream.getVideoTracks()[0].applyConstraints({advanced:[{torch:torchOn}]}); }catch(e){ toast("Lampe indisponible"); } };

/* ================= Routeur ================= */
function route(){
  if(scanning) closeScanner();
  const h = decodeURIComponent(location.hash || "#/");
  let m;
  window.scrollTo(0,0);
  if((m = h.match(/^#\/po\/(.+)$/))) return vPO(normCode(m[1]));
  if((m = h.match(/^#\/montage\/(.+)$/))) return vMontage(normCode(m[1]));
  if((m = h.match(/^#\/outil\/(.+)$/))) return vOutil(m[1]);
  if((m = h.match(/^#\/outil-edit\/(.*)$/))) return vOutilEdit(m[1]);
  if(h === "#/porte-outils") return vPOList();
  if(h === "#/outils") return vOutils();
  if(h === "#/donnees") return vData();
  if((m = h.match(/^#(PO-?\d+)$/i))) return go("#/po/" + normCode(m[1]));
  return vHome();
}
window.addEventListener("hashchange", route);
route();

if("serviceWorker" in navigator && location.protocol === "https:"){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
